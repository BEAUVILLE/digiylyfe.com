name: Actualiser tarif entreprise avant indexation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-tarif-current-20260906.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Actualiser PAY et MARKET
        shell: python
        run: |
          from pathlib import Path

          page = Path('tarif-entreprise-petite-cote.html')
          s = page.read_text()
          replacements = [
              ('entreprise-cat-paiement-direct-wave-20260711', 'entreprise-cat-paiement-direct-wave-carnet-commerce-20260906'),
              ('JOBS, RESA, PAY, LOC, MARKET ou BUILD', 'JOBS, RESA, CARNET, LOC, COMMERCE ou BUILD'),
              ('<option value="PAY">PAY · suivi argent</option>', '<option value="CARNET">CARNET · suivi argent</option>'),
              ('<option value="MARKET">MARKET · produits</option>', '<option value="COMMERCE">COMMERCE · produits</option>'),
          ]
          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'Attendu exactement 1 occurrence de {old!r}, trouvé {count}')
              s = s.replace(old, new, 1)
          page.write_text(s)

          sitemap = Path('sitemap.xml')
          x = sitemap.read_text()
          old = '<url><loc>https://digiylyfe.com/tarif-entreprise-petite-cote.html</loc><lastmod>2026-08-05</lastmod></url>'
          new = '<url><loc>https://digiylyfe.com/tarif-entreprise-petite-cote.html</loc><lastmod>2026-09-06</lastmod></url>'
          if old not in x:
              raise SystemExit('Entrée sitemap tarif attendue introuvable')
          sitemap.write_text(x.replace(old, new, 1))
      - name: Vérifier la cohérence active
        shell: bash
        run: |
          grep -F 'JOBS, RESA, CARNET, LOC, COMMERCE ou BUILD' tarif-entreprise-petite-cote.html
          grep -F '<option value="CARNET">CARNET · suivi argent</option>' tarif-entreprise-petite-cote.html
          grep -F '<option value="COMMERCE">COMMERCE · produits</option>' tarif-entreprise-petite-cote.html
          ! grep -F '<option value="PAY">PAY · suivi argent</option>' tarif-entreprise-petite-cote.html
          ! grep -F '<option value="MARKET">MARKET · produits</option>' tarif-entreprise-petite-cote.html
          grep -F '<loc>https://digiylyfe.com/tarif-entreprise-petite-cote.html</loc><lastmod>2026-09-06</lastmod>' sitemap.xml
      - name: Commit et nettoyage
        shell: bash
        run: |
          git config user.name 'DIGIY LYFE'
          git config user.email 'baptistejb24@gmail.com'
          rm .github/workflows/fix-tarif-current-20260906.yml
          git add tarif-entreprise-petite-cote.html sitemap.xml .github/workflows/fix-tarif-current-20260906.yml
          git commit -m 'Actualiser tarif entreprise vers CARNET et COMMERCE'
          git push
