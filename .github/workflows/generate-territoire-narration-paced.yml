name: Generate paced TERRITOIRE narration

on:
  push:
    branches:
      - validation/captures-digiy-20260929
    paths:
      - '.github/workflows/generate-territoire-narration-paced.yml'
  workflow_dispatch:

jobs:
  narration:
    runs-on: ubuntu-24.04
    steps:
      - name: Generate paced French narration with Piper Siwis
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          cd work
          wget -q https://github.com/rhasspy/piper/releases/download/v1.2.0/piper_amd64.tar.gz
          tar -xzf piper_amd64.tar.gz
          wget -q -O fr_FR-siwis-medium.onnx "https://huggingface.co/rhasspy/piper-voices/resolve/main/fr/fr_FR/siwis/medium/fr_FR-siwis-medium.onnx?download=true"
          wget -q -O fr_FR-siwis-medium.onnx.json "https://huggingface.co/rhasspy/piper-voices/resolve/main/fr/fr_FR/siwis/medium/fr_FR-siwis-medium.onnx.json?download=true"

          declare -a lines=(
            "Sur la Petite Côte, DIGIYLYFE vous relie directement aux professionnels du territoire."
            "Se loger avec Chez Baptiste."
            "Se déplacer avec Lamine."
            "Faire réparer avec Babacar."
            "Acheter local chez Astou Boutique."
            "Trouver un service avec MANÉ et GNING."
            "Un territoire. Plusieurs besoins. Des contacts directs."
            "Explorez votre territoire avec DIGIYLYFE."
          )

          n=1
          for line in "${lines[@]}"; do
            printf "%s\n" "$line" | ./piper/piper               --model fr_FR-siwis-medium.onnx               --config fr_FR-siwis-medium.onnx.json               --output_file "seg_${n}.wav"
            n=$((n+1))
          done
      - name: Upload narration segments
        uses: actions/upload-artifact@v4
        with:
          name: digiy-territoire-narration-siwis-paced
          path: work/seg_*.wav
          retention-days: 14
