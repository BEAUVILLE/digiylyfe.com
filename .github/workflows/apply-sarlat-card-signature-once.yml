name: Apply Sarlat card signature once
on:
  push:
    paths:
      - '.github/workflows/apply-sarlat-card-signature-once.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install shared DIGIY signature and wire public pages
        shell: bash
        run: |
          python3 - <<'PY2'
          from pathlib import Path
          import base64,zlib,re
          PAYLOAD=''
          js=zlib.decompress(base64.b64decode(PAYLOAD)).decode('utf-8')
          assert 'CHEZ BAPTISTE · SARLAT' in js
          assert js.count('wp-content/uploads/2026/07/') >= 6
          assert 'tel:+33638329423' not in js
          asset=Path('assets/digiy-sarlat-baptiste-signature-v1.js')
          asset.parent.mkdir(parents=True,exist_ok=True)
          asset.write_text(js,encoding='utf-8')
          tag='<script src="/assets/digiy-sarlat-baptiste-signature-v1.js?v=20260828-v1" defer></script>'
          for name in ('index.html','territoire.html','sarlat.html'):
              p=Path(name); s=p.read_text(encoding='utf-8')
              if tag not in s:
                  if '</body>' not in s: raise SystemExit(f'body marker missing in {name}')
                  s=s.replace('</body>',tag+'\n</body>',1)
              p.write_text(s,encoding='utf-8')
          # Source HTML must no longer identify the homepage proof as Saly.
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          old='<a class="proofCard" href="https://part-chez-baptiste.digiylyfe.com/" aria-label="Ouvrir Chez Baptiste"><i aria-hidden="true">🏠</i><strong>Chez Baptiste</strong><small data-i18n="baptisteText">Hébergement · Saly</small><b data-i18n="seeCard">Voir l’exemple →</b></a>'
          new='<a class="proofCard" href="https://sarlat-chez-baptiste.digiylyfe.com/" aria-label="Ouvrir Chez Baptiste à Sarlat"><i aria-hidden="true">🏠</i><strong>Chez Baptiste · Sarlat</strong><small>Chambre privée · Périgord Noir</small><b data-i18n="seeCard">Voir la fiche →</b></a>'
          if old in s:
              s=s.replace(old,new,1)
          elif 'sarlat-chez-baptiste.digiylyfe.com/' not in s:
              raise SystemExit('homepage Chez Baptiste source marker not found')
          # Preserve validated architecture / PWA / LA VOIX.
          assert '/manifest.json?v=20260824-tarif-unique' in s
          assert "/sw.js?v=20260824-tarif-unique" in s
          assert ('LA VOIX' in s and 'ACTION PRO' in s)
          p.write_text(s,encoding='utf-8')
          sar=Path('sarlat.html').read_text(encoding='utf-8')
          assert '/manifest.json?v=20260824-tarif-unique' in sar
          assert 'sarlat-chez-baptiste.digiylyfe.com/' in sar
          terr=Path('territoire.html').read_text(encoding='utf-8')
          assert 'digiy-territoire-runtime-v1.js' in terr
          assert 'digiy-territoire-dordogne-projection-v1.js' in terr
          PY2
      - name: Commit validated signature
        shell: bash
        run: |
          git config user.name "DIGIYLYFE maintenance"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-sarlat-card-signature-once.yml
          git add index.html territoire.html sarlat.html assets/digiy-sarlat-baptiste-signature-v1.js
          git diff --cached --quiet || git commit -m "UI: align Chez Baptiste Sarlat signature across public pages"
          git push origin HEAD:main
