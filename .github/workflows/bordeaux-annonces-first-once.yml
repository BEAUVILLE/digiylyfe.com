name: Bordeaux annonces first once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move announcements first in Bordeaux
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('bordeaux.html')
          s=p.read_text(encoding='utf-8')
          old="var NEEDS=[['transport','🚗','DRIVER'],['artisan','🔧','ARTISAN'],['accommodation','🏠','LOGEMENT / LOC'],['food','🍽️','RESTAURANT'],['shopping','🛍️','MON COMMERCE'],['beauty','💅','BEAUTÉ & BIEN-ÊTRE'],['jobs','💼','JOBS / MISSIONS'],['announcements','⚡','ANNONCES / SERVICES'],['guidance','🎙️','LA VOIX']];"
          new="var NEEDS=[['announcements','⚡','ANNONCES / SERVICES'],['transport','🚗','DRIVER'],['artisan','🔧','ARTISAN'],['accommodation','🏠','LOGEMENT / LOC'],['food','🍽️','RESTAURANT'],['shopping','🛍️','MON COMMERCE'],['beauty','💅','BEAUTÉ & BIEN-ÊTRE'],['jobs','💼','JOBS / MISSIONS'],['guidance','🎙️','LA VOIX']];"
          if new in s:
              print('Already aligned; nothing to do.')
              raise SystemExit(0)
          if old not in s:
              raise SystemExit('Expected Bordeaux NEEDS order not found; aborting.')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY

          if git diff --quiet -- bordeaux.html; then
            echo "Nothing changed"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bordeaux.html
          git commit -m "Bordeaux: remonter annonces en première porte"
          git push origin HEAD:main
