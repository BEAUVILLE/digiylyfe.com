name: Refresh dossier payment asset
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oneoff-bust-prevalidation-cache-20260911.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh asset version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('preparer-ma-carte.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('digiy-prevalidation-flow-20260911.js?v=20260911-fiche-before-payment-v2','digiy-prevalidation-flow-20260911.js?v=20260911-payment-direct-v4')
          s=s.replace('digiy-prevalidation-flow-20260911.js?v=20260911-payment-direct-v3','digiy-prevalidation-flow-20260911.js?v=20260911-payment-direct-v4')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preparer-ma-carte.html
          git commit -m "fix: refresh direct payment asset [skip ci]"
          git push