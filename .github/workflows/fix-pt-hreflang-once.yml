name: Corriger hreflang portugais — une fois

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-pt-hreflang-once.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Aligner le portugais sur la vraie page canonique
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '<link rel="alternate" hreflang="pt" href="https://digiylyfe.com/?lang=pt"/>'
          new = '<link rel="alternate" hreflang="pt" href="https://digiylyfe.com/pt/"/>'
          if old not in text:
              raise SystemExit('Ancien hreflang PT introuvable : arrêt de sécurité.')
          text = text.replace(old, new, 1)
          if '?lang=pt' in text:
              raise SystemExit('Une ancienne URL ?lang=pt reste dans index.html.')
          if new not in text:
              raise SystemExit('Le hreflang PT propre n’a pas été posé.')
          path.write_text(text, encoding='utf-8')
          print('hreflang PT aligné sur /pt/.')
          PY

      - name: Retirer cette automatisation temporaire
        run: rm -f .github/workflows/fix-pt-hreflang-once.yml

      - name: Publier la correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-pt-hreflang-once.yml
          git commit -m "Corriger le hreflang portugais de l’accueil"
          git push
