# trigger 20260830
name: Harmoniser portes territoire et PWA temporaire

on:
  push:
    paths:
      - '.github/workflows/harmoniser-portes-pwa-temp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harmoniser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Harmoniser territoire et PWA
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          terr = Path('territoire.html')
          t = terr.read_text(encoding='utf-8')
          tag = '<script src="/assets/digiy-territoire-doors-style-v1.js?v=20260830-v1" defer></script>'
          if tag not in t:
              if '</body>' not in t:
                  raise SystemExit('territoire.html sans </body>')
              t = t.replace('</body>', tag + '\n</body>', 1)
          terr.write_text(t, encoding='utf-8')

          idx = Path('index.html')
          s = idx.read_text(encoding='utf-8')
          old = "/sw.js?v=20260824-tarif-unique"
          new = "/sw.js?v=20260830-territory-unified-v1"
          if new not in s:
              if s.count(old) != 1:
                  raise SystemExit(f'ancienne version PWA attendue 1 fois, trouvee {s.count(old)}')
              s = s.replace(old, new, 1)
          idx.write_text(s, encoding='utf-8')

          sw = Path('sw.js')
          w = sw.read_text(encoding='utf-8')
          oldv = "const DIGIY_PWA_VERSION = 'digiylyfe-pwa-20260829-voix';"
          newv = "const DIGIY_PWA_VERSION = 'digiylyfe-pwa-20260830-territory-unified-v1';"
          if newv not in w:
              if w.count(oldv) != 1:
                  raise SystemExit('version sw.js inattendue')
              w = w.replace(oldv, newv, 1)
          sw.write_text(w, encoding='utf-8')
          PY
      - name: Vérifier
        run: |
          set -euo pipefail
          test -f assets/digiy-territoire-doors-style-v1.js
          grep -F 'digiy-territoire-doors-style-v1.js?v=20260830-v1' territoire.html
          grep -F '/sw.js?v=20260830-territory-unified-v1' index.html
          grep -F "digiylyfe-pwa-20260830-territory-unified-v1" sw.js
          node --check assets/digiy-territoire-doors-style-v1.js
      - name: Publier et nettoyer
        run: |
          set -euo pipefail
          rm -f .github/workflows/harmoniser-portes-pwa-temp.yml
          git config user.name 'DIGIYLYFE Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add territoire.html index.html sw.js assets/digiy-territoire-doors-style-v1.js .github/workflows/harmoniser-portes-pwa-temp.yml
          git commit -m 'Territoire: harmoniser toutes les portes et rafraichir PWA'
          git push origin main
