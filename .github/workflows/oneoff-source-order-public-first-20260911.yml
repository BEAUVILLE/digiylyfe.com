name: oneoff-source-order-public-first-20260911

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  reorder:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Move territory hub in source before professional journey
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          territory_re = re.compile(
              r'\n\s*<section class="section worldHub" id="territoires" aria-label="DIGIYLYFE HUB des territoires">.*?</section>',
              re.S,
          )
          matches = list(territory_re.finditer(text))
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one territory hub, found {len(matches)}')
          territory = matches[0].group(0).strip('\n')
          text = territory_re.sub('', text, count=1)

          public_re = re.compile(
              r'(<section class="section" aria-label="Portes publiques DIGIYLYFE">.*?</section>)',
              re.S,
          )
          pubs = list(public_re.finditer(text))
          if len(pubs) != 1:
              raise SystemExit(f'Expected exactly one public doors section, found {len(pubs)}')

          text = public_re.sub(r'\1\n\n' + territory, text, count=1)

          if text.count('id="territoires"') != 1:
              raise SystemExit('Territory hub count changed unexpectedly')
          if text.index('aria-label="Portes publiques DIGIYLYFE"') > text.index('id="territoires"'):
              raise SystemExit('Territory hub not after public doors')
          if text.index('id="territoires"') > text.index('class="brandClaim"'):
              raise SystemExit('Territory hub still below professional presentation')

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit source-order correction to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No change required"
            exit 0
          fi
          git commit -m "fix: put territory hub before professional journey in source [skip ci]"
          git push origin HEAD:${{ github.head_ref }}
