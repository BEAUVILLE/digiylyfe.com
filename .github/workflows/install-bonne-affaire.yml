name: Installer BONNE AFFAIRE dans les vitrines

on:
  push:
    branches:
      - main
    paths:
      - scripts/install_bonne_affaire.py

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Poser BONNE AFFAIRE
        run: python3 scripts/install_bonne_affaire.py

      - name: Publier le résultat propre
        run: |
          git config user.name "DIGIYLYFE"
          git config user.email "actions@users.noreply.github.com"
          git add index.html en/index.html es/index.html de/index.html it/index.html nl/index.html ar/index.html
          git rm scripts/install_bonne_affaire.py .github/workflows/install-bonne-affaire.yml
          git commit -m "Ajouter BONNE AFFAIRE aux vitrines DIGIYLYFE"
          git push origin main
