name: Remonter la fidélisation dans le héros

on:
  push:
    paths:
      - '.github/workflows/remonter-fidelisation-hero.yml'

permissions:
  contents: write

jobs:
  remonter:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer la vitrine
        uses: actions/checkout@v4

      - name: Forcer la nouvelle version du héros
        shell: python
        run: |
          from pathlib import Path

          page = Path('index.html')
          workflow = Path('.github/workflows/remonter-fidelisation-hero.yml')
          html = page.read_text(encoding='utf-8')
          old = './assets/js/digiy-fidelisation.js?v=20260801'
          new = './assets/js/digiy-fidelisation.js?v=20260801-hero'

          if old in html:
              html = html.replace(old, new, 1)
              page.write_text(html, encoding='utf-8')
          elif new not in html:
              raise SystemExit('Chargement du script fidélisation introuvable')

          if workflow.exists():
              workflow.unlink()

      - name: Publier la nouvelle position
        run: |
          git config user.name "DIGIYLYFE Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/remonter-fidelisation-hero.yml
          git diff --cached --quiet && exit 0
          git commit -m "Forcer la fidélisation dans le héros"
          git push
