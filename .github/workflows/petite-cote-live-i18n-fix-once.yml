name: Petite Cote live i18n fix once
on:
  push:
    paths:
      - '.github/workflows/petite-cote-live-i18n-fix-once.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: python3 scripts/petite-cote-live-i18n-fix.py
      - name: Validate
        run: |
          node --check assets/digiy-territoire-runtime-v1.js
          grep -q "kind:'profile'" assets/digiy-territoire-runtime-v1.js
          grep -q "guidance:'The Voice'" assets/digiy-territoire-runtime-v1.js
          grep -q "r.searchParams.set('lang',l)" saly.html
          grep -q '20260827-live-i18n-v2' territoire.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/digiy-territoire-runtime-v1.js saly.html territoire.html
          git commit -m 'Petite Cote: traduire les actions des pros reels'
          git push
