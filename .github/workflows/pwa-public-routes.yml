name: PWA public routes
on:
  pull_request:
    paths:
      - 'index.html'
      - 'outils-gestion-demo.html'
      - 'demo-*-gestion.html'
      - 'tarifs-adherents-1.html'
      - 'tarifs-loc.html'
      - 'fiches/pap-piscine-saly.html'
      - 'tests/pwa/public-routes.cjs'
      - '.github/workflows/pwa-public-routes.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/digiy-route-tests playwright@1.62.1
      - run: /tmp/digiy-route-tests/node_modules/.bin/playwright install --with-deps ${{ matrix.browser }}
      - run: node tests/pwa/public-routes.cjs
        env:
          NODE_PATH: /tmp/digiy-route-tests/node_modules
          PWA_BROWSER: ${{ matrix.browser }}
      - run: python3 -m unittest discover -s tests -p 'test_visibilite*.py'
