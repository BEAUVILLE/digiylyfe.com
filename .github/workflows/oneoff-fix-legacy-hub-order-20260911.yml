name: oneoff-fix-legacy-hub-order-20260911

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove legacy hero relocation of territory hub
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('digiy-contact-global-core-20260824.js')
          s = p.read_text(encoding='utf-8')
          old = """      var hero=document.querySelector('section.hero');
      if(hero && hero.nextElementSibling!==section) hero.insertAdjacentElement('afterend',section);"""
          new = """      var publicDoor=document.querySelector('section.section[aria-label=\"Portes publiques DIGIYLYFE\"]');
      if(publicDoor && publicDoor.nextElementSibling!==section) publicDoor.insertAdjacentElement('afterend',section);"""
          if old not in s:
              if new in s:
                  print('Legacy relocation already fixed')
                  raise SystemExit(0)
              raise SystemExit('Expected legacy relocation block not found')
          if s.count(old) != 1:
              raise SystemExit(f'Expected one legacy relocation block, found {s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit targeted fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digiy-contact-global-core-20260824.js
          if git diff --cached --quiet; then
            echo "No change required"
            exit 0
          fi
          git commit -m "fix(home): keep territory hub public-first"
          git push origin HEAD:main
