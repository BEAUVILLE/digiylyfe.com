name: Retry Miami commercial guidance patch

on:
  push:
    paths:
      - '.github/workflows/oneoff-miami-commercial-path-v2-20260912.yml'

permissions:
  contents: write

jobs:
  patch-miami:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Miami commercial path
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          changed=[]

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old=s
          direct='href="https://digiylyfe.com/carte-gratuite.html?country=us&amp;lang=en&amp;territory=miami">🇺🇸 <span data-i18n="globalUsa">'
          guided='href="https://digiylyfe.com/miami.html?lang=en">🇺🇸 <span data-i18n="globalUsa">'
          if direct not in s:
              raise SystemExit('index USA direct-card link not found')
          s=s.replace(direct,guided,1)

          pattern=r"x\.innerHTML='<strong>🇺🇸 MIAMI PILOT.*?</div>';var m="
          replacement=(
              "x.innerHTML='<strong>🇺🇸 MIAMI PILOT · START FREE, SEE THE FULL PATH</strong>"
              "<p>Free DIGIY card $0 → Professional profile $299 → DIGIY PRO $29/month or $290/year. "
              "Annual path: $589 first year, then $290/year. Optional websites: PREMIUM $790+ · EXTRA $1,490+.</p>"
              "<div class=\"miami-actions\"><a href=\"/miami.html?lang=en\">SEE MIAMI OFFER & PRICING →</a>"
              "<a href=\"/carte-gratuite.html?country=us&lang=en&territory=miami\">GET MY FREE MIAMI CARD →</a></div>';var m="
          )
          s,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit(f'index Miami pilot banner replacement count={n}')
          if s!=old:
              p.write_text(s,encoding='utf-8')
              changed.append('index.html')

          p=Path('miami.html')
          s=p.read_text(encoding='utf-8')
          old=s

          hero_old='<div class="actions"><a class="cta primary" id="freeCta" href="/carte-gratuite.html?country=us&lang=en&territory=miami">GET MY FREE DIGIY CARD →</a><a class="cta secondary" id="priceCta" href="/tarifs-adherents-1.html?country=us&lang=en">SEE USA PRICING →</a></div>'
          hero_new='<div class="actions"><a class="cta primary" id="guideCta" href="#proPath">SEE THE FULL MIAMI OFFER →</a><a class="cta secondary" id="freeCta" href="/carte-gratuite.html?country=us&lang=en&territory=miami">GET MY FREE DIGIY CARD →</a><a class="cta secondary" id="priceCta" href="/tarifs-adherents-1.html?country=us&lang=en">SEE USA PRICING →</a></div>'
          if hero_old not in s:
              raise SystemExit('Miami hero actions block not found')
          s=s.replace(hero_old,hero_new,1)

          section_old='<section class="section"><h2 id="pathTitle">Start free. Go PRO when it makes sense.</h2>'
          section_new='<section class="section" id="proPath"><h2 id="pathTitle">Start free. Go PRO when it makes sense.</h2>'
          if section_old not in s:
              raise SystemExit('Miami PRO path section not found')
          s=s.replace(section_old,section_new,1)

          truth_anchor='</small></article></div><div class="doctrine" id="doctrine">'
          truth_insert='</small></article></div><div class="doctrine" id="priceTruth">$589 · FIRST YEAR WITH ANNUAL DIGIY PRO = $299 PROFESSIONAL PROFILE + $290/YEAR · THEN $290/YEAR. MONTHLY OPTION: $299 PROFILE + $29/MONTH.</div><div class="doctrine" id="doctrine">'
          if truth_anchor not in s:
              raise SystemExit('Miami price truth anchor not found')
          s=s.replace(truth_anchor,truth_insert,1)

          dict_anchor='};\nfunction setLang(l){'
          dict_insert=(
              '};\n'
              "const GUIDE={en:'SEE THE FULL MIAMI OFFER →',es:'VER LA OFERTA COMPLETA DE MIAMI →',fr:'VOIR L’OFFRE MIAMI COMPLÈTE →',pt:'VER A OFERTA MIAMI COMPLETA →',it:'VEDI L’OFFERTA MIAMI COMPLETA →',de:'VOLLSTÄNDIGES MIAMI-ANGEBOT →',nl:'BEKIJK HET VOLLEDIGE MIAMI-AANBOD →',ar:'عرض ميامي الكامل ←'};\n"
              "const TRUTH={en:'$589 · FIRST YEAR WITH ANNUAL DIGIY PRO = $299 PROFESSIONAL PROFILE + $290/YEAR · THEN $290/YEAR. MONTHLY OPTION: $299 PROFILE + $29/MONTH.',es:'$589 · PRIMER AÑO CON DIGIY PRO ANUAL = FICHA PROFESIONAL $299 + $290/AÑO · DESPUÉS $290/AÑO. OPCIÓN MENSUAL: FICHA $299 + $29/MES.',fr:'589 $ · 1re ANNÉE AVEC DIGIY PRO ANNUEL = FICHE PROFESSIONNELLE 299 $ + 290 $/AN · PUIS 290 $/AN. OPTION MENSUELLE : FICHE 299 $ + 29 $/MOIS.',pt:'$589 · 1º ANO COM DIGIY PRO ANUAL = FICHA PROFISSIONAL $299 + $290/ANO · DEPOIS $290/ANO. OPÇÃO MENSAL: FICHA $299 + $29/MÊS.',it:'$589 · PRIMO ANNO CON DIGIY PRO ANNUALE = PROFILO $299 + $290/ANNO · POI $290/ANNO. OPZIONE MENSILE: PROFILO $299 + $29/MESE.',de:'$589 · ERSTES JAHR MIT DIGIY PRO JÄHRLICH = PROFI-PROFIL $299 + $290/JAHR · DANACH $290/JAHR. MONATSOPTION: PROFIL $299 + $29/MONAT.',nl:'$589 · EERSTE JAAR MET JAARLIJKSE DIGIY PRO = PROFIEL $299 + $290/JAAR · DAARNA $290/JAAR. MAANDOPTIE: PROFIEL $299 + $29/MAAND.',ar:'589$ · السنة الأولى مع DIGIY PRO السنوي = الملف المهني 299$ + 290$/سنة · ثم 290$/سنة. الخيار الشهري: الملف 299$ + 29$/شهر.'};\n"
              'function setLang(l){'
          )
          if dict_anchor not in s:
              raise SystemExit('Miami language dictionary anchor not found')
          s=s.replace(dict_anchor,dict_insert,1)

          set_anchor="document.getElementById('lead').textContent=t.lead;document.getElementById('freeCta').textContent=t.free;"
          set_insert="document.getElementById('lead').textContent=t.lead;document.getElementById('guideCta').textContent=GUIDE[l]||GUIDE.en;document.getElementById('freeCta').textContent=t.free;"
          if set_anchor not in s:
              raise SystemExit('Miami setLang CTA anchor not found')
          s=s.replace(set_anchor,set_insert,1)

          truth_set_anchor="['s1t','s1x','s2t','s2x','s3t','s3x'].forEach(k=>document.getElementById(k).textContent=t[k]);document.getElementById('doctrine').textContent=t.doc;"
          truth_set_insert="['s1t','s1x','s2t','s2x','s3t','s3x'].forEach(k=>document.getElementById(k).textContent=t[k]);document.getElementById('priceTruth').textContent=TRUTH[l]||TRUTH.en;document.getElementById('doctrine').textContent=t.doc;"
          if truth_set_anchor not in s:
              raise SystemExit('Miami price truth setLang anchor not found')
          s=s.replace(truth_set_anchor,truth_set_insert,1)

          href_anchor="document.getElementById('freeCta').href='/carte-gratuite.html?country=us&lang='+l+'&territory=miami';"
          href_insert="document.getElementById('guideCta').href='#proPath';document.getElementById('freeCta').href='/carte-gratuite.html?country=us&lang='+l+'&territory=miami';"
          if href_anchor not in s:
              raise SystemExit('Miami href anchor not found')
          s=s.replace(href_anchor,href_insert,1)

          if s!=old:
              p.write_text(s,encoding='utf-8')
              changed.append('miami.html')

          print('changed:', changed)
          PY
          git config user.name 'DIGIY LYFE'
          git config user.email 'baptistejb24@gmail.com'
          git add index.html miami.html
          git commit -m 'fix: guide Miami visitors through full paid offer'
          git push
