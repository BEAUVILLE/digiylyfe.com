name: oneoff-transcode-master-video-mobile-20260924

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/oneoff-transcode-master-video-mobile-20260924.yml"

permissions:
  contents: write

jobs:
  transcode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Transcode DIGIYLYFE master video for mobile Safari/Android
        run: |
          set -e
          ffmpeg -y             -i assets/videos/DIGIYLYFE_MASTER_20s_ALY_POSEE.mp4             -c:v libx264             -profile:v high             -level 4.0             -pix_fmt yuv420p             -movflags +faststart             -crf 21             -preset medium             -c:a aac             -b:a 160k             -ar 48000             -ac 2             assets/videos/DIGIYLYFE_MASTER_20s_ALY_POSEE_MOBILE.mp4
          ffprobe -v error -show_streams -show_format assets/videos/DIGIYLYFE_MASTER_20s_ALY_POSEE_MOBILE.mp4
      - name: Commit mobile-safe video
        run: |
          git config user.name "DIGIYLYFE Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/videos/DIGIYLYFE_MASTER_20s_ALY_POSEE_MOBILE.mp4
          git commit -m "fix(video): add H264 AAC mobile-safe DIGIYLYFE master [skip ci]" || exit 0
          git push
