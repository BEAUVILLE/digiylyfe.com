name: Cleanup temp LOC trigger
on:
  push:
    paths:
      - '.github/workflows/temp-cleanup-loc-note.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          rm -f .github/workflows/temp-trigger-loc-note.txt .github/workflows/temp-cleanup-loc-note.yml
          git config user.name "DIGIY LYFE"
          git config user.email "baptistejb24@gmail.com"
          git add -A
          git commit -m "chore: remove temporary LOC trigger files" || exit 0
          git push
