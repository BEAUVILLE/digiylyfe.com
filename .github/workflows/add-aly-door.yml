name: Add Aly Kane door to homepage

on:
  push:
    branches: [main]
    paths:
      - '.github/aly-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-door:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Add Aly Kane door without removing homepage content
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          source = path.read_text(encoding='utf-8')

          if 'aria-label="Découvrir Aly Kane — La Voix du Terrain"' in source:
              print('La porte Aly Kane est déjà présente.')
              raise SystemExit(0)

          card = r'''
<a aria-label="Découvrir Aly Kane — La Voix du Terrain" class="voiceDoor" data-hub-allow="fullscreen" href="./clip-ali.html">
  <span aria-hidden="true" class="voiceIcon">🦅</span>
  <span class="voiceCopy">
    <span class="voiceTag">LA VOIX DU TERRAIN · GUIDE DES TERRITOIRES</span>
    <strong>ALY KANE</strong>
    <p>Découvrez en images le HUB, Saly, Sarlat et les portes DIGIYLYFE, avec lecture audio.</p>
    <span aria-hidden="true" class="voiceExamples"><span>« DIGIYLYFE ouvre les portes. »</span></span>
  </span>
  <span class="voiceCta">Voir et écouter Aly Kane →</span>
</a>'''

          needle = '</div>\n<a aria-label="Ouvrir LA VOIX ACTION PRO'
          if needle not in source:
              raise SystemExit('Point d’insertion principal introuvable : index.html laissé intact.')
          source = source.replace(needle, '</div>\n' + card + '\n<a aria-label="Ouvrir LA VOIX ACTION PRO', 1)

          old_menu = '<a href="https://digiy-clip.digiylyfe.com/" rel="noopener noreferrer" target="_blank" title="S’ouvre séparément pour conserver le HUB DIGIYLYFE">🎬 <span data-i18n="menuClip">Clip terrain</span></a>'
          if old_menu in source:
              source = source.replace(old_menu, '<a class="gold" data-hub-allow="fullscreen" href="./clip-ali.html">🦅 <span>Aly Kane · La Voix du Terrain</span></a>\n' + old_menu, 1)

          old_nojs = '<a href="https://pro-action-digiy.digiylyfe.com/">🎙️ ACTION PRO</a>'
          if old_nojs in source:
              source = source.replace(old_nojs, '<a href="./clip-ali.html">🦅 Aly Kane · La Voix du Terrain</a>\n    ' + old_nojs, 1)

          source = source.replace('index-hub-production-saly-sarlat-links-fixed-20260725', 'index-hub-aly-kane-20260725', 1)
          path.write_text(source, encoding='utf-8')
          print(f'index.html mis à jour : {len(source.splitlines())} lignes')
          PY

      - name: Commit homepage update
        run: |
          git config user.name "DIGIYLYFE Builder"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Aucun changement à pousser"
          else
            git commit -m "Add Aly Kane door to DIGIYLYFE homepage"
            git push origin main
          fi
