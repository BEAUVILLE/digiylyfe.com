name: Fix territory member favorite star only once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-territory-member-favorite-star-only-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stabilize member favorite button
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('assets/digiy-territoire-favoris-v1.js')
          t = p.read_text(encoding='utf-8')
          old = "function updateButton(b,id){var on=active(id),t=tr(),pressed=on?'true':'false',label=on?t.on:t.add;b.classList.toggle('active',on);if(b.getAttribute('aria-pressed')!==pressed)b.setAttribute('aria-pressed',pressed);if(b.textContent!==label)b.textContent=label;}"
          new = "function updateButton(b,id){var on=active(id),t=tr(),pressed=on?'true':'false',label=on?'★':'☆',aria=on?t.on:t.add;b.classList.toggle('active',on);if(b.getAttribute('aria-pressed')!==pressed)b.setAttribute('aria-pressed',pressed);if(b.getAttribute('aria-label')!==aria)b.setAttribute('aria-label',aria);if(b.textContent!==label)b.textContent=label;}"
          if t.count(old) != 1:
              raise SystemExit(f'updateButton anchor count={t.count(old)}')
          t = t.replace(old, new, 1)
          old_css = ".digiyTerritoryFav{position:absolute;top:10px;right:10px;z-index:80;display:inline-flex;align-items:center;justify-content:center;max-width:calc(100% - 20px);min-height:34px;padding:7px 10px;border-radius:999px;border:1px solid rgba(246,196,83,.62);background:rgba(3,18,13,.90);color:#fff3cf;font:inherit;font-size:10px;font-weight:1000;line-height:1.05;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.24);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}"
          new_css = ".digiyTerritoryFav{position:absolute;top:10px;right:10px;z-index:80;display:inline-flex;align-items:center;justify-content:center;width:38px;min-width:38px;height:38px;min-height:38px;padding:0;border-radius:999px;border:1px solid rgba(246,196,83,.62);background:rgba(3,18,13,.90);color:#fff3cf;font:1000 22px/1 system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",sans-serif;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.24);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}"
          if t.count(old_css) != 1:
              raise SystemExit(f'CSS anchor count={t.count(old_css)}')
          t = t.replace(old_css, new_css, 1)
          p.write_text(t, encoding='utf-8')

          p = Path('territoire.html')
          t = p.read_text(encoding='utf-8')
          old = '/assets/digiy-territoire-favoris-v1.js?v=20260906-v5'
          new = '/assets/digiy-territoire-favoris-v1.js?v=20260906-v6'
          if t.count(old) != 1:
              raise SystemExit(f'territoire version anchor count={t.count(old)}')
          p.write_text(t.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Validate patch
        shell: bash
        run: |
          grep -F "label=on?'★':'☆'" assets/digiy-territoire-favoris-v1.js
          grep -F 'width:38px;min-width:38px;height:38px' assets/digiy-territoire-favoris-v1.js
          grep -F 'digiy-territoire-favoris-v1.js?v=20260906-v6' territoire.html
          git diff --check
      - name: Commit and self-delete
        shell: bash
        run: |
          git config user.name "DIGIYLYFE Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/fix-territory-member-favorite-star-only-once.yml
          git add assets/digiy-territoire-favoris-v1.js territoire.html
          git commit -m "fix: keep territory member favorite star stable [skip ci]"
          git push
