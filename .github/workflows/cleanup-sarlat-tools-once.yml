name: Cleanup Sarlat tools once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove one-time Sarlat tooling
        run: |
          git rm -f .github/workflows/align-sarlat-final-once.yml \
                    .github/workflows/fix-sarlat-meta-once.yml \
                    .github/workflows/cleanup-sarlat-tools-once.yml \
                    tools/align-sarlat-final-once.py \
                    tools/fix-sarlat-meta-once.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove one-time Sarlat tooling"
          git push origin HEAD:main
