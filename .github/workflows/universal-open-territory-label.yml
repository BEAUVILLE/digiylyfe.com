name: Universal OUVRIR label for territory cards

on:
  push:
    paths:
      - '.github/workflows/universal-open-territory-label.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make territory action label neutral and universal
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('territoire.html')
          s=p.read_text(encoding='utf-8')
          replacements={
            "profile:'Voir la fiche'":"profile:'OUVRIR'",
            "profile:'View profile'":"profile:'OPEN'",
            "profile:'Ver ficha'":"profile:'ABRIR'",
            "profile:'Ligar'":"profile:'ABRIR'",
            "profile:'Profil ansehen'":"profile:'ÖFFNEN'",
            "profile:'Vedi scheda'":"profile:'APRI'",
            "profile:'Bekijk fiche'":"profile:'OPENEN'",
            "profile:'عرض البطاقة'":"profile:'فتح'",
          }
          for old,new in replacements.items():
            s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "DIGIYLYFE Bot"
          git config user.email "actions@users.noreply.github.com"
          git add territoire.html
          git rm .github/workflows/universal-open-territory-label.yml
          git commit -m "Territoires: make OUVRIR the universal action label"
          git push origin HEAD:main
