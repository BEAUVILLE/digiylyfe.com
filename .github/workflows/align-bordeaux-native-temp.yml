name: Align Bordeaux Native
on:
  push:
    paths:
      - '.github/workflows/align-bordeaux-native-temp.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Appliquer et vérifier Bordeaux
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # MAÎTRE TERRITOIRE : Bordeaux reçoit les mêmes deux portes natives.
          p=Path('assets/digiy-territoire-runtime-v1.js')
          s=p.read_text(encoding='utf-8')
          old="var LOCAL_NEEDS={'petite-cote':[['cleaning','🧹'],['professional','🏛️']],'dakar':[['cleaning','🧹'],['professional','🏛️']],'vallee-dordogne':[['cleaning','🧹'],['professional','🏛️']]};"
          new="var LOCAL_NEEDS={'petite-cote':[['cleaning','🧹'],['professional','🏛️']],'dakar':[['cleaning','🧹'],['professional','🏛️']],'vallee-dordogne':[['cleaning','🧹'],['professional','🏛️']],'bordeaux':[['cleaning','🧹'],['professional','🏛️']]};"
          assert old in s, 'LOCAL_NEEDS courant absent'
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # Bordeaux direct : 11 portes, les 2 nouvelles ouvrent leur MASTER dédié.
          p=Path('bordeaux.html')
          s=p.read_text(encoding='utf-8')
          oldneeds="var NEEDS=[['announcements','⚡','ANNONCES'],['transport','🚗','SE DÉPLACER'],['artisan','🔧','TROUVER UN ARTISAN'],['accommodation','🏠','DORMIR OU LOUER']"
          newneeds="var NEEDS=[['announcements','⚡','ANNONCES'],['transport','🚗','SE DÉPLACER'],['artisan','🔧','TROUVER UN ARTISAN'],['cleaning','🧹','SERVICE DE NETTOYAGE'],['professional','🏛️','SERVICES PROFESSIONNELS'],['accommodation','🏠','DORMIR OU LOUER']"
          assert oldneeds in s, 'NEEDS Bordeaux absent'
          s=s.replace(oldneeds,newneeds,1)
          oldclick="b.onclick=function(){state.need=state.need===n[0]?'':n[0];syncUrl();};"
          newclick="b.onclick=function(){if(n[0]==='cleaning'||n[0]==='professional'){var path=n[0]==='cleaning'?'/nettoyage-master.html':'/services-professionnels-master.html',m=new URL(path,location.origin);m.searchParams.set('territory','bordeaux');if(state.local)m.searchParams.set('local',state.local);m.searchParams.set('lang',currentLang());location.href=m.pathname+m.search;return}state.need=state.need===n[0]?'':n[0];syncUrl();};"
          assert oldclick in s, 'onclick Bordeaux absent'
          s=s.replace(oldclick,newclick,1)
          # 9 -> 11 dans les 8 langues.
          changes={
            '9 portes simples. LA VOIX reste un moteur de recherche, jamais un métier.':'11 portes simples. LA VOIX reste un moteur de recherche, jamais un métier.',
            '9 simple doors. THE VOICE is a search engine, never a trade.':'11 simple doors. THE VOICE is a search engine, never a trade.',
            '9 puertas simples. LA VOZ es un motor de búsqueda, no un oficio.':'11 puertas simples. LA VOZ es un motor de búsqueda, no un oficio.',
            '9 portas simples. A VOZ é um motor de pesquisa, nunca uma profissão.':'11 portas simples. A VOZ é um motor de pesquisa, nunca uma profissão.',
            '9 porte semplici. LA VOCE resta un motore di ricerca, mai un mestiere.':'11 porte semplici. LA VOCE resta un motore di ricerca, mai un mestiere.',
            '9 einfache Türen. DIE STIMME bleibt eine Suchmaschine, niemals ein Beruf.':'11 einfache Türen. DIE STIMME bleibt eine Suchmaschine, niemals ein Beruf.',
            '9 eenvoudige ingangen. DE STEM blijft een zoekmachine, nooit een beroep.':'11 eenvoudige ingangen. DE STEM blijft een zoekmachine, nooit een beroep.',
            '9 أبواب بسيطة. الصوت محرك بحث وليس مهنة.':'11 باباً بسيطاً. الصوت محرك بحث وليس مهنة.'
          }
          for a,b in changes.items():
              if a in s: s=s.replace(a,b,1)
          # Build marker + PWA Bordeaux direct.
          s=s.replace('bordeaux-urbain-v2-i18n-partagee-8langues-20260827','bordeaux-urbain-v3-11-portes-20260831',1)
          if "serviceWorker.register('/sw.js?v=20260830-master-ui-v9')" not in s:
              marker='</body>'
              reg="""<script>\nif('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('/sw.js?v=20260830-master-ui-v9').catch(function(){})})}\n</script>\n</body>"""
              assert marker in s, 'body Bordeaux absent'
              s=s.replace(marker,reg,1)
          p.write_text(s,encoding='utf-8')

          # Source Bordeaux 8 langues : deux libellés supplémentaires.
          p=Path('assets/digiy-bordeaux-i18n-v1.js')
          s=p.read_text(encoding='utf-8')
          repl={
            "guidance:'LA VOIX'}":"guidance:'LA VOIX',cleaning:'SERVICE DE NETTOYAGE',professional:'SERVICES PROFESSIONNELS'}",
            "guidance:'THE VOICE'}":"guidance:'THE VOICE',cleaning:'CLEANING SERVICE',professional:'PROFESSIONAL SERVICES'}",
            "guidance:'LA VOZ'}":"guidance:'LA VOZ',cleaning:'SERVICIO DE LIMPIEZA',professional:'SERVICIOS PROFESIONALES'}",
            "guidance:'A VOZ'}":"guidance:'A VOZ',cleaning:'SERVIÇO DE LIMPEZA',professional:'SERVIÇOS PROFISSIONAIS'}",
            "guidance:'LA VOCE'}":"guidance:'LA VOCE',cleaning:'SERVIZIO DI PULIZIA',professional:'SERVIZI PROFESSIONALI'}",
            "guidance:'DIE STIMME'}":"guidance:'DIE STIMME',cleaning:'REINIGUNGSSERVICE',professional:'PROFESSIONELLE DIENSTE'}",
            "guidance:'DE STEM'}":"guidance:'DE STEM',cleaning:'SCHOONMAAKSERVICE',professional:'PROFESSIONELE DIENSTEN'}",
            "guidance:'الصوت'}":"guidance:'الصوت',cleaning:'خدمة تنظيف',professional:'الخدمات المهنية'}"
          }
          for a,b in repl.items():
              assert a in s, f'libellé Bordeaux absent: {a}'
              s=s.replace(a,b,1)
          s=s.replace('9 needs x 3 examples','11 doors · 9 projection needs x 3 examples',1)
          p.write_text(s,encoding='utf-8')

          # Porte France : la description publique doit annoncer 11 portes.
          p=Path('france.html')
          s=p.read_text(encoding='utf-8')
          old='Le territoire urbain français : 8 grands quartiers, 9 portes et des modèles de présence pour lancer le marché sans inventer de faux adhérents.'
          new='Le territoire urbain français : 8 grands quartiers, 11 portes et des modèles de présence pour lancer le marché sans inventer de faux adhérents.'
          assert old in s, 'description Bordeaux France absente'
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # Cache/PWA V9.
          p=Path('territoire.html'); s=p.read_text(encoding='utf-8')
          s=s.replace('digiy-territoire-runtime-v1.js?v=20260830-native-doors-v2','digiy-territoire-runtime-v1.js?v=20260831-native-doors-v3',1)
          s=s.replace('/sw.js?v=20260830-master-ui-v8','/sw.js?v=20260830-master-ui-v9')
          p.write_text(s,encoding='utf-8')
          for fn in ['index.html','nettoyage-master.html','services-professionnels-master.html','sarlat.html']:
              p=Path(fn); x=p.read_text(encoding='utf-8').replace('/sw.js?v=20260830-master-ui-v8','/sw.js?v=20260830-master-ui-v9'); p.write_text(x,encoding='utf-8')
          p=Path('sw.js'); x=p.read_text(encoding='utf-8')
          assert 'digiylyfe-pwa-20260830-master-ui-v8' in x, 'PWA V8 absent'
          x=x.replace('digiylyfe-pwa-20260830-master-ui-v8','digiylyfe-pwa-20260830-master-ui-v9',1)
          p.write_text(x,encoding='utf-8')

          # Vérifications métier / syntaxe.
          r=Path('assets/digiy-territoire-runtime-v1.js').read_text(encoding='utf-8')
          b=Path('bordeaux.html').read_text(encoding='utf-8')
          i=Path('assets/digiy-bordeaux-i18n-v1.js').read_text(encoding='utf-8')
          f=Path('france.html').read_text(encoding='utf-8')
          assert "'bordeaux':[['cleaning','🧹'],['professional','🏛️']]" in r
          assert "['cleaning','🧹','SERVICE DE NETTOYAGE']" in b
          assert "['professional','🏛️','SERVICES PROFESSIONNELS']" in b
          assert "m.searchParams.set('territory','bordeaux')" in b
          assert "cleaning:'SERVICE DE NETTOYAGE'" in i and "professional:'SERVICES PROFESSIONNELS'" in i
          assert '8 grands quartiers, 11 portes' in f
          assert '20260831-native-doors-v3' in Path('territoire.html').read_text(encoding='utf-8')
          assert 'digiylyfe-pwa-20260830-master-ui-v9' in Path('sw.js').read_text(encoding='utf-8')
          PY
          node --check assets/digiy-territoire-runtime-v1.js
          node --check assets/digiy-bordeaux-i18n-v1.js
      - name: Publier et nettoyer
        run: |
          set -euo pipefail
          rm -f .github/workflows/align-bordeaux-native-temp.yml
          git config user.name 'DIGIYLYFE Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/digiy-territoire-runtime-v1.js assets/digiy-bordeaux-i18n-v1.js bordeaux.html france.html territoire.html index.html nettoyage-master.html services-professionnels-master.html sarlat.html sw.js .github/workflows/align-bordeaux-native-temp.yml
          git commit -m 'Territoires: aligner Bordeaux sur les 11 portes natives'
          git push origin main
