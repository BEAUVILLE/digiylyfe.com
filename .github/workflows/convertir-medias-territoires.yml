name: Convertir medias territoires en WebP et AVIF

on:
  push:
    paths:
      - '.github/workflows/convertir-medias-territoires.yml'

permissions:
  contents: write

jobs:
  convertir:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer les outils image
        run: |
          sudo apt-get update
          sudo apt-get install -y webp libavif-bin

      - name: Convertir les PNG territoires
        run: |
          set -euo pipefail
          shopt -s nullglob
          for file in assets/territoires/*.png; do
            base="${file%.png}"
            cwebp -quiet -q 82 "$file" -o "${base}.webp"
            avifenc --min 28 --max 35 --speed 6 "$file" "${base}.avif"
            test -s "${base}.webp"
            test -s "${base}.avif"
          done

      - name: Basculer l index vers AVIF WebP PNG
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
          '''<picture class="territoryPhoto territoryPhotoSaly">
            <source media="(max-width:760px)" srcset="/assets/territoires/petite-cote-mobile.png"/>
            <img src="/assets/territoires/petite-cote-desktop.png" alt="Pêcheurs et pirogue sénégalaise · Petite Côte" loading="lazy" decoding="async"/>
          </picture>''':
          '''<picture class="territoryPhoto territoryPhotoSaly">
            <source type="image/avif" media="(max-width:760px)" srcset="/assets/territoires/petite-cote-mobile.avif"/>
            <source type="image/webp" media="(max-width:760px)" srcset="/assets/territoires/petite-cote-mobile.webp"/>
            <source type="image/avif" srcset="/assets/territoires/petite-cote-desktop.avif"/>
            <source type="image/webp" srcset="/assets/territoires/petite-cote-desktop.webp"/>
            <source media="(max-width:760px)" srcset="/assets/territoires/petite-cote-mobile.png"/>
            <img src="/assets/territoires/petite-cote-desktop.png" alt="Pêcheurs et pirogue sénégalaise · Petite Côte" loading="lazy" decoding="async"/>
          </picture>''',
          '''<picture class="territoryPhoto territoryPhotoDakar">
            <source media="(max-width:760px)" srcset="/assets/territoires/dakar-mobile.png"/>
            <img src="/assets/territoires/dakar-desktop.png" alt="Dakar · Corniche et ville" loading="lazy" decoding="async"/>
          </picture>''':
          '''<picture class="territoryPhoto territoryPhotoDakar">
            <source type="image/avif" media="(max-width:760px)" srcset="/assets/territoires/dakar-mobile.avif"/>
            <source type="image/webp" media="(max-width:760px)" srcset="/assets/territoires/dakar-mobile.webp"/>
            <source type="image/avif" srcset="/assets/territoires/dakar-desktop.avif"/>
            <source type="image/webp" srcset="/assets/territoires/dakar-desktop.webp"/>
            <source media="(max-width:760px)" srcset="/assets/territoires/dakar-mobile.png"/>
            <img src="/assets/territoires/dakar-desktop.png" alt="Dakar · Corniche et ville" loading="lazy" decoding="async"/>
          </picture>''',
          '''<picture class="territoryPhoto territoryPhotoFrance">
            <img src="/assets/territoires/perigord-dordogne.png" alt="Périgord · Vallée de la Dordogne" loading="lazy" decoding="async"/>
          </picture>''':
          '''<picture class="territoryPhoto territoryPhotoFrance">
            <source type="image/avif" srcset="/assets/territoires/perigord-dordogne.avif"/>
            <source type="image/webp" srcset="/assets/territoires/perigord-dordogne.webp"/>
            <img src="/assets/territoires/perigord-dordogne.png" alt="Périgord · Vallée de la Dordogne" loading="lazy" decoding="async"/>
          </picture>''',
          '''<picture class="territoryPhoto territoryPhotoFrance">
            <img src="/assets/territoires/bordeaux.png" alt="Bordeaux · Place de la Bourse et miroir d’eau" loading="lazy" decoding="async"/>
          </picture>''':
          '''<picture class="territoryPhoto territoryPhotoFrance">
            <source type="image/avif" srcset="/assets/territoires/bordeaux.avif"/>
            <source type="image/webp" srcset="/assets/territoires/bordeaux.webp"/>
            <img src="/assets/territoires/bordeaux.png" alt="Bordeaux · Place de la Bourse et miroir d’eau" loading="lazy" decoding="async"/>
          </picture>'''
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Bloc introuvable pour remplacement:\n{old[:120]}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Publier les nouveaux formats et l index
        run: |
          set -euo pipefail
          git config user.name 'DIGIYLYFE Media Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/territoires index.html
          if git diff --cached --quiet; then
            echo 'Aucun changement a publier.'
            exit 0
          fi
          git commit -m 'Media: convertir les visuels territoires en WebP et AVIF'
          git push
