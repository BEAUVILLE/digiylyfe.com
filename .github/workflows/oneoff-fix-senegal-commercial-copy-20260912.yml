name: Fix Senegal commercial pricing clarity

on:
  push:
    paths:
      - '.github/workflows/oneoff-fix-senegal-commercial-copy-20260912.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Senegal pricing and payment copy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tarifs-adherents-1.html')
          s=p.read_text()
          marker="data-digiy-senegal-commercial-v1"
          if marker in s:
              raise SystemExit('Senegal commercial patch already present')
          old="document.getElementById('memberPrice').textContent=p.pro;document.getElementById('memberPeriod').textContent=d.memberPeriod+(p.proExtra?' · '+p.proExtra:'');document.getElementById('premiumPrice').textContent=p.premium;"
          new="document.getElementById('memberPrice').textContent=p.pro;document.getElementById('memberPeriod').textContent=d.memberPeriod+(p.proExtra?' · '+p.proExtra:'');if(countryId==='SN'&&lang()==='fr'){document.documentElement.setAttribute('data-digiy-senegal-commercial-v1','1');document.getElementById('memberText').textContent='La fiche professionnelle démarre à 100 000 FCFA. L’adhésion DIGIY PRO est de 19 900 FCFA / mois et démarre avec l’activation de votre fiche.';document.getElementById('memberPrice').textContent='À PARTIR DE 119 900 FCFA';document.getElementById('memberPeriod').textContent='MONTANT DE DÉPART · FICHE 100 000 FCFA + 1ER MOIS DIGIY PRO 19 900 FCFA · PUIS 19 900 FCFA / MOIS';document.getElementById('memberNote').textContent='MONTANT DE DÉPART : à partir de 119 900 FCFA = fiche professionnelle à partir de 100 000 FCFA + premier mois DIGIY PRO 19 900 FCFA. Ensuite : 19 900 FCFA / mois.';document.getElementById('waveText').textContent='Après présentation de votre fiche et votre accord, effectuez le règlement Wave au nom de JB Beauville. Aucun paiement n’est demandé avant validation de la fiche.';}document.getElementById('premiumPrice').textContent=p.premium;"
          if old not in s:
              raise SystemExit('render pricing marker not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git config user.name 'DIGIY LYFE'
          git config user.email 'baptistejb24@gmail.com'
          git add tarifs-adherents-1.html
          git commit -m 'fix: clarify Senegal first payment and Wave sequence'
          git push
