name: Fix MAITRE MASTER territoire

on:
  push:
    paths:
      - '.github/workflows/fix-maitre-master-territoire-temp.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Appliquer patch natif
        run: python3 scripts/fix-maitre-master-territoire.py
      - name: Verifier
        run: |
          set -e
          grep -F 'var NEED_META={' assets/digiy-territoire-runtime-v1.js
          grep -F 'data-digiy-native-door' assets/digiy-territoire-runtime-v1.js
          grep -F 'raw=STANDARD[icon]||SPECIAL[icon]' assets/digiy-territoire-public-module-doors-v2.js
          grep -F '20260830-native-doors-v1' territoire.html
          grep -F '20260830-master-native-v1' territoire.html
          grep -F '20260830-territory-native-v4' territoire.html
          grep -F 'digiylyfe-pwa-20260830-territory-native-v4' sw.js
          node --check assets/digiy-territoire-runtime-v1.js
          node --check assets/digiy-territoire-public-module-doors-v2.js
      - name: Publier et nettoyer
        run: |
          set -e
          rm -f .github/workflows/fix-maitre-master-territoire-temp.yml scripts/fix-maitre-master-territoire.py
          git config user.name 'DIGIYLYFE Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Territoire harmoniser nativement MAITRE et MASTER'
          git push origin main
