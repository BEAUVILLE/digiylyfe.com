name: Install SALY FOOD multi-metiers
on:
  push:
    paths:
      - '.github/workflows/install-saly-food-multimetier-v1.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch territoire and demo loaders
        run: |
          python3 - <<'PY'
          from pathlib import Path

          territory = Path('territoire.html')
          s = territory.read_text(encoding='utf-8')
          anchor = '<script src="/assets/digiy-territoire-petite-cote-loc-v1.js?v=20260829-v1" defer></script>'
          loader = '<script src="/assets/digiy-territoire-petite-cote-food-v1.js?v=20260829-v1" defer></script>'
          assert anchor in s, 'LOC loader anchor missing in territoire.html'
          if loader not in s:
              s = s.replace(anchor, anchor + '\n' + loader, 1)
          territory.write_text(s, encoding='utf-8')

          demo = Path('demo-petite-cote.html')
          d = demo.read_text(encoding='utf-8')
          anchor2 = '<script src="/assets/digiy-demo-loc-price-v1.js?v=20260829-v1"></script>'
          loader2 = '<script src="/assets/digiy-demo-food-multimetier-v1.js?v=20260829-v1"></script>'
          assert anchor2 in d, 'LOC demo loader anchor missing in demo-petite-cote.html'
          if loader2 not in d:
              d = d.replace(anchor2, anchor2 + loader2, 1)
          demo.write_text(d, encoding='utf-8')
          PY
      - name: Verify scope
        run: |
          grep -q 'digiy-territoire-petite-cote-food-v1.js' territoire.html
          grep -q 'digiy-demo-food-multimetier-v1.js' demo-petite-cote.html
          git diff --check
          git diff --name-only
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add territoire.html demo-petite-cote.html
          git commit -m 'SALY FOOD: install six multi-trade examples [skip ci]'
          git push
