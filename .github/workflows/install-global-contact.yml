name: Install global DIGIY contact

on:
  push:
    branches: [main]
    paths:
      - "digiy-contact-global.js"
      - ".github/workflows/install-global-contact.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-contact:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install the shared contact loader
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          targets = [
              "index.html",
              "presence-terrain.html",
              "recherche.html",
              "menu.html",
              "tarif-entreprise-petite-cote.html",
              "tarifs-adherents-1.html",
              "tarifs-adherents.html",
              "architecture-digiylyfe.html",
              "notre-methode.html",
              "le-terrain-garde-la-main.html",
              "inscription.html",
              "inscription-entreprise.html",
              "digiy-business.html",
              "support-whatsapp.html",
              "sarlat.html",
              "carte.index.html",
              "carte/index.html",
              "en/index.html",
              "es/index.html",
              "pt/index.html",
              "de/index.html",
              "it/index.html",
              "nl/index.html",
              "ar/index.html",
          ]

          marker = '<script src="https://digiylyfe.com/digiy-contact-global.js?v=20260815"></script>'

          changed = []
          for name in targets:
              path = Path(name)
              if not path.exists():
                  print(f"SKIP missing: {name}")
                  continue
              text = path.read_text(encoding="utf-8")
              if "digiy-contact-global.js" in text:
                  print(f"OK already installed: {name}")
                  continue
              if "</body>" in text:
                  head, tail = text.rsplit("</body>", 1)
                  text = head.rstrip() + "\n" + marker + "\n</body>" + tail
              else:
                  text = text.rstrip() + "\n" + marker + "\n"
              path.write_text(text, encoding="utf-8")
              changed.append(name)
              print(f"INSTALLED: {name}")

          print("Changed files:", ", ".join(changed) if changed else "none")
          PY

      - name: Commit installed contact loaders
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No page needed an update."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html presence-terrain.html recherche.html menu.html tarif-entreprise-petite-cote.html tarifs-adherents-1.html tarifs-adherents.html architecture-digiylyfe.html notre-methode.html le-terrain-garde-la-main.html inscription.html inscription-entreprise.html digiy-business.html support-whatsapp.html sarlat.html carte.index.html carte/index.html en/index.html es/index.html pt/index.html de/index.html it/index.html nl/index.html ar/index.html
          git commit -m "Install global DIGIYLYFE contact [skip ci]"
          git push
