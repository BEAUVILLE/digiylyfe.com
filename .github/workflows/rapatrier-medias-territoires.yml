name: Rapatrier medias territoires

on:
  push:
    paths:
      - '.github/workflows/rapatrier-medias-territoires.yml'

permissions:
  contents: write

jobs:
  rapatriement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rapatrier les visuels territoires
        run: |
          set -euo pipefail
          mkdir -p assets/territoires
          curl -L --fail --retry 3 --retry-all-errors 'https://digiylyfe.net/wp-content/uploads/2026/08/ChatGPT-Image-28-aout-2026-18_23_46.png' -o assets/territoires/petite-cote-desktop.png
          curl -L --fail --retry 3 --retry-all-errors 'https://digiylyfe.net/wp-content/uploads/2026/08/ChatGPT-Image-28-aout-2026-18_40_45.png' -o assets/territoires/petite-cote-mobile.png
          curl -L --fail --retry 3 --retry-all-errors 'https://digiylyfe.net/wp-content/uploads/2026/08/ChatGPT-Image-28-aout-2026-19_00_50.png' -o assets/territoires/dakar-desktop.png
          curl -L --fail --retry 3 --retry-all-errors 'https://digiylyfe.net/wp-content/uploads/2026/08/ChatGPT-Image-28-aout-2026-18_54_21-2-1.png' -o assets/territoires/dakar-mobile.png
          curl -L --fail --retry 3 --retry-all-errors 'https://digiylyfe.net/wp-content/uploads/2026/08/ChatGPT-Image-28-aout-2026-19_17_29.png' -o assets/territoires/perigord-dordogne.png
          curl -L --fail --retry 3 --retry-all-errors 'https://digiylyfe.net/wp-content/uploads/2026/08/ChatGPT-Image-28-aout-2026-20_18_55.png' -o assets/territoires/bordeaux.png
          test -s assets/territoires/petite-cote-desktop.png
          test -s assets/territoires/petite-cote-mobile.png
          test -s assets/territoires/dakar-desktop.png
          test -s assets/territoires/dakar-mobile.png
          test -s assets/territoires/perigord-dordogne.png
          test -s assets/territoires/bordeaux.png

      - name: Publier les medias sur digiylyfe.com
        run: |
          set -euo pipefail
          git config user.name 'DIGIYLYFE Media Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/territoires
          if git diff --cached --quiet; then
            echo 'Aucun changement a publier.'
            exit 0
          fi
          git commit -m 'Media: rapatrier les visuels territoires sur digiylyfe.com'
          git push
