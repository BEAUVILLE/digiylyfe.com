name: Dordogne place marker

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-dordogne:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mark Dordogne place available
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          replacements={
            '"dordogneZones":"Sarlat · communes et villages du territoire"':'"dordogneZones":"PLACE À PRENDRE · Sarlat · communes et villages du territoire"',
            '"dordogneZones":"Sarlat · towns and villages of the territory"':'"dordogneZones":"PLACE AVAILABLE · Sarlat · towns and villages of the territory"',
            '"dordogneZones":"Sarlat · municipios y pueblos del territorio"':'"dordogneZones":"PLAZA DISPONIBLE · Sarlat · municipios y pueblos del territorio"',
            '"dordogneZones":"Sarlat · municípios e aldeias do território"':'"dordogneZones":"LUGAR DISPONÍVEL · Sarlat · municípios e aldeias do território"',
            '"dordogneZones":"Sarlat · comuni e villaggi del territorio"':'"dordogneZones":"POSTO DISPONIBILE · Sarlat · comuni e villaggi del territorio"',
            '"dordogneZones":"Sarlat · Gemeinden und Dörfer des Gebiets"':'"dordogneZones":"PLATZ VERFÜGBAR · Sarlat · Gemeinden und Dörfer des Gebiets"',
            '"dordogneZones":"Sarlat · gemeenten en dorpen in het gebied"':'"dordogneZones":"PLEK BESCHIKBAAR · Sarlat · gemeenten en dorpen in het gebied"',
            '"dordogneZones":"Sarlat · البلديات والقرى في المنطقة"':'"dordogneZones":"مكان متاح · Sarlat · البلديات والقرى في المنطقة"',
            '<small data-i18n="dordogneZones">Sarlat · communes et villages du territoire</small>':'<small data-i18n="dordogneZones">PLACE À PRENDRE · Sarlat · communes et villages du territoire</small>'
          }

          changed=False
          for old,new in replacements.items():
            if old in s:
              s=s.replace(old,new,1)
              changed=True

          if not changed:
            print('Dordogne marker already present or source changed; nothing to do.')
            raise SystemExit(0)

          p.write_text(s,encoding='utf-8')
          PY

          if git diff --quiet -- index.html; then
            echo "Nothing changed"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Vitrine: signaler la place à prendre en Dordogne"
          git push origin HEAD:main