name: Signer les cartes DIGIYLYFE.COM

on:
  push:
    paths:
      - '**/*carte*'
      - '**/*CARTE*'
      - '**/*card*'
      - '**/*CARD*'
      - '.github/workflows/sign-cards-digiylyfe.yml'
      - '.github/scripts/build-pro-pwa.py'
      - 'assets/pwa/digiy-fallback.svg'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sign-cards:
    uses: BEAUVILLE/digiylyfe.com/.github/workflows/sign-cards-reusable.yml@23c34b7b20139e62f4d5c20dcce953622f88f198


  build-pro-pwa:
    if: github.ref == 'refs/heads/main'
    needs: sign-cards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: PWA image tools
        run: python -m pip install --disable-pip-version-check pillow cairosvg
      - name: Générer les icônes DIGIY 192 et 512
        run: |
          python - <<'PY'
          import cairosvg
          from pathlib import Path
          src = Path("assets/pwa/digiy-fallback.svg")
          for size in (192, 512):
              cairosvg.svg2png(
                  url=str(src),
                  write_to=f"assets/pwa/digiy-fallback-{size}.png",
                  output_width=size,
                  output_height=size,
              )
          PY
      - name: Contrôler la syntaxe PWA
        run: |
          python -m py_compile .github/scripts/build-pro-pwa.py
          node --check assets/digiy-pro-pwa-v1.js
      - name: Générer les empreintes PWA PRO
        run: python .github/scripts/build-pro-pwa.py
      - name: Publier les manifests et icônes
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- pwa assets/pwa/digiy-fallback-512.png)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pwa assets/pwa/digiy-fallback-192.png assets/pwa/digiy-fallback-512.png
            git commit -m "chore: build DIGIY PRO PWA footprints"
            git push
          else
            echo "Aucune empreinte PWA à mettre à jour."
          fi
