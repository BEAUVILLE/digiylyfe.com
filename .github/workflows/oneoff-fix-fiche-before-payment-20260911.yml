name: One-off align fiche before payment

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oneoff-fix-fiche-before-payment-20260911.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch validated commercial sequence
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def patch(path, replacements):
              p=Path(path)
              s=p.read_text(encoding='utf-8')
              for old,new in replacements:
                  if old not in s:
                      raise SystemExit(f'MISSING marker in {path}: {old[:90]}')
                  s=s.replace(old,new)
              p.write_text(s,encoding='utf-8')

          patch('assets/digiy-prevalidation-flow-20260911.js',[
            ("DIGIYLYFE contrôle et valide votre dossier humainement. Le règlement de la fiche n’est demandé qu’après cette validation.","DIGIYLYFE contrôle votre dossier, prépare votre fiche puis vous la présente. Le règlement n’est demandé qu’après votre accord sur la fiche."),
            ("Dossier reçu. DIGIYLYFE va le valider avant tout règlement.","Dossier reçu. DIGIYLYFE va le contrôler, préparer votre fiche et vous la présenter avant tout règlement."),
            ("DIGIYLYFE reviews and validates your file. Payment for the professional profile is requested only after validation.","DIGIYLYFE reviews your file, prepares your professional profile and presents it to you. Payment is requested only after you approve the profile."),
            ("File received. DIGIYLYFE will validate it before any payment.","File received. DIGIYLYFE will review it, prepare your profile and present it to you before any payment."),
            ("DIGIYLYFE revisa y valida su expediente. El pago de la ficha solo se solicita después de la validación.","DIGIYLYFE revisa su expediente, prepara su ficha y se la presenta. El pago solo se solicita después de su aprobación."),
            ("Expediente recibido. DIGIYLYFE lo validará antes de cualquier pago.","Expediente recibido. DIGIYLYFE lo revisará, preparará su ficha y se la presentará antes de cualquier pago."),
            ("A DIGIYLYFE analisa e valida o dossier. O pagamento da ficha só é pedido após a validação.","A DIGIYLYFE analisa o dossier, prepara a ficha e apresenta-a. O pagamento só é pedido após a sua aprovação."),
            ("Dossier recebido. A DIGIYLYFE irá validá-lo antes de qualquer pagamento.","Dossier recebido. A DIGIYLYFE irá analisá-lo, preparar a ficha e apresentá-la antes de qualquer pagamento."),
            ("DIGIYLYFE controlla e convalida il dossier. Il pagamento della scheda viene richiesto solo dopo la convalida.","DIGIYLYFE controlla il dossier, prepara la scheda e te la presenta. Il pagamento viene richiesto solo dopo la tua approvazione."),
            ("Dossier ricevuto. DIGIYLYFE lo convaliderà prima di qualsiasi pagamento.","Dossier ricevuto. DIGIYLYFE lo controllerà, preparerà la scheda e te la presenterà prima di qualsiasi pagamento."),
            ("DIGIYLYFE prüft und bestätigt Ihre Unterlagen. Die Zahlung für das Profi-Profil erfolgt erst nach dieser Prüfung.","DIGIYLYFE prüft Ihre Unterlagen, erstellt Ihr Profi-Profil und legt es Ihnen vor. Die Zahlung erfolgt erst nach Ihrer Freigabe."),
            ("Unterlagen erhalten. DIGIYLYFE prüft sie vor jeder Zahlung.","Unterlagen erhalten. DIGIYLYFE prüft sie, erstellt das Profil und legt es Ihnen vor jeder Zahlung vor."),
            ("DIGIYLYFE controleert en valideert het dossier. Betaling voor het professionele profiel wordt pas na validatie gevraagd.","DIGIYLYFE controleert het dossier, maakt het professionele profiel en legt het aan u voor. Betaling wordt pas na uw goedkeuring gevraagd."),
            ("Dossier ontvangen. DIGIYLYFE valideert het vóór enige betaling.","Dossier ontvangen. DIGIYLYFE controleert het, maakt het profiel en legt het vóór enige betaling aan u voor."),
            ("تقوم DIGIYLYFE بمراجعة الملف والتحقق منه. لا يُطلب دفع ثمن الملف المهني إلا بعد التحقق.","تراجع DIGIYLYFE الملف وتُعد ملفك المهني ثم تعرضه عليك. لا يُطلب الدفع إلا بعد موافقتك على الملف."),
            ("تم استلام الملف. ستتحقق DIGIYLYFE منه قبل أي دفع.","تم استلام الملف. ستراجعه DIGIYLYFE وتُعد الملف المهني وتعرضه عليك قبل أي دفع.")
          ])

          patch('preparer-ma-carte.html',[
            ("DIGIYLYFE valide votre dossier avant de vous demander le règlement.","DIGIYLYFE contrôle votre dossier, prépare votre fiche et vous la présente. Le règlement n’est demandé qu’après votre accord."),
            ("20260911-freeze-fix-v1","20260911-fiche-before-payment-v2"),
            ("20260911-v1","20260911-fiche-before-payment-v2")
          ])

          patch('adhesion-petite-cote.html',[
            ("aucun règlement n’est demandé avant sa validation.","aucun règlement n’est demandé avant la préparation de votre fiche, sa présentation et votre accord."),
            ("CRÉATION DE VOTRE FICHE PROFESSIONNELLE · APRÈS VALIDATION DU DOSSIER","CRÉATION DE VOTRE FICHE PROFESSIONNELLE · AVANT RÈGLEMENT"),
            ("Ordre du parcours : DOSSIER → VALIDATION DIGIYLYFE → RÈGLEMENT → CRÉATION / ACTIVATION.","Ordre du parcours : RENSEIGNEMENTS → VALIDATION → CRÉATION / PRÉSENTATION DE LA FICHE → ACCORD DU PRO → PAIEMENT → MISE EN LIGNE + ACTIVATION PRO."),
            ("ÉTAPE 2 · APRÈS VALIDATION DIGIYLYFE","ÉTAPE 2 · CRÉATION ET ACCORD AVANT PAIEMENT"),
            ("Régler puis lancer la création","Recevoir et valider votre fiche avant de payer"),
            ("Si votre dossier est validé, DIGIYLYFE vous confirme le règlement de la fiche. Après règlement, la fiche est créée puis activée. L’adhésion PRO à 19 900 FCFA / mois démarre avec cette activation.","Après validation du dossier, DIGIYLYFE prépare votre fiche et vous la présente. Vous demandez les corrections nécessaires puis donnez votre accord. Le règlement intervient seulement après cet accord. La fiche est ensuite mise en ligne et DIGIY PRO à 19 900 FCFA / mois démarre avec son activation."),
            ("RÈGLEMENT UNIQUEMENT APRÈS VALIDATION","PAIEMENT UNIQUEMENT APRÈS VOTRE ACCORD SUR LA FICHE"),
            ("Le règlement intervient seulement après validation humaine du dossier.","Le règlement intervient seulement après préparation, présentation et accord du professionnel sur sa fiche."),
            ("FILE → DIGIYLYFE VALIDATION → PAYMENT → CREATION / ACTIVATION.","INFORMATION → VALIDATION → PROFILE CREATION / PRESENTATION → PROFESSIONAL APPROVAL → PAYMENT → PUBLICATION + PRO ACTIVATION."),
            ("STEP 2 · AFTER DIGIYLYFE VALIDATION","STEP 2 · CREATION AND APPROVAL BEFORE PAYMENT"),
            ("Pay, then start creation","Review and approve your profile before paying"),
            ("If your file is validated, DIGIYLYFE confirms the profile payment. After payment, the profile is created and activated. PRO membership at 19,900 FCFA/month starts with activation.","After file validation, DIGIYLYFE prepares your profile and presents it to you. You request any corrections and approve it. Payment is requested only after approval; publication and PRO activation follow payment."),
