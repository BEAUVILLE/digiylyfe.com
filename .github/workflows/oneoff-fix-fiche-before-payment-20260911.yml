          ])

          patch('tarifs-adherents-1.html',[
            ("memberCta:'PRÉPARER MON DOSSIER →'","memberCta:'PRÉPARER MON DOSSIER →'"),
            ("paymentTitle:'RÈGLEMENT APRÈS VALIDATION DU DOSSIER'","paymentTitle:'RÈGLEMENT APRÈS PRÉSENTATION ET ACCORD SUR LA FICHE'"),
            ("paymentLead:'N’effectuez aucun règlement maintenant. Envoyez d’abord vos renseignements. DIGIYLYFE valide humainement votre dossier, puis vous confirme le règlement.'","paymentLead:'N’effectuez aucun règlement maintenant. Envoyez vos renseignements : DIGIYLYFE valide le dossier, prépare la fiche, vous la présente et recueille votre accord. Le règlement vient seulement ensuite.'"),
            ("paymentTitle:'PAYMENT AFTER FILE VALIDATION'","paymentTitle:'PAYMENT AFTER PROFILE PRESENTATION AND APPROVAL'"),
            ("paymentLead:'Do not pay now. Send your information first. DIGIYLYFE validates your file, then confirms payment.'","paymentLead:'Do not pay now. Send your information first: DIGIYLYFE reviews the file, prepares the profile, presents it to you and gets your approval. Payment comes only after that.'"),
            ("const payValidated=(new URLSearchParams(location.search)).get('validated')==='1';const mc=document.getElementById('memberCta');mc.href=payValidated?'#paiement':'/preparer-ma-carte.html?plan=adherent-19900&country='+countryId.toLowerCase()+'&lang='+lang()+'&flow=prevalidation-20260911';const pg=document.querySelector('#paiement .paymentGrid'),pc=document.querySelector('#paiement .contactPay');if(pg)pg.style.display=payValidated?'grid':'none';if(pc)pc.style.display=payValidated?'flex':'none';","const payApproved=(new URLSearchParams(location.search)).get('approved')==='1';const mc=document.getElementById('memberCta');mc.href=payApproved?'#paiement':'/preparer-ma-carte.html?plan=adherent-19900&country='+countryId.toLowerCase()+'&lang='+lang()+'&flow=prevalidation-20260911';const pg=document.querySelector('#paiement .paymentGrid'),pc=document.querySelector('#paiement .contactPay');if(pg)pg.style.display=payApproved?'grid':'none';if(pc)pc.style.display=payApproved?'flex':'none';")
          ])
          PY
      - name: Commit sequence alignment
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/digiy-prevalidation-flow-20260911.js preparer-ma-carte.html adhesion-petite-cote.html tarifs-adherents-1.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: require fiche presentation and pro approval before payment [skip ci]"
          git push
