    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add static offer fallback and remove obsolete HUB
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tarifs-adherents-1.html')
          s=p.read_text(encoding='utf-8')
          reps={
          '<section class="hero"><span class="kicker" id="kicker"></span><h1 id="h1"></h1><p id="lead"></p></section>':'<section class="hero"><span class="kicker" id="kicker">PRÉSENCE · POSITIONNEMENT · NOTORIÉTÉ</span><h1 id="h1">Choisissez jusqu’où vous voulez aller.</h1><p id="lead">La CARTE vous rend présent. La FICHE vous positionne. Le SITE développe votre notoriété.</p></section>',
          '<article class="card primary"><span class="tag" id="member"></span><p class="desc" id="memberText"></p><div class="price" id="memberPrice"></div><div class="period" id="month"></div><ul id="memberItems"></ul><a class="cta" href="#paiement" id="memberCta"></a></article>':'<article class="card primary"><span class="tag" id="member">PRÉSENCE · CARTE · ADHÉRENT 1</span><p class="desc" id="memberText">Pour être visible, identifiable, joignable et partageable.</p><div class="price" id="memberPrice">19 900 FCFA · 45 €</div><div class="period" id="month">PAR MOIS</div><ul id="memberItems"><li>1 photo maximum</li><li>Carte de visite digitale + QR</li><li>Présence dans la vitrine DIGIYLYFE</li><li>WhatsApp · SMS · appel direct</li><li>8 langues</li><li>0 % de commission DIGIYLYFE</li></ul><a class="cta" href="#paiement" id="memberCta">PAYER / VOIR LE RÈGLEMENT</a></article>',
          '<article class="card"><span class="tag" id="sheet"></span><p class="desc" id="sheetText"></p><div class="price" id="sheetPrice"></div><ul id="sheetItems"></ul></article>':'<article class="card"><span class="tag" id="sheet">POSITIONNEMENT · FICHE DIGIYLYFE</span><p class="desc" id="sheetText">Pour présenter votre activité, détailler vos prestations et renforcer votre image professionnelle.</p><div class="price" id="sheetPrice">SÉNÉGAL · À PARTIR DE 100 000 FCFA · EUROPE · À PARTIR DE 250 €</div><ul id="sheetItems"><li>2 photos maximum</li><li>Mise en page personnalisée</li><li>Présentation enrichie de l’activité</li><li>Contact direct</li><li>Les ajouts supplémentaires sont facturés séparément</li></ul></article>',
          '<article class="card"><span class="tag" id="site"></span><p class="desc" id="siteText"></p><div class="price" id="sitePrice"></div><ul id="siteItems"></ul></article>':'<article class="card"><span class="tag" id="site">NOTORIÉTÉ · SITE DIGIYLYFE.COM</span><p class="desc" id="siteText">Pour développer votre univers, vos preuves, votre visibilité et installer durablement votre marque.</p><div class="price" id="sitePrice">SÉNÉGAL · À PARTIR DE 550 000 FCFA · EUROPE · À PARTIR DE 950 €</div><ul id="siteItems"><li>Conception et mise en page</li><li>Structure mobile</li><li>Contenus fournis par le client</li><li>Fonctions définies selon le projet</li><li>Prix supérieur possible selon l’exécution</li></ul></article>',
