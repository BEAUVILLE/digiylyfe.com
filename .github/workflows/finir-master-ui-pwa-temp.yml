name: Finaliser MASTER UI et PWA V5

on:
  push:
    paths:
      - '.github/workflows/finir-master-ui-pwa-temp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Corriger exceptions UI et PWA
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/digiy-master-ui-v1.css')
          s=p.read_text(encoding='utf-8')
          marker='/* COMMERCE CASCADE FIX V2 */'
          fix='\n/* COMMERCE CASCADE FIX V2 */\nbody[data-digiy-master-ui="commerce"] header .wrap>a:first-child{border:1px solid rgba(246,196,83,.45)!important;background:rgba(255,255,255,.09)!important;color:#fff3cf!important;box-shadow:none!important}\nbody[data-digiy-master-ui="commerce"] .join{background:rgba(255,255,255,.065)!important;color:var(--digiy-text)!important;border:1px solid rgba(246,196,83,.34)!important}\nbody[data-digiy-master-ui="commerce"] .join a{background:linear-gradient(135deg,var(--digiy-gold),var(--digiy-green))!important;color:#06140f!important}\nbody[data-digiy-master-ui="commerce"] .section .ico{background:rgba(94,234,212,.12)!important;color:var(--digiy-text)!important}\n'
          if marker not in s: s += fix
          p.write_text(s,encoding='utf-8')
          p=Path('beaute-bien-etre.html');s=p.read_text(encoding='utf-8').replace('<meta name="theme-color" content="#5f315f">','<meta name="theme-color" content="#0a2b20">',1);p.write_text(s,encoding='utf-8')
          p=Path('assets/digiy-territoire-petite-cote-cleaning-v1.js');s=p.read_text(encoding='utf-8').replace(' * Porte territoriale locale vers la fiche publique MANÉ & GNING.',' * Porte territoriale locale vers le MASTER NETTOYAGE, puis MANÉ & GNING.',1);p.write_text(s,encoding='utf-8')
          p=Path('sw.js');s=p.read_text(encoding='utf-8').replace('digiylyfe-pwa-20260830-territory-native-v4','digiylyfe-pwa-20260830-master-ui-v5');p.write_text(s,encoding='utf-8')
          for fn in ['index.html','territoire.html','nettoyage-master.html']:
              p=Path(fn);s=p.read_text(encoding='utf-8').replace('/sw.js?v=20260830-territory-native-v4','/sw.js?v=20260830-master-ui-v5');p.write_text(s,encoding='utf-8')
          PY
      - name: Verifier
        run: |
          set -euo pipefail
          grep -F 'COMMERCE CASCADE FIX V2' assets/digiy-master-ui-v1.css
          grep -F '<meta name="theme-color" content="#0a2b20">' beaute-bien-etre.html
          grep -F 'MASTER NETTOYAGE' assets/digiy-territoire-petite-cote-cleaning-v1.js
          grep -F 'digiylyfe-pwa-20260830-master-ui-v5' sw.js
          grep -F '/sw.js?v=20260830-master-ui-v5' index.html
          grep -F '/sw.js?v=20260830-master-ui-v5' territoire.html
          grep -F '/sw.js?v=20260830-master-ui-v5' nettoyage-master.html
          node --check assets/digiy-territoire-petite-cote-cleaning-v1.js
      - name: Publier et nettoyer
        run: |
          set -euo pipefail
          rm -f .github/workflows/finir-master-ui-pwa-temp.yml
          git config user.name 'DIGIYLYFE Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/digiy-master-ui-v1.css beaute-bien-etre.html assets/digiy-territoire-petite-cote-cleaning-v1.js sw.js index.html territoire.html nettoyage-master.html .github/workflows/finir-master-ui-pwa-temp.yml
          git commit -m 'MASTER UI corriger Commerce et aligner PWA V5'
          git push origin main
