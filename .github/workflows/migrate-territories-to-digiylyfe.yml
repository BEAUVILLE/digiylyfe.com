name: Migrate territories to DIGIYLYFE.COM

on:
  push:
    paths:
      - '.github/workflows/migrate-territories-to-digiylyfe.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Route territories through DIGIYLYFE.COM
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          replacements = {
              'https://digiy-hub.digiylyfe.com/territoire.html?zone=petite-cote': './territoire.html?zone=petite-cote',
              'https://digiy-hub.digiylyfe.com/territoire.html?zone=vallee-dordogne': './territoire.html?zone=vallee-dordogne',
              'https://digiy-hub.digiylyfe.com/': '#territoires',
              'data-i18n="footerHub">DIGIY HUB</a>': 'data-i18n="footerHub">TERRITOIRES</a>',
              '"footerHub":"DIGIY HUB"': '"footerHub":"TERRITOIRES"',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          index.write_text(text, encoding='utf-8')

          sarlat = Path('sarlat.html')
          s = sarlat.read_text(encoding='utf-8')
          s = s.replace('← Retour au HUB', '← Retour DIGIYLYFE')
          sarlat.write_text(s, encoding='utf-8')

          sitemap = Path('sitemap.xml')
          sm = sitemap.read_text(encoding='utf-8')
          if 'https://digiylyfe.com/territoire.html' not in sm:
              marker = '  <url><loc>https://digiylyfe.com/sarlat.html</loc>'
              entry = '  <url><loc>https://digiylyfe.com/territoire.html</loc><lastmod>2026-08-22</lastmod></url>\n'
              pos = sm.find(marker)
              if pos >= 0:
                  sm = sm[:pos] + entry + sm[pos:]
              else:
                  sm = sm.replace('</urlset>', entry + '</urlset>')
          sitemap.write_text(sm, encoding='utf-8')

          readme = Path('README.md')
          r = readme.read_text(encoding='utf-8')
          if '`territoire.html`' not in r:
              r = r.replace('- `sarlat.html` — porte territoriale Sarlat ;', '- `territoire.html` — moteur territorial public hébergé directement sur DIGIYLYFE.COM ;\n- `sarlat.html` — porte territoriale Sarlat ;')
          readme.write_text(r, encoding='utf-8')
          PY

          git config user.name "DIGIYLYFE Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sarlat.html sitemap.xml README.md territoire.html
          git rm .github/workflows/migrate-territories-to-digiylyfe.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Migration: make digiylyfe.com the territory source"
          git push origin HEAD:main
