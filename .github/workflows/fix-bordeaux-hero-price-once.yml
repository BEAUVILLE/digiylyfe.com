name: Fix Bordeaux hero price once
on:
  push:
    paths:
      - '.github/workflows/fix-bordeaux-hero-price-once.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Bordeaux hero price
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('bordeaux.html')
          s=p.read_text()
          old='<b>45 € / mois</b>'
          new='<b id="heroPrice">45 € / mois</b>'
          if s.count(old)!=1:
              raise SystemExit(f'hero price marker count={s.count(old)}')
          s=s.replace(old,new,1)
          old2="document.querySelectorAll('[data-l]').forEach(function(b){b.classList.toggle('on',b.dataset.l===currentLang())});}"
          new2="var pk=pack(),ui=pk&&pk.ui?pk.ui:null;document.getElementById('heroPrice').textContent=ui&&ui.price?ui.price:'45 € / mois';document.querySelectorAll('[data-l]').forEach(function(b){b.classList.toggle('on',b.dataset.l===currentLang())});}"
          if s.count(old2)!=1:
              raise SystemExit(f'applyCopy marker count={s.count(old2)}')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          print('Bordeaux hero price i18n guard OK')
          PY
      - name: Remove one-time workflow
        run: rm -f .github/workflows/fix-bordeaux-hero-price-once.yml
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bordeaux.html .github/workflows/fix-bordeaux-hero-price-once.yml
          git commit -m "Bordeaux: traduire le prix du hero"
          git push origin HEAD:main
