name: Install DIGIY card favorites

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-card-favorites.yml'
      - '.github/scripts/install-card-favorites.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch MON DIGIY and card masters
        run: python .github/scripts/install-card-favorites.py

      - name: Commit installation
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Already installed"
            exit 0
          fi
          git config user.name "DIGIYLYFE Bot"
          git config user.email "actions@users.noreply.github.com"
          git add mon-digiy.html masters/
          git commit -m "feat: connect member cards to MON DIGIY favorites"
          git push
