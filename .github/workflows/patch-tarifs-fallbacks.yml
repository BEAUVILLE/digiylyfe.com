name: Patch tariffs fallbacks
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-tarifs-fallbacks.yml'
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'UI: harden public tariffs fallbacks'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch tariffs pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              return text.replace(old, new, 1)

          # Structures / establishments page: make the commercial essentials visible without JS.
          p = Path('tarifs-adherents.html')
          text = p.read_text(encoding='utf-8')
          text = replace_once(text,
              '<section class="hero"><span class="kicker" id="kicker"></span><h1 id="h1"></h1><p id="lead"></p></section>',
              '<section class="hero"><span class="kicker" id="kicker">PRÉSENCE · POSITIONNEMENT · NOTORIÉTÉ</span><h1 id="h1">Choisissez jusqu’où vous voulez aller.</h1><p id="lead">La CARTE vous rend présent. La FICHE vous positionne. Le SITE développe votre notoriété.</p></section>',
              'structures hero')
          text = replace_once(text,
              '<article class="card primary"><span class="tag" id="member"></span><p class="desc" id="memberText"></p><div class="price" id="memberPrice"></div><div class="period" id="month"></div><ul id="memberItems"></ul><a class="cta" href="#paiement" id="memberCta"></a></article>\n<article class="card"><span class="tag" id="sheet"></span><p class="desc" id="sheetText"></p><div class="price" id="sheetPrice"></div><ul id="sheetItems"></ul></article>\n<article class="card"><span class="tag" id="site"></span><p class="desc" id="siteText"></p><div class="price" id="sitePrice"></div><ul id="siteItems"></ul></article>',
              '<article class="card primary"><span class="tag" id="member">PRÉSENCE · CARTE DIGIYLYFE</span><p class="desc" id="memberText">Pour être visible, identifiable, joignable et partageable.</p><div class="price" id="memberPrice">28 000 FCFA · 75 €</div><div class="period" id="month">PAR MOIS</div><ul id="memberItems"><li>1 photo maximum</li><li>Carte de visite digitale + QR</li><li>Présence dans la vitrine DIGIYLYFE</li><li>WhatsApp · SMS · appel direct</li><li>8 langues</li><li>0 % de commission DIGIYLYFE</li></ul><a class="cta" href="#paiement" id="memberCta">PAYER / VOIR LE RÈGLEMENT</a></article>\n<article class="card"><span class="tag" id="sheet">POSITIONNEMENT · FICHE DIGIYLYFE</span><p class="desc" id="sheetText">Pour présenter votre activité, détailler vos prestations et renforcer votre image professionnelle.</p><div class="price" id="sheetPrice">SÉNÉGAL · À PARTIR DE 100 000 FCFA · EUROPE · À PARTIR DE 250 €</div><ul id="sheetItems"><li>2 photos maximum</li><li>Mise en page personnalisée</li><li>Présentation enrichie de l’activité</li><li>Contact direct</li><li>Les ajouts supplémentaires sont facturés séparément</li></ul></article>\n<article class="card"><span class="tag" id="site">NOTORIÉTÉ · SITE DIGIYLYFE.COM</span><p class="desc" id="siteText">Pour développer votre univers, vos preuves, votre visibilité et installer durablement votre marque.</p><div class="price" id="sitePrice">SÉNÉGAL · À PARTIR DE 550 000 FCFA · EUROPE · À PARTIR DE 950 €</div><ul id="siteItems"><li>Conception et mise en page</li><li>Structure mobile</li><li>Contenus fournis par le client</li><li>Fonctions définies selon le projet</li><li>Prix supérieur possible selon l’exécution</li></ul></article>',
              'structures cards')
          text = replace_once(text, '<h2 id="locTitle"></h2>', '<h2 id="locTitle">DIGIY LOC — paliers par nombre d’hébergements</h2>', 'LOC title')
          text = replace_once(text, '<p id="locLead"></p>', '<p id="locLead">RESTO · EXPLORE · RÉSEAU : tarif unique 28 000 FCFA / 75 € par mois. DIGIY LOC est le seul module dont le tarif évolue par paliers selon le nombre d’hébergements actifs.</p>', 'LOC lead')
          text = replace_once(text, '<thead><tr><th id="locUnits"></th><th>🇸🇳 SÉNÉGAL</th><th>🇪🇺 EUROPE</th></tr></thead>', '<thead><tr><th id="locUnits">HÉBERGEMENTS / UNITÉS</th><th>🇸🇳 SÉNÉGAL</th><th>🇪🇺 EUROPE</th></tr></thead>', 'LOC units')
          text = replace_once(text, '<tr><td>+40</td><td id="locQuoteSn"></td><td id="locQuoteEu"></td></tr>', '<tr><td>+40</td><td id="locQuoteSn">SUR DEVIS</td><td id="locQuoteEu">SUR DEVIS</td></tr>', 'LOC +40 fallback')
          text = replace_once(text, '<p class="locNote" id="locNote"></p>', '<p class="locNote" id="locNote">Seul DIGIY LOC possède des paliers. Les calendriers des hébergements compris dans la tranche LOC sont inclus : calendrier public + gestion propriétaire par hébergement · réservation directe · paiement direct · 0 % commission DIGIYLYFE.</p>', 'LOC note')
          text = replace_once(text, '<div class="foot"><a href="https://digiylyfe.com/" id="back"></a><a href="https://digiy-hub.digiylyfe.com/" id="hub"></a></div>', '<div class="foot"><a href="https://digiylyfe.com/" id="back">Retour DIGIYLYFE</a></div>', 'structures obsolete HUB')
          text = replace_once(text, '"back","hub"].forEach', '"back"].forEach', 'structures JS hub reference')
          text, removed = re.subn(r',"hub":"[^"]*"', '', text)
          if removed < 1:
              raise SystemExit('structures HUB translations not found')
          p.write_text(text, encoding='utf-8')

          # 19 900 page: the old HUB link is already gone, remove the stale JS reference that can stop language switching.
          p = Path('tarifs-adherents-1.html')
          text = p.read_text(encoding='utf-8')
          text = replace_once(text, '"back","hub"].forEach', '"back"].forEach', 'metiers JS hub reference')
          text, removed = re.subn(r',"hub":"[^"]*"', '', text)
          if removed < 1:
              raise SystemExit('metiers HUB translations not found')
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "DIGIYLYFE Atelier"
          git config user.email "actions@users.noreply.github.com"
          git add tarifs-adherents.html tarifs-adherents-1.html
          git rm .github/workflows/patch-tarifs-fallbacks.yml
          git commit -m "UI: harden public tariffs fallbacks"
          git push
