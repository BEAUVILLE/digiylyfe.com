name: Dordogne finish alignment

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Finish Dordogne cache and EN label
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          changed=[]

          p=Path('territoire.html')
          s=p.read_text(encoding='utf-8')
          old='/assets/digiy-territoire-dordogne-projection-v1.js?v=20260826-sarlat-projection-v1'
          new='/assets/digiy-territoire-dordogne-projection-v1.js?v=20260827-dordogne-territory-annonces-v2'
          if old in s:
              s=s.replace(old,new,1); p.write_text(s,encoding='utf-8'); changed.append(str(p))

          p=Path('demo-dordogne.html')
          s=p.read_text(encoding='utf-8')
          old="en:['EXAMPLE · PRESENCE MODEL · NOT YET A MEMBER','This is how a complete DIGIYLYFE presence can look for this activity.','What the customer sees','The DIGIYLYFE promise','ONE EUROPE MEMBERSHIP','Picture your activity','The model shows the direction. Text, photos, services and contacts will belong to the real professional.','THIS PRESENCE COULD BE YOURS →','BACK TO OPEN PLACES →','Say what you are looking for.','LA VOIX turns a spoken request into a useful territory search.','TRY VOICE SEARCH →','DIGIYLYFE commercial demo · no fictional data is presented as a real member.','← VALLÉE DE LA DORDOGNE']"
          new="en:['EXAMPLE · PRESENCE MODEL · NOT YET A MEMBER','This is how a complete DIGIYLYFE presence can look for this activity.','What the customer sees','The DIGIYLYFE promise','ONE EUROPE MEMBERSHIP','Picture your activity','The model shows the direction. Text, photos, services and contacts will belong to the real professional.','THIS PRESENCE COULD BE YOURS →','BACK TO OPEN PLACES →','Say what you are looking for.','LA VOIX turns a spoken request into a useful territory search.','TRY VOICE SEARCH →','DIGIYLYFE commercial demo · no fictional data is presented as a real member.','← DORDOGNE VALLEY']"
          if old in s:
              s=s.replace(old,new,1); p.write_text(s,encoding='utf-8'); changed.append(str(p))

          if not changed:
              print('Already finished; nothing to do.')
              raise SystemExit(0)
          print('Changed:', *changed, sep='\n- ')
          PY

          if git diff --quiet -- territoire.html demo-dordogne.html; then
            echo "Nothing changed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add territoire.html demo-dordogne.html
          git commit -m "Dordogne: forcer projection territoire et finaliser EN"
          git push origin HEAD:main
