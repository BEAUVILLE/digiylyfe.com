name: Patch tariffs LOC transversal owner info

on:
  push:
    paths:
      - '.github/workflows/patch-index-owner-modules.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch tarifs-loc lightly
        shell: python
        run: |
          from pathlib import Path
          p=Path('tarifs-loc.html')
          s=p.read_text(encoding='utf-8')
          css_anchor='.productPreview{'
          css='.networkBreadth{margin:16px 0;padding:14px;border-radius:20px;border:1px solid rgba(94,234,212,.34);background:linear-gradient(145deg,rgba(20,184,166,.08),rgba(246,196,83,.06));text-align:center}\n.networkBreadth .previewLang{display:none}\n.networkBreadth h2{margin:7px 0 0;font-size:clamp(18px,4.2vw,25px);line-height:1.08}\n.networkBreadth p{margin:7px auto 0;max-width:760px;font-size:11.5px;line-height:1.45;color:rgba(255,255,255,.78);font-weight:850}\n.networkBreadthList{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin-top:10px}\n.networkBreadthList span{padding:7px 9px;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);font-size:10px;font-weight:950}\n.networkBreadthNote{margin-top:9px;font-size:10.5px;line-height:1.4;font-weight:1000;color:#dffff7}\n'
          if '.networkBreadth{' not in s:
              if css_anchor not in s: raise SystemExit('CSS anchor missing')
              s=s.replace(css_anchor,css+css_anchor,1)
          html_anchor='<section class="box productPreview" id="locProductPreview"'
          block='''<section class="box networkBreadth" id="networkBreadth" aria-label="DIGIYLYFE adapte l’accès propriétaire au métier">
<div class="previewLang" data-preview-lang="fr"><span class="previewKicker">DIGIYLYFE · PAS SEULEMENT LOC</span><h2>Un même accès propriétaire, des outils adaptés à votre métier.</h2><p>LOC est l’exemple détaillé présenté ici. DIGIYLYFE équipe aussi d’autres activités avec leur propre logique métier.</p><div class="networkBreadthList"><span>🏠 LOC · réservations</span><span>🚘 DRIVER · trajets</span><span>📅 RESA · rendez-vous</span><span>🛍️ COMMERCE · produits</span></div><div class="networkBreadthNote">Les outils changent selon l’activité. La relation client reste directe.</div></div>
<div class="previewLang" data-preview-lang="en"><span class="previewKicker">DIGIYLYFE · NOT ONLY LOC</span><h2>One owner access, tools adapted to your business.</h2><p>LOC is the detailed example shown here. DIGIYLYFE also equips other activities with their own business logic.</p><div class="networkBreadthList"><span>🏠 LOC · bookings</span><span>🚘 DRIVER · trips</span><span>📅 RESA · appointments</span><span>🛍️ COMMERCE · products</span></div><div class="networkBreadthNote">The tools change with the activity. The customer relationship stays direct.</div></div>
<div class="previewLang" data-preview-lang="es"><span class="previewKicker">DIGIYLYFE · NO SOLO LOC</span><h2>Un mismo acceso propietario, herramientas adaptadas a su actividad.</h2><p>LOC es el ejemplo detallado que se muestra aquí. DIGIYLYFE también equipa otras actividades con su propia lógica profesional.</p><div class="networkBreadthList"><span>🏠 LOC · reservas</span><span>🚘 DRIVER · trayectos</span><span>📅 RESA · citas</span><span>🛍️ COMMERCE · productos</span></div><div class="networkBreadthNote">Las herramientas cambian según la actividad. La relación con el cliente sigue siendo directa.</div></div>
<div class="previewLang" data-preview-lang="pt"><span class="previewKicker">DIGIYLYFE · NÃO APENAS LOC</span><h2>Um mesmo acesso do proprietário, ferramentas adaptadas à sua atividade.</h2><p>LOC é o exemplo detalhado apresentado aqui. A DIGIYLYFE também equipa outras atividades com a sua própria lógica profissional.</p><div class="networkBreadthList"><span>🏠 LOC · reservas</span><span>🚘 DRIVER · trajetos</span><span>📅 RESA · marcações</span><span>🛍️ COMMERCE · produtos</span></div><div class="networkBreadthNote">As ferramentas mudam conforme a atividade. A relação com o cliente permanece direta.</div></div>
<div class="previewLang" data-preview-lang="it"><span class="previewKicker">DIGIYLYFE · NON SOLO LOC</span><h2>Un unico accesso proprietario, strumenti adattati alla tua attività.</h2><p>LOC è l’esempio dettagliato mostrato qui. DIGIYLYFE equipaggia anche altre attività con la propria logica professionale.</p><div class="networkBreadthList"><span>🏠 LOC · prenotazioni</span><span>🚘 DRIVER · corse</span><span>📅 RESA · appuntamenti</span><span>🛍️ COMMERCE · prodotti</span></div><div class="networkBreadthNote">Gli strumenti cambiano con l’attività. La relazione con il cliente resta diretta.</div></div>
<div class="previewLang" data-preview-lang="de"><span class="previewKicker">DIGIYLYFE · NICHT NUR LOC</span><h2>Ein Eigentümerzugang, Werkzeuge passend zu Ihrem Geschäft.</h2><p>LOC ist das hier gezeigte ausführliche Beispiel. DIGIYLYFE stattet auch andere Tätigkeiten mit ihrer eigenen Geschäftslogik aus.</p><div class="networkBreadthList"><span>🏠 LOC · Buchungen</span><span>🚘 DRIVER · Fahrten</span><span>📅 RESA · Termine</span><span>🛍️ COMMERCE · Produkte</span></div><div class="networkBreadthNote">Die Werkzeuge ändern sich mit der Tätigkeit. Die Kundenbeziehung bleibt direkt.</div></div>
<div class="previewLang" data-preview-lang="nl"><span class="previewKicker">DIGIYLYFE · NIET ALLEEN LOC</span><h2>Eén eigenaarstoegang, tools aangepast aan uw activiteit.</h2><p>LOC is het uitgebreide voorbeeld dat hier wordt getoond. DIGIYLYFE rust ook andere activiteiten uit met hun eigen bedrijfslogica.</p><div class="networkBreadthList"><span>🏠 LOC · boekingen</span><span>🚘 DRIVER · ritten</span><span>📅 RESA · afspraken</span><span>🛍️ COMMERCE · producten</span></div><div class="networkBreadthNote">De tools veranderen met de activiteit. De klantrelatie blijft rechtstreeks.</div></div>
<div class="previewLang" data-preview-lang="ar"><span class="previewKicker">DIGIYLYFE · ليست LOC فقط</span><h2>دخول مالك واحد، وأدوات تتكيف مع نشاطك.</h2><p>LOC هو المثال التفصيلي المعروض هنا. كما تجهز DIGIYLYFE أنشطة أخرى بمنطق مهني خاص بكل نشاط.</p><div class="networkBreadthList"><span>🏠 LOC · الحجوزات</span><span>🚘 DRIVER · الرحلات</span><span>📅 RESA · المواعيد</span><span>🛍️ COMMERCE · المنتجات</span></div><div class="networkBreadthNote">تتغير الأدوات حسب النشاط، وتبقى العلاقة مع العميل مباشرة.</div></div>
</section>\n\n'''
          if 'id="networkBreadth"' not in s:
              if html_anchor not in s: raise SystemExit('HTML anchor missing')
              s=s.replace(html_anchor,block+html_anchor,1)
          p.write_text(s,encoding='utf-8')
      - name: Verify patch
        run: |
          grep -q 'DIGIYLYFE · PAS SEULEMENT LOC' tarifs-loc.html
          grep -q '🚘 DRIVER · trajets' tarifs-loc.html
          grep -q '📅 RESA · rendez-vous' tarifs-loc.html
          grep -q '🛍️ COMMERCE · produits' tarifs-loc.html
          git diff --check
      - name: Commit patch and cleanup
        run: |
          rm -f .github/workflows/patch-index-owner-modules.yml .github/workflows/temp-trigger-loc-note.txt .github/workflows/temp-cleanup-loc-note.yml .github/workflows/poke-loc-final.txt .github/workflows/poke-final-loc.txt
          git config user.name "DIGIY LYFE"
          git config user.email "baptistejb24@gmail.com"
          git add -A
          git commit -m "feat: clarify DIGIY module breadth on LOC pricing"
          git pull --rebase
          git push
