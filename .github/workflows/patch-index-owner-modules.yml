name: Patch index owner module breadth

on:
  push:
    paths:
      - '.github/workflows/patch-index-owner-modules.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch index owner module breadth
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css_anchor = '    /* ===== DIGIY CAMPUS · pré-lancement ===== */'
          css = '''    /* ===== ACCÈS PROPRIÉTAIRE · aperçu transversal métiers ===== */
          .ownerModules{margin:14px 0;padding:16px;border-radius:26px;border:1px solid rgba(45,212,191,.34);background:linear-gradient(145deg,rgba(45,212,191,.09),rgba(246,196,83,.07));text-align:center}
          .ownerModulesLang{display:none}
          html[lang^="fr"] .ownerModulesLang[data-owner-lang="fr"],html[lang^="en"] .ownerModulesLang[data-owner-lang="en"],html[lang^="es"] .ownerModulesLang[data-owner-lang="es"],html[lang^="pt"] .ownerModulesLang[data-owner-lang="pt"],html[lang^="it"] .ownerModulesLang[data-owner-lang="it"],html[lang^="de"] .ownerModulesLang[data-owner-lang="de"],html[lang^="nl"] .ownerModulesLang[data-owner-lang="nl"],html[lang^="ar"] .ownerModulesLang[data-owner-lang="ar"]{display:block}
          .ownerModulesKicker{display:inline-flex;padding:6px 9px;border-radius:999px;border:1px solid rgba(45,212,191,.48);background:rgba(45,212,191,.08);color:#c9fff7;font-size:9.5px;font-weight:1000;letter-spacing:.07em;text-transform:uppercase}
          .ownerModules h2{margin:9px 0 0;font-size:clamp(20px,4.6vw,29px);line-height:1.05;font-weight:1000;letter-spacing:-.025em}
          .ownerModules p{margin:8px auto 0;max-width:760px;color:var(--soft);font-size:11.5px;line-height:1.45;font-weight:850}
          .ownerModuleList{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin-top:11px}
          .ownerModule{padding:8px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.055);font-size:10px;line-height:1.25;font-weight:900}
          .ownerModule b{color:#fff3cf}
          .ownerModulesBottom{margin-top:10px;color:#eafff5;font-size:11px;line-height:1.4;font-weight:1000}

          '''
          if 'ACCÈS PROPRIÉTAIRE · aperçu transversal métiers' not in s:
              if css_anchor not in s:
                  raise SystemExit('CSS anchor missing')
              s = s.replace(css_anchor, css + css_anchor, 1)

          block = '''    <section class="ownerModules" aria-label="Accès propriétaire adaptés aux métiers DIGIYLYFE">
              <div class="ownerModulesLang" data-owner-lang="fr"><span class="ownerModulesKicker">ACCÈS PROPRIÉTAIRE · SELON VOTRE MÉTIER</span><h2>Un même réseau. Des outils adaptés à votre activité.</h2><p>Depuis votre fiche professionnelle, votre accès PROPRIÉTAIRE ouvre les outils utiles à votre métier.</p><div class="ownerModuleList"><span class="ownerModule"><b>🏠 LOC</b> · disponibilités · tarifs · réservations</span><span class="ownerModule"><b>🚘 DRIVER</b> · trajets · disponibilités · demandes clients</span><span class="ownerModule"><b>📅 RESA</b> · créneaux · rendez-vous · confirmations</span><span class="ownerModule"><b>🛍️ COMMERCE</b> · produits · disponibilité · demandes clients</span></div><div class="ownerModulesBottom">Les outils changent selon votre activité. La relation client reste directe.</div></div>
              <div class="ownerModulesLang" data-owner-lang="en"><span class="ownerModulesKicker">OWNER ACCESS · BUILT FOR YOUR BUSINESS</span><h2>One network. Tools adapted to your activity.</h2><p>From your professional profile, your OWNER access opens the tools useful to your business.</p><div class="ownerModuleList"><span class="ownerModule"><b>🏠 LOC</b> · availability · prices · bookings</span><span class="ownerModule"><b>🚘 DRIVER</b> · trips · availability · customer requests</span><span class="ownerModule"><b>📅 RESA</b> · time slots · appointments · confirmations</span><span class="ownerModule"><b>🛍️ COMMERCE</b> · products · availability · customer requests</span></div><div class="ownerModulesBottom">The tools change with your activity. The customer relationship stays direct.</div></div>
              <div class="ownerModulesLang" data-owner-lang="es"><span class="ownerModulesKicker">ACCESO PROPIETARIO · SEGÚN SU ACTIVIDAD</span><h2>Una misma red. Herramientas adaptadas a su actividad.</h2><p>Desde su ficha profesional, el acceso PROPIETARIO abre las herramientas útiles para su actividad.</p><div class="ownerModuleList"><span class="ownerModule"><b>🏠 LOC</b> · disponibilidad · tarifas · reservas</span><span class="ownerModule"><b>🚘 DRIVER</b> · trayectos · disponibilidad · solicitudes</span><span class="ownerModule"><b>📅 RESA</b> · horarios · citas · confirmaciones</span><span class="ownerModule"><b>🛍️ COMMERCE</b> · productos · disponibilidad · solicitudes</span></div><div class="ownerModulesBottom">Las herramientas cambian según su actividad. La relación con el cliente sigue siendo directa.</div></div>
              <div class="ownerModulesLang" data-owner-lang="pt"><span class="ownerModulesKicker">ACESSO DO PROPRIETÁRIO · CONFORME A SUA ATIVIDADE</span><h2>Uma só rede. Ferramentas adaptadas à sua atividade.</h2><p>A partir da sua ficha profissional, o acesso PROPRIETÁRIO abre as ferramentas úteis ao seu negócio.</p><div class="ownerModuleList"><span class="ownerModule"><b>🏠 LOC</b> · disponibilidade · tarifas · reservas</span><span class="ownerModule"><b>🚘 DRIVER</b> · trajetos · disponibilidade · pedidos</span><span class="ownerModule"><b>📅 RESA</b> · horários · marcações · confirmações</span><span class="ownerModule"><b>🛍️ COMMERCE</b> · produtos · disponibilidade · pedidos</span></div><div class="ownerModulesBottom">As ferramentas mudam conforme a atividade. A relação com o cliente permanece direta.</div></div>
              <div class="ownerModulesLang" data-owner-lang="it"><span class="ownerModulesKicker">ACCESSO PROPRIETARIO · SECONDO LA TUA ATTIVITÀ</span><h2>Un’unica rete. Strumenti adatti alla tua attività.</h2><p>Dalla tua scheda professionale, l’accesso PROPRIETARIO apre gli strumenti utili al tuo lavoro.</p><div class="ownerModuleList"><span class="ownerModule"><b>🏠 LOC</b> · disponibilità · tariffe · prenotazioni</span><span class="ownerModule"><b>🚘 DRIVER</b> · corse · disponibilità · richieste clienti</span><span class="ownerModule"><b>📅 RESA</b> · fasce orarie · appuntamenti · conferme</span><span class="ownerModule"><b>🛍️ COMMERCE</b> · prodotti · disponibilità · richieste</span></div><div class="ownerModulesBottom">Gli strumenti cambiano secondo l’attività. La relazione con il cliente resta diretta.</div></div>
              <div class="ownerModulesLang" data-owner-lang="de"><span class="ownerModulesKicker">EIGENTÜMERZUGANG · PASSEND ZU IHREM GESCHÄFT</span><h2>Ein Netzwerk. Werkzeuge passend zu Ihrer Tätigkeit.</h2><p>Über Ihr professionelles Profil öffnet der EIGENTÜMER-Zugang die für Ihre Tätigkeit nützlichen Werkzeuge.</p><div class="ownerModuleList"><span class="ownerModule"><b>🏠 LOC</b> · Verfügbarkeit · Preise · Buchungen</span><span class="ownerModule"><b>🚘 DRIVER</b> · Fahrten · Verfügbarkeit · Anfragen</span><span class="ownerModule"><b>📅 RESA</b> · Zeitfenster · Termine · Bestätigungen</span><span class="ownerModule"><b>🛍️ COMMERCE</b> · Produkte · Verfügbarkeit · Anfragen</span></div><div class="ownerModulesBottom">Die Werkzeuge ändern sich mit Ihrer Tätigkeit. Die Kundenbeziehung bleibt direkt.</div></div>
              <div class="ownerModulesLang" data-owner-lang="nl"><span class="ownerModulesKicker">EIGENAARSTOEGANG · VOLGENS UW ACTIVITEIT</span><h2>Eén netwerk. Tools aangepast aan uw activiteit.</h2><p>Vanuit uw professionele fiche opent de EIGENAARSTOEGANG de tools die nuttig zijn voor uw activiteit.</p><div class="ownerModuleList"><span class="ownerModule"><b>🏠 LOC</b> · beschikbaarheid · prijzen · boekingen</span><span class="ownerModule"><b>🚘 DRIVER</b> · ritten · beschikbaarheid · aanvragen</span><span class="ownerModule"><b>📅 RESA</b> · tijdsloten · afspraken · bevestigingen</span><span class="ownerModule"><b>🛍️ COMMERCE</b> · producten · beschikbaarheid · aanvragen</span></div><div class="ownerModulesBottom">De tools veranderen met uw activiteit. De klantrelatie blijft rechtstreeks.</div></div>
              <div class="ownerModulesLang" data-owner-lang="ar"><span class="ownerModulesKicker">دخول المالك · حسب نشاطك</span><h2>شبكة واحدة. أدوات تتكيف مع نشاطك.</h2><p>من بطاقتك المهنية، يفتح دخول المالك الأدوات المناسبة لنشاطك.</p><div class="ownerModuleList"><span class="ownerModule"><b>🏠 LOC</b> · التوفر · الأسعار · الحجوزات</span><span class="ownerModule"><b>🚘 DRIVER</b> · الرحلات · التوفر · طلبات العملاء</span><span class="ownerModule"><b>📅 RESA</b> · المواعيد · الحجوزات · التأكيدات</span><span class="ownerModule"><b>🛍️ COMMERCE</b> · المنتجات · التوفر · طلبات العملاء</span></div><div class="ownerModulesBottom">تتغير الأدوات حسب نشاطك. وتبقى العلاقة مع العميل مباشرة.</div></div>
            </section>'''
          marker = 'ACCÈS PROPRIÉTAIRE · SELON VOTRE MÉTIER'
          if marker not in s:
              pos = s.find('<section class="digiyEntryChoice"')
              if pos < 0:
                  raise SystemExit('Entry section missing')
              end = s.find('</section>', pos)
              if end < 0:
                  raise SystemExit('Entry section end missing')
              end += len('</section>')
              s = s[:end] + '\n\n' + block + s[end:]
          p.write_text(s, encoding='utf-8')
      - name: Verify patch
        run: |
          grep -q "ACCÈS PROPRIÉTAIRE · SELON VOTRE MÉTIER" index.html
          grep -q "🛍️ COMMERCE" index.html
          test "$(grep -o 'data-owner-lang=' index.html | wc -l)" -eq 8
          git diff --check
      - name: Commit patch and remove one-shot workflow
        run: |
          rm .github/workflows/patch-index-owner-modules.yml
          git config user.name "DIGIY LYFE"
          git config user.email "baptistejb24@gmail.com"
          git add index.html .github/workflows/patch-index-owner-modules.yml
          git commit -m "feat: clarify owner access across DIGIY modules"
          git push
