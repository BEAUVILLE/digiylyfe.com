name: Raccorder les trois portes Sarlat restantes
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-sarlat-three-more-doors.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajouter annonces transport artisan
        shell: python
        run: |
          from pathlib import Path
          p=Path('sarlat.html')
          s=p.read_text()
          old="var DIRECT_DOORS={accommodation:'https://loc.digiylyfe.com/',food:'https://resto.digiylyfe.com/',shopping:'https://market.digiylyfe.com/',beauty:'/beaute-bien-etre.html',jobs:'https://jobs.digiylyfe.com/',guidance:'https://pro-action-digiy.digiylyfe.com/'};"
          new="var DIRECT_DOORS={announcements:'/sarlat.html?need=announcements#places',transport:'https://driver-client.digiylyfe.com/',artisan:'https://build.digiylyfe.com/',accommodation:'https://loc.digiylyfe.com/',food:'https://resto.digiylyfe.com/',shopping:'https://market.digiylyfe.com/',beauty:'/beaute-bien-etre.html',jobs:'https://jobs.digiylyfe.com/',guidance:'https://pro-action-digiy.digiylyfe.com/'};"
          if old not in s:
              raise SystemExit('DIRECT_DOORS attendu introuvable')
          p.write_text(s.replace(old,new,1))
      - name: Vérifier
        shell: bash
        run: |
          grep -F "announcements:'/sarlat.html?need=announcements#places'" sarlat.html
          grep -F "transport:'https://driver-client.digiylyfe.com/'" sarlat.html
          grep -F "artisan:'https://build.digiylyfe.com/'" sarlat.html
      - name: Commit
        shell: bash
        run: |
          git config user.name 'DIGIY LYFE'
          git config user.email 'baptistejb24@gmail.com'
          git add sarlat.html
          git commit -m 'Raccorder annonces déplacement artisan à Sarlat'
          git push
