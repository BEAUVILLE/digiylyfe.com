name: Update card master favorite version once

on:
  push:
    paths:
      - '.github/workflows/update-card-master-favorite-version-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update industrial card masters
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          old = 'https://digiylyfe.com/assets/digiy-card-favorite-v1.js?v=20260904-v1'
          new = 'https://digiylyfe.com/assets/digiy-card-favorite-v1.js?v=20260906-v2'
          paths = sorted(Path('masters').glob('MASTER-CARTE-*-8-LANGUES.html'))
          changed = []
          hits = 0

          for path in paths:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count:
                  text = text.replace(old, new)
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))
                  hits += count

          if hits != 4:
              raise SystemExit(f'Expected 4 master references, found {hits}: {changed}')

          print('Updated:', *changed, sep='\n- ')
          PY

      - name: Verify and commit
        shell: bash
        run: |
          grep -R --include='MASTER-CARTE-*-8-LANGUES.html' -n 'digiy-card-favorite-v1.js?v=20260906-v2' masters
          if grep -R --include='MASTER-CARTE-*-8-LANGUES.html' -q 'digiy-card-favorite-v1.js?v=20260904-v1' masters; then
            echo 'Old favorite version still present in an industrial card master' >&2
            exit 1
          fi
          rm .github/workflows/update-card-master-favorite-version-once.yml
          git config user.name 'DIGIYLYFE Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add masters .github/workflows/update-card-master-favorite-version-once.yml
          git diff --cached --check
          git commit -m 'fix: align card masters with stable MON DIGIY favorite [skip ci]'
          git push origin HEAD:main
