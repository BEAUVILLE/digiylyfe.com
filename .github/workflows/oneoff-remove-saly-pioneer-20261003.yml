name: Remove obsolete Saly pioneer offer

on:
  push:
    paths:
      - '.github/workflows/oneoff-remove-saly-pioneer-20261003.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove obsolete pioneer block
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          start = s.find('    <section id="digiySalyPilotEntry"')
          if start < 0:
              raise SystemExit('digiySalyPilotEntry block not found')
          end = s.find('    </section>', start)
          if end < 0:
              raise SystemExit('closing section not found')
          end += len('    </section>')
          s = s[:start] + s[end:]
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
          if grep -nE 'OFFRE PIONNIER TEMPORAIRE|Pilote Saly · premiers professionnels sélectionnés|pionnier-saly-13000|Je candidate comme pionnier' index.html; then
            echo 'Legacy pioneer wording still present' >&2
            exit 1
          fi
      - name: Commit cleanup and remove one-off workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/oneoff-remove-saly-pioneer-20261003.yml
          git add index.html
          git commit -m 'Remove obsolete Saly pioneer offer'
          git push origin main
