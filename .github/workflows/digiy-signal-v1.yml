name: DIGIY SIGNAL V1
on:
  pull_request:
    paths:
      - 'signal/v1/**'
      - 'scripts/digiy-signal-v1-sources.json'
      - 'scripts/verify-digiy-signal-v1.py'
      - '.github/workflows/digiy-signal-v1.yml'
      - 'llms.txt'
      - 'cartes/babakar-plombier-saly.html'
      - 'cartes/sodior-btp.html'
      - 'oncle-noa.html'
      - 'carte-mass-coolj.html'
      - 'carte-niery-art.html'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/verify-digiy-signal-v1.py
