name: Patch LOC commission message

on:
  push:
    paths:
      - '.github/workflows/patch-loc-commission-message.yml'
      - '.github/scripts/patch-loc-commission-message.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/patch-loc-commission-message.py
      - run: |
          if git diff --quiet; then exit 0; fi
          git diff --check
          test "$(git diff --name-only)" = "tarifs-loc.html"
          git config user.name "DIGIY LYFE"
          git config user.email "baptistejb24@gmail.com"
          git add tarifs-loc.html
          git commit -m "pricing: explain LOC annual value against commissions"
          git push
