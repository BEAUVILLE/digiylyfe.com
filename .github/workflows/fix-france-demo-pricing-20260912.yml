name: Fix France demo pricing visibility

on:
  push:
    paths:
      - '.github/workflows/fix-france-demo-pricing-20260912.yml'

permissions:
  contents: write

jobs:
  fix-demo-pricing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add profile fee to France example cards
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          changed=[]

          def replace_once(path, old, new):
              p=Path(path)
              s=p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'Expected fragment not found in {path}')
              s2=s.replace(old,new,1)
              p.write_text(s2,encoding='utf-8')
              changed.append(path)

          replace_once(
              'bordeaux.html',
              '''<div class="chips">'+services+'<span class="chip">'+price+'</span><span class="chip">'+commission+'</span>''',
              '''<div class="chips">'+services+'<span class="chip">FICHE PRO · 250 €</span><span class="chip">'+price+'</span><span class="chip">'+commission+'</span>'''
          )

          replace_once(
              'sarlat.html',
              '''<span class="chip">'+card+'</span><span class="chip">'+price+'</span><span class="chip">'+commission+'</span>''',
              '''<span class="chip">'+card+'</span><span class="chip">FICHE PRO · 250 €</span><span class="chip">'+price+'</span><span class="chip">'+commission+'</span>'''
          )

          print('changed:', changed)
          PY
          git config user.name 'DIGIY LYFE'
          git config user.email 'baptistejb24@gmail.com'
          git add bordeaux.html sarlat.html
          git commit -m 'fix: show profile fee on France example cards'
          git push
