name: Install Helage signature
on:
  push:
    paths:
      - '.github/workflows/install-helage-signature.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install Helage Carte Vitrine loaders
        shell: python
        run: |
          from pathlib import Path
          tag='<script src="/assets/digiy-helage-signature-v1.js?v=20260829-v1" defer></script>'
          for name in ['index.html','territoire.html','saly.html']:
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              if 'digiy-helage-signature-v1.js' not in s:
                  if '</body>' not in s:
                      raise SystemExit(f'{name}: closing body not found')
                  s=s.replace('</body>',tag+'\n</body>',1)
                  p.write_text(s,encoding='utf-8')
          Path('.github/workflows/install-helage-signature.yml').unlink()
      - name: Commit final production state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html territoire.html saly.html .github/workflows/install-helage-signature.yml
          git commit -m "Install Helage card signature [skip ci]"
          git push origin main
