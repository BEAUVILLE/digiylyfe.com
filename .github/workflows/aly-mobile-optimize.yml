name: Optimize Aly mobile video

on:
  push:
    branches: [main]
    paths:
      - 'aly-portrait-carre-720_generated.mp4'
      - '.github/workflows/aly-mobile-optimize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Create mobile Aly video
        run: |
          ffmpeg -y -i aly-portrait-carre-720_generated.mp4 \
            -vf "scale='min(540,iw)':'min(540,ih)':force_original_aspect_ratio=decrease" \
            -c:v libx264 -preset slow -profile:v main -level 3.1 \
            -b:v 360k -maxrate 430k -bufsize 720k \
            -pix_fmt yuv420p -movflags +faststart \
            -c:a aac -b:a 48k -ac 1 \
            aly-portrait-carre-mobile.mp4
          ls -lh aly-portrait-carre-720_generated.mp4 aly-portrait-carre-mobile.mp4

      - name: Wire mobile source into Aly page
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('aly-parle.html')
          s = p.read_text(encoding='utf-8')
          desktop = '<source src="./aly-portrait-carre-720_generated.mp4" type="video/mp4">'
          mobile = '<source src="./aly-portrait-carre-mobile.mp4" type="video/mp4" media="(max-width: 820px)">\n<source src="./aly-portrait-carre-720_generated.mp4" type="video/mp4">'
          if 'aly-portrait-carre-mobile.mp4' not in s:
              s = s.replace(desktop, mobile)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit optimized video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aly-portrait-carre-mobile.mp4 aly-parle.html
          git diff --cached --quiet && exit 0
          git commit -m "perf: add lightweight Aly mobile video"
          git push
