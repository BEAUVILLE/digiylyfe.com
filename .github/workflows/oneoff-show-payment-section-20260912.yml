name: Show payment section before approval

on:
  push:
    paths:
      - '.github/workflows/oneoff-show-payment-section-20260912.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make payment methods visible with prevalidation warning
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tarifs-adherents-1.html')
          s=p.read_text()
          old1='<div class="paymentGrid" style="display:none">'
          old2='<div class="contactPay" style="display:none">'
          if old1 in s: s=s.replace(old1,'<div class="paymentGrid">',1)
          if old2 in s: s=s.replace(old2,'<div class="contactPay">',1)
          old="if(pg)pg.style.display=payApproved?'grid':'none';if(pc)pc.style.display=payApproved?'flex':'none';"
          new="if(pg)pg.style.display='grid';if(pc)pc.style.display='flex';"
          if old not in s:
              raise SystemExit('payment visibility marker missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git config user.name 'DIGIY LYFE'
          git config user.email 'baptistejb24@gmail.com'
          git add tarifs-adherents-1.html
          git commit -m 'fix: keep payment section visible before approval'
          git push
