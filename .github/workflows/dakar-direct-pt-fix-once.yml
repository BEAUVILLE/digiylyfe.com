name: Dakar direct PT fix once
on:
  push:
    paths:
      - '.github/workflows/dakar-direct-pt-fix-once.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate patch
        run: python3 -m py_compile scripts/dakar-direct-pt-fix.py
      - name: Apply
        run: python3 scripts/dakar-direct-pt-fix.py
      - name: Validate
        run: |
          node --check assets/digiy-territoire-runtime-v1.js
          grep -q "DAKAR EM DIRETO" assets/digiy-territoire-runtime-v1.js
          grep -q "20260827-live-i18n-v3" territoire.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/digiy-territoire-runtime-v1.js territoire.html
          git commit -m 'Dakar: traduire la porte directe en portugais'
          git push
