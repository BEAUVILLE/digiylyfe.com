name: Finalize Aly index

on:
  push:
    branches:
      - assistant/aly-index-file

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assistant/aly-index-file
      - name: Replace branch index with Aly version
        run: |
          cp index-avec-aly.html index.html
          rm .github/workflows/finalize-index-aly.yml
      - name: Commit final index
        run: |
          git config user.name "DIGIYLYFE Builder"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/finalize-index-aly.yml
          git commit -m "Finalize index.html with Aly Kane [aly-final]"
          git push origin HEAD:assistant/aly-index-file
