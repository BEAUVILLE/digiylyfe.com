name: Ajouter le manifeste conversationnel DIGIYLYFE

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-conversation-bridge.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Ajouter le bloc stratégique conversationnel
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_build = '<meta content="index-hub-tarifs-reglement-haut-20260809" name="digiy-build"/>'
          new_build = '<meta content="index-hub-conversationnel-20260810" name="digiy-build"/>'
          if old_build in s:
              s = s.replace(old_build, new_build, 1)

          css_anchor = '.voiceCta{min-width:150px;flex-direction:column;gap:4px;min-height:54px;padding:10px 16px;border-radius:999px;display:flex;align-items:center;justify-content:center;text-align:center;background:linear-gradient(135deg,var(--gold-soft),var(--gold),var(--green));color:#06140f;font-size:13px;line-height:1.18;font-weight:1000;box-shadow:0 14px 34px rgba(0,0,0,.28)}\n'
          css_block = '''.voiceCta{min-width:150px;flex-direction:column;gap:4px;min-height:54px;padding:10px 16px;border-radius:999px;display:flex;align-items:center;justify-content:center;text-align:center;background:linear-gradient(135deg,var(--gold-soft),var(--gold),var(--green));color:#06140f;font-size:13px;line-height:1.18;font-weight:1000;box-shadow:0 14px 34px rgba(0,0,0,.28)}

/* Le nouveau Web : conversation -> terrain -> relation directe */
.conversationBridge{
  position:relative;z-index:1;margin-top:11px;padding:15px 16px;border-radius:24px;
  border:1px solid rgba(45,212,191,.70);
  background:radial-gradient(520px 190px at 100% 0,rgba(45,212,191,.16),transparent 68%),linear-gradient(145deg,rgba(5,43,30,.96),rgba(4,23,17,.98));
  box-shadow:0 14px 34px rgba(0,0,0,.24);text-align:center
}
.conversationTag{display:block;color:#bdf7d2;font-size:10px;font-weight:1000;letter-spacing:.10em;text-transform:uppercase}
.conversationBrands{margin-top:8px;color:#fff3cf;font-size:clamp(11px,2.8vw,14px);font-weight:1000;letter-spacing:.025em}
.conversationBridge strong{display:block;margin-top:7px;font-size:clamp(22px,5vw,34px);line-height:1;font-weight:1000;letter-spacing:-.035em}
.conversationBridge p{margin:8px 0 0;color:rgba(255,250,240,.92);font-size:clamp(13px,3.3vw,17px);line-height:1.35;font-weight:900}
.conversationBridge p b{color:#f6c453}
.conversationNote{display:block;margin-top:7px;color:rgba(255,250,240,.58);font-size:9.5px;line-height:1.3;font-style:normal;font-weight:800}
'''
          if '.conversationBridge{' not in s:
              if css_anchor not in s:
                  raise SystemExit('CSS anchor not found')
              s = s.replace(css_anchor, css_block, 1)

          html_anchor = '''</a>
<a aria-label="Découvrir Aly Kane — La Voix du Terrain" class="alyDoor"'''
          html_block = '''</a>
<section aria-label="Le nouveau Web conversationnel" class="conversationBridge">
<small class="conversationTag" data-i18n="conversationTag">LE NOUVEAU WEB · CONVERSATION → TERRAIN</small>
<div class="conversationBrands">ChatGPT · Gemini · Grok · DeepSeek · Claude</div>
<strong data-i18n="conversationTitle">La conversation ouvre la porte.</strong>
<p><b>DIGIYLYFE</b> <span data-i18n="conversationText">connecte le terrain. Le professionnel garde la relation.</span></p>
<em class="conversationNote" data-i18n="conversationNote">DIGIYLYFE est indépendant des services cités ; aucune affiliation n’est revendiquée.</em>
</section>
<a aria-label="Découvrir Aly Kane — La Voix du Terrain" class="alyDoor"'''
          if 'class="conversationBridge"' not in s:
              if html_anchor not in s:
                  raise SystemExit('HTML anchor not found')
              s = s.replace(html_anchor, html_block, 1)

          fr_anchor = "voiceCta:'Parler ou rechercher →',voiceSeparate:'Micro · ouverture séparée',fridgeTag:"
          fr_repl = "voiceCta:'Parler ou rechercher →',voiceSeparate:'Micro · ouverture séparée',conversationTag:'LE NOUVEAU WEB · CONVERSATION → TERRAIN',conversationTitle:'La conversation ouvre la porte.',conversationText:'connecte le terrain. Le professionnel garde la relation.',conversationNote:'DIGIYLYFE est indépendant des services cités ; aucune affiliation n’est revendiquée.',fridgeTag:"
          if "conversationTag:'LE NOUVEAU WEB" not in s:
              if fr_anchor not in s:
                  raise SystemExit('FR i18n anchor not found')
              s = s.replace(fr_anchor, fr_repl, 1)

          en_anchor = "voiceCta:'Speak or search →',voiceSeparate:'Microphone · opens separately',fridgeTag:"
          en_repl = "voiceCta:'Speak or search →',voiceSeparate:'Microphone · opens separately',conversationTag:'THE NEW WEB · CONVERSATION → FIELD',conversationTitle:'Conversation opens the door.',conversationText:'connects the field. The professional keeps the relationship.',conversationNote:'DIGIYLYFE is independent from the services named above; no affiliation is claimed.',fridgeTag:"
          if "conversationTag:'THE NEW WEB" not in s:
              if en_anchor not in s:
                  raise SystemExit('EN i18n anchor not found')
              s = s.replace(en_anchor, en_repl, 1)

          required = [
              'ChatGPT · Gemini · Grok · DeepSeek · Claude',
              'La conversation ouvre la porte.',
              'Le professionnel garde la relation.',
              'manifest.json?v=20260810',
              "navigator.serviceWorker.register('/sw.js',{scope:'/'})",
              '19 900 FCFA/mois'
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit('Validation failed: ' + repr(missing))

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit et nettoyage du workflow ponctuel
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-conversation-bridge.yml
          git add index.html
          git diff --cached --check
          git commit -m "Poser le manifeste du Web conversationnel [skip ci]"
          git push origin main
