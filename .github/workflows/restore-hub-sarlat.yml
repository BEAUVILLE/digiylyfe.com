name: Restore DIGIYLYFE HUB with two Sarlat doors

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/restore-hub-sarlat.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore the real HUB and integrate both Sarlat doors
        shell: bash
        run: |
          git show b9880910dc5a0a9844c51e02d0fe50fc17dd0527:index.html > index.html

          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          html = re.sub(
              r'<meta content="[^"]*" name="digiy-build"/>',
              '<meta content="index-hub-production-sarlat-deux-portes-20260725" name="digiy-build"/>',
              html,
              count=1,
          )

          html = html.replace(
              "background:linear-gradient(120deg,rgba(4,19,13,.38),rgba(4,19,13,.92)),url('https://malraux-entre2.digiylyfe.com/photos/entre2-terrasse.jpg') center/cover;",
              "background:linear-gradient(120deg,rgba(4,19,13,.35),rgba(4,19,13,.91)),url('https://digiylyfe.net/wp-content/uploads/2026/07/1D087BF5-6D9F-462D-91A5-6420FC1A20BD_1_105_c.jpeg') center/cover;",
          )

          css_anchor = ".territoryCta{min-width:180px;padding:14px 18px;border-radius:999px;background:linear-gradient(135deg,#fff1bd,#f6c453,#22c55e);color:#06140f;text-align:center;font-size:13px;line-height:1.18;font-weight:1000;box-shadow:0 14px 34px rgba(0,0,0,.28)}\n"
          css_add = css_anchor + ".territoryChoices{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:11px}\n.territoryChoice{min-height:126px;padding:16px;border-radius:21px;border:1px solid rgba(255,241,189,.5);display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;background:linear-gradient(145deg,rgba(255,255,255,.1),rgba(255,255,255,.035));box-shadow:0 12px 30px rgba(0,0,0,.2);transition:transform .16s ease,border-color .16s ease,background .16s ease}\n.territoryChoice:hover{transform:translateY(-2px);border-color:#fff1bd;background:linear-gradient(145deg,rgba(246,196,83,.18),rgba(34,197,94,.09))}\n.territoryChoiceIcon{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;background:rgba(246,196,83,.15);border:1px solid rgba(246,196,83,.45);font-size:26px}\n.territoryChoice strong{display:block;color:#fff;font-size:17px;line-height:1.05;font-weight:1000}\n.territoryChoice small{display:block;margin-top:5px;color:var(--soft);font-size:11px;line-height:1.35;font-weight:850}\n.territoryChoice b{display:block;margin-top:7px;color:#fff3cf;font-size:10px;line-height:1.25;font-weight:1000;text-transform:uppercase;letter-spacing:.05em}\n"
          if '.territoryChoices{' not in html:
              if css_anchor not in html:
                  raise SystemExit('Ancre CSS SARLAT introuvable')
              html = html.replace(css_anchor, css_add, 1)

          old_media = "@media(max-width:720px){.territoriesHead{display:block}.territoriesHead p{margin-top:7px;text-align:left}.territoryDoor{grid-template-columns:72px 1fr;min-height:220px;padding:16px 14px}.territorySeal{width:72px;height:72px;border-radius:23px;font-size:34px}.territoryCta{grid-column:1/-1;width:100%}.territoryCopy strong{font-size:34px}}"
          new_media = "@media(max-width:720px){.territoriesHead{display:block}.territoriesHead p{margin-top:7px;text-align:left}.territoryDoor{grid-template-columns:72px 1fr;min-height:220px;padding:16px 14px}.territorySeal{width:72px;height:72px;border-radius:23px;font-size:34px}.territoryCta{grid-column:1/-1;width:100%}.territoryCopy strong{font-size:34px}.territoryChoices{grid-template-columns:1fr}.territoryChoice{min-height:112px}}"
          if old_media not in html:
              raise SystemExit('Media query SARLAT introuvable')
          html = html.replace(old_media, new_media, 1)

          old_block = '''<section aria-label="Territoires DIGIYLYFE" class="territories" id="territoires">
  <div class="territoriesHead"><h2 data-i18n="territoryTitle">Les territoires s’ouvrent</h2><p data-i18n="territoryLead">Une ville, ses adresses réelles, un accès direct au terrain.</p></div>
  <a aria-label="Ouvrir la page SARLAT DIGIYLYFE" class="territoryDoor" data-hub-allow="fullscreen" href="./sarlat.html">
    <span aria-hidden="true" class="territorySeal">🏰</span>
    <span class="territoryCopy"><small data-i18n="sarlatTag">FRANCE · PÉRIGORD NOIR</small><strong>SARLAT</strong><span data-i18n="sarlatText">L’Entre 2 & Le Malraux · restaurants · cartes · photos · réservation directe</span><b data-i18n="sarlatProof">Première porte territoriale DIGIYLYFE</b></span>
    <span class="territoryCta" data-i18n="sarlatCta">Entrer dans Sarlat →</span>
  </a>
</section>'''

          new_block = '''<section aria-label="Territoires DIGIYLYFE" class="territories" id="territoires">
  <div class="territoriesHead"><h2 data-i18n="territoryTitle">Les territoires s’ouvrent</h2><p data-i18n="territoryLead">Une ville, ses adresses réelles, un accès direct au terrain.</p></div>
  <a aria-label="Ouvrir la page territoriale SARLAT DIGIYLYFE" class="territoryDoor" data-hub-allow="fullscreen" href="./sarlat.html">
    <span aria-hidden="true" class="territorySeal">🏰</span>
    <span class="territoryCopy"><small data-i18n="sarlatTag">FRANCE · PÉRIGORD NOIR</small><strong>SARLAT</strong><span data-i18n="sarlatText">Deux portes locales : manger à Sarlat et dormir à Sarlat, avec contact direct.</span><b data-i18n="sarlatProof">Première porte territoriale DIGIYLYFE</b></span>
    <span class="territoryCta" data-i18n="sarlatCta">Voir toute la vitrine →</span>
  </a>
  <div class="territoryChoices" aria-label="Les deux portes de SARLAT">
    <a class="territoryChoice" data-hub-allow="fullscreen" href="./sarlat.html#manger">
      <span aria-hidden="true" class="territoryChoiceIcon">🍽️</span>
      <span><strong data-i18n="sarlatFoodTitle">MANGER À SARLAT</strong><small data-i18n="sarlatFoodText">L’Entre 2 & Le Malraux · cartes, photos et contact direct.</small><b data-i18n="sarlatFoodCta">Ouvrir la porte restaurants →</b></span>
    </a>
    <a class="territoryChoice" data-hub-allow="fullscreen" href="./sarlat.html#dormir">
      <span aria-hidden="true" class="territoryChoiceIcon">🛏️</span>
      <span><strong data-i18n="sarlatStayTitle">DORMIR À SARLAT</strong><small data-i18n="sarlatStayText">SARLAT CHEZ BAPTISTE · chambre privée et demande directe.</small><b data-i18n="sarlatStayCta">Ouvrir la porte hébergement →</b></span>
    </a>
  </div>
</section>'''
          if old_block not in html:
              raise SystemExit('Bloc territorial SARLAT introuvable')
          html = html.replace(old_block, new_block, 1)

          old_fr = "territoryTitle:'Les territoires s’ouvrent',territoryLead:'Une ville, ses adresses réelles, un accès direct au terrain.',sarlatTag:'FRANCE · PÉRIGORD NOIR',sarlatText:'L’Entre 2 & Le Malraux · restaurants · cartes · photos · réservation directe',sarlatProof:'Première porte territoriale DIGIYLYFE',sarlatCta:'Entrer dans Sarlat →',menuSarlat:'SARLAT · France',"
          new_fr = "territoryTitle:'Les territoires s’ouvrent',territoryLead:'Une ville, ses adresses réelles, un accès direct au terrain.',sarlatTag:'FRANCE · PÉRIGORD NOIR',sarlatText:'Deux portes locales : manger à Sarlat et dormir à Sarlat, avec contact direct.',sarlatProof:'Première porte territoriale DIGIYLYFE',sarlatCta:'Voir toute la vitrine →',sarlatFoodTitle:'MANGER À SARLAT',sarlatFoodText:'L’Entre 2 & Le Malraux · cartes, photos et contact direct.',sarlatFoodCta:'Ouvrir la porte restaurants →',sarlatStayTitle:'DORMIR À SARLAT',sarlatStayText:'SARLAT CHEZ BAPTISTE · chambre privée et demande directe.',sarlatStayCta:'Ouvrir la porte hébergement →',menuSarlat:'SARLAT · France',"
          if old_fr not in html:
              raise SystemExit('Traduction française SARLAT introuvable')
          html = html.replace(old_fr, new_fr, 1)

          old_en = "territoryTitle:'Territories are opening',territoryLead:'One town, its real addresses and direct access to the field.',sarlatTag:'FRANCE · BLACK PÉRIGORD',sarlatText:'L’Entre 2 & Le Malraux · restaurants · menus · photos · direct booking',sarlatProof:'First DIGIYLYFE territorial doorway',sarlatCta:'Enter Sarlat →',menuSarlat:'SARLAT · France',"
          new_en = "territoryTitle:'Territories are opening',territoryLead:'One town, its real addresses and direct access to the field.',sarlatTag:'FRANCE · BLACK PÉRIGORD',sarlatText:'Two local doors: eat in Sarlat and stay in Sarlat, with direct contact.',sarlatProof:'First DIGIYLYFE territorial doorway',sarlatCta:'View the full showcase →',sarlatFoodTitle:'EAT IN SARLAT',sarlatFoodText:'L’Entre 2 & Le Malraux · menus, photos and direct contact.',sarlatFoodCta:'Open the restaurant door →',sarlatStayTitle:'STAY IN SARLAT',sarlatStayText:'SARLAT CHEZ BAPTISTE · private room and direct request.',sarlatStayCta:'Open the accommodation door →',menuSarlat:'SARLAT · France',"
          if old_en not in html:
              raise SystemExit('Traduction anglaise SARLAT introuvable')
          html = html.replace(old_en, new_en, 1)

          checks = {
              'vrai HUB': '<title>DIGIYLYFE — HUB' in html and 'HUB DIGIYLYFE' in html,
              'deux portes': 'MANGER À SARLAT' in html and 'DORMIR À SARLAT' in html,
              'ancres': './sarlat.html#manger' in html and './sarlat.html#dormir' in html,
              'chez baptiste': 'SARLAT CHEZ BAPTISTE' in html,
              'pas fiche logement': '<title>SARLAT CHEZ BAPTISTE' not in html,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('Contrôles échoués : ' + ', '.join(failed))

          path.write_text(html, encoding='utf-8')
          PY

      - name: Commit restored HUB
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/restore-hub-sarlat.yml
          git add index.html .github/workflows/restore-hub-sarlat.yml
          git commit -m "Restore DIGIYLYFE homepage with two Sarlat doors"
          git push
