name: Dordogne and announcements alignment

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align announcements and Dordogne projection
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          changed=[]

          # 1) Runtime public: ANNONCES en premier, même ordre que le MASTER CORE.
          p=Path('assets/digiy-core-runtime-v1.json')
          s=p.read_text(encoding='utf-8')
          old='''  "needs": [\n    {"id": "transport", "icon": "🚗", "status": "core"},\n    {"id": "artisan", "icon": "🔧", "status": "core"},\n    {"id": "accommodation", "icon": "🏠", "status": "core"},\n    {"id": "food", "icon": "🍽️", "status": "core"},\n    {"id": "shopping", "icon": "🛍️", "status": "core"},\n    {"id": "beauty", "icon": "💅", "status": "core"},\n    {"id": "jobs", "icon": "💼", "status": "core"},\n    {"id": "announcements", "icon": "⚡", "status": "core"},\n    {"id": "guidance", "icon": "🎙️", "status": "core"}\n  ],'''
          new='''  "needs": [\n    {"id": "announcements", "icon": "⚡", "status": "core"},\n    {"id": "transport", "icon": "🚗", "status": "core"},\n    {"id": "artisan", "icon": "🔧", "status": "core"},\n    {"id": "accommodation", "icon": "🏠", "status": "core"},\n    {"id": "food", "icon": "🍽️", "status": "core"},\n    {"id": "shopping", "icon": "🛍️", "status": "core"},\n    {"id": "beauty", "icon": "💅", "status": "core"},\n    {"id": "jobs", "icon": "💼", "status": "core"},\n    {"id": "guidance", "icon": "🎙️", "status": "core"}\n  ],'''
          if old in s:
              s=s.replace(old,new,1); p.write_text(s,encoding='utf-8'); changed.append(str(p))
          elif '"needs": [\n    {"id": "announcements"' not in s:
              raise SystemExit('STOP: ordre runtime inattendu')

          # 2) Projection Dordogne: annonces en premier + territoire, pas Sarlat seul.
          p=Path('assets/digiy-territoire-dordogne-projection-v1.js')
          s=p.read_text(encoding='utf-8')
          reps={
            "var ORDER=['transport','artisan','accommodation','food','shopping','beauty','jobs','announcements','guidance'];":"var ORDER=['announcements','transport','artisan','accommodation','food','shopping','beauty','jobs','guidance'];",
            "PROJECTION SARLAT · 27 EXEMPLES · LE VIDE NE S’AFFICHE PAS, IL SE PROJETTE":"VALLÉE DE LA DORDOGNE · 27 EXEMPLES · LE VIDE NE S’AFFICHE PAS, IL SE PROJETTE",
            "📍 Sarlat-la-Canéda · Périgord Noir\\n🪪 Démonstration · pas encore un adhérent":"📍 Vallée de la Dordogne · Périgord\\n🪪 Démonstration · pas encore un adhérent",
            "🚗 Chauffeur gare / Sarlat":"🚗 Chauffeur gare / Vallée de la Dordogne",
            "Séjour Sarlat":"Séjour Dordogne",
            "« Où manger ce soir à Sarlat ? »":"« Où manger ce soir dans la Vallée ? »",
            "« Je cherche une chambre à Sarlat »":"« Je cherche une chambre en Dordogne »",
            "« Je cherche un plombier à Sarlat »":"« Je cherche un artisan dans le secteur »"
          }
          before=s
          for a,b in reps.items(): s=s.replace(a,b)
          if s!=before:
              p.write_text(s,encoding='utf-8'); changed.append(str(p))

          # 3) Porte France: Sarlat reste pilote, la Vallée entière est à prendre.
          p=Path('france.html')
          s=p.read_text(encoding='utf-8')
          reps={
            'FR-DORDOGNE · ACTIF · SAISONNIER':'FR-DORDOGNE · PLACE À PRENDRE · SAISONNIER',
            'Le territoire saisonnier de référence en France.':'Le territoire saisonnier de référence en France. Sarlat est la zone pilote ; les places se projettent sur toute la Vallée de la Dordogne.',
            '<div class="zones"><span class="zone">📍 Sarlat-la-Canéda</span></div>':'<div class="zones"><span class="zone">📍 Sarlat-la-Canéda · zone pilote</span><span class="zone">🌍 Vallée de la Dordogne · places à prendre</span></div>'
          }
          before=s
          for a,b in reps.items(): s=s.replace(a,b)
          if s!=before:
              p.write_text(s,encoding='utf-8'); changed.append(str(p))

          # 4) Démo Dordogne: identité territoriale, Sarlat seulement comme pilote.
          p=Path('demo-dordogne.html')
          s=p.read_text(encoding='utf-8')
          reps={
            '<title>DIGIY SARLAT — Modèle de présence</title>':'<title>DIGIY VALLÉE DE LA DORDOGNE — Modèle de présence</title>',
            '<a class="back" id="back" href="/sarlat.html">← DIGIY SARLAT</a>':'<a class="back" id="back" href="/territoire.html?zone=vallee-dordogne">← VALLÉE DE LA DORDOGNE</a>',
            '<h1 id="title">Modèle DIGIY SARLAT</h1>':'<h1 id="title">Modèle DIGIY VALLÉE DE LA DORDOGNE</h1>',
            '<div class="zone">📍 Sarlat-la-Canéda · Périgord Noir</div>':'<div class="zone">📍 Vallée de la Dordogne · Sarlat = zone pilote</div>',
            'href="/sarlat.html" id="return"':'href="/territoire.html?zone=vallee-dordogne" id="return"',
            '<a class="btn secondary" href="/sarlat.html">RETOUR À DIGIY SARLAT →</a>':'<a class="btn secondary" href="/territoire.html?zone=vallee-dordogne">RETOUR À LA VALLÉE DE LA DORDOGNE →</a>',
            "'← DIGIY SARLAT'":"'← VALLÉE DE LA DORDOGNE'",
            "'← DIGIY SARLAT']":"'← DORDOGNE VALLEY']",
            "🚗 Chauffeur gare / Sarlat":"🚗 Chauffeur gare / Vallée de la Dordogne",
            "Séjour Sarlat":"Séjour Dordogne",
            "« Où manger ce soir à Sarlat ? »":"« Où manger ce soir dans la Vallée ? »",
            "« Je cherche une chambre à Sarlat »":"« Je cherche une chambre en Dordogne »",
            "« Je cherche un plombier à Sarlat »":"« Je cherche un artisan dans le secteur »"
          }
          before=s
          for a,b in reps.items(): s=s.replace(a,b)
          if s!=before:
              p.write_text(s,encoding='utf-8'); changed.append(str(p))

          if not changed:
              print('Already aligned; nothing to do.')
              raise SystemExit(0)
          print('Changed:', *changed, sep='\n- ')
          PY

          if git diff --quiet -- assets/digiy-core-runtime-v1.json assets/digiy-territoire-dordogne-projection-v1.js france.html demo-dordogne.html; then
            echo "Nothing changed"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/digiy-core-runtime-v1.json assets/digiy-territoire-dordogne-projection-v1.js france.html demo-dordogne.html
          git commit -m "Territoires: remonter annonces et élargir projection Dordogne"
          git push origin HEAD:main
