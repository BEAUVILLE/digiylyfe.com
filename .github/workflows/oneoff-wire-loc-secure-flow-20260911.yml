name: One-off wire secure LOC BAT flow

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oneoff-wire-loc-secure-flow-20260911.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire LOC public flow, legacy routes and BAT workshop routing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('tarifs-loc.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="/assets/digiy-loc-secure-flow-20260911.js?v=20260911-bat-v1"></script>'
          if tag not in s:
              if '</body>' not in s: raise SystemExit('tarifs-loc body marker missing')
              s=s.replace('</body>',tag+'\n</body>',1)
          p.write_text(s,encoding='utf-8')

          p=Path('preparer-ma-carte.html')
          s=p.read_text(encoding='utf-8')
          needle="const q=new URLSearchParams(location.search);\n"
          guard=(
              "const q=new URLSearchParams(location.search);\n"
              "const locNeed=(q.get('need')||'').toLowerCase(),locModule=(q.get('module')||'').toLowerCase(),locProduct=(q.get('product')||'').toLowerCase();\n"
              "if(locNeed==='accommodation'||locModule==='loc'||locProduct==='loc'){\n"
              "  const u=new URL('/tarifs-loc.html',location.origin),c=(q.get('country')||'').toLowerCase(),l=(q.get('lang')||'').slice(0,2).toLowerCase();\n"
              "  if(c==='fr'||c==='eu')u.searchParams.set('country','eu');else if(c==='sn')u.searchParams.set('country','sn');\n"
              "  if(l)u.searchParams.set('lang',l);\n"
              "  location.replace(u.pathname+u.search);\n"
              "  return;\n"
              "}\n"
          )
          if 'const locNeed=' not in s:
              if needle not in s: raise SystemExit('preparer-ma-carte LOC guard marker missing')
              s=s.replace(needle,guard,1)
          p.write_text(s,encoding='utf-8')

          for filename,country in [
              ('adhesion-petite-cote.html','sn'),
              ('adhesion-dakar.html','sn'),
              ('adhesion-dordogne.html','eu'),
              ('adhesion-bordeaux.html','eu'),
          ]:
              p=Path(filename)
              s=p.read_text(encoding='utf-8')
              marker='data-digiy-loc-route-guard'
              if marker not in s:
                  guard=(
                      '<script '+marker+'>\n'
                      '(function(){\n'
                      '  const q=new URLSearchParams(location.search);\n'
                      "  if((q.get('need')||'').toLowerCase()!=='accommodation')return;\n"
                      "  const u=new URL('/tarifs-loc.html',location.origin);\n"
                      "  u.searchParams.set('country','"+country+"');\n"
                      "  const l=(q.get('lang')||'').slice(0,2).toLowerCase();\n"
                      "  if(l)u.searchParams.set('lang',l);\n"
                      '  location.replace(u.pathname+u.search);\n'
                      '})();\n'
                      '</script>'
                  )
                  if '</head>' not in s: raise SystemExit(filename+' head marker missing')
                  s=s.replace('</head>',guard+'\n</head>',1)
              p.write_text(s,encoding='utf-8')

          p=Path('demo-petite-cote.html')
          s=p.read_text(encoding='utf-8')
          old="var j=new URL('/adhesion-petite-cote.html',location.origin);if(need!=='guidance')j.searchParams.set('need',need);j.searchParams.set('local',zone);j.searchParams.set('lang',l);"
          new="var j=new URL(need==='accommodation'?'/tarifs-loc.html':'/adhesion-petite-cote.html',location.origin);if(need==='accommodation')j.searchParams.set('country','sn');else if(need!=='guidance')j.searchParams.set('need',need);j.searchParams.set('local',zone);j.searchParams.set('lang',l);"
          if old in s:
              s=s.replace(old,new,1)
          elif "need==='accommodation'?'/tarifs-loc.html':'/adhesion-petite-cote.html'" not in s:
              raise SystemExit('demo-petite-cote LOC route marker missing')
          p.write_text(s,encoding='utf-8')

          p=Path('demo-dordogne.html')
          s=p.read_text(encoding='utf-8')
          old="var join=new URL('/adhesion-dordogne.html',location.origin);if(need!=='guidance')join.searchParams.set('need',need);join.searchParams.set('local','sarlat');document.getElementById('join').href=join.pathname+join.search;"
          new="var join=new URL(need==='accommodation'?'/tarifs-loc.html':'/adhesion-dordogne.html',location.origin);if(need==='accommodation')join.searchParams.set('country','eu');else if(need!=='guidance')join.searchParams.set('need',need);join.searchParams.set('local','sarlat');join.searchParams.set('lang',(q.get('lang')||'fr').slice(0,2).toLowerCase());document.getElementById('join').href=join.pathname+join.search;"
          if old in s:
              s=s.replace(old,new,1)
          elif "need==='accommodation'?'/tarifs-loc.html':'/adhesion-dordogne.html'" not in s:
              raise SystemExit('demo-dordogne LOC route marker missing')
          p.write_text(s,encoding='utf-8')

          p=Path('masters/BAT-ATELIER-DIGIYLYFE-V1.html')
          s=p.read_text(encoding='utf-8')
          old="async function call(action,payload={}){const s=await session();if(!s)throw Error('Session atelier absente.');const r=await fetch(U+'/functions/v1/digiy-adhesion-inbox',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.access_token,'apikey':K},body:JSON.stringify({action,...payload})});const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok)throw Error(j.error||j.detail||'Erreur atelier');return j}"
          new="async function call(action,payload={}){const s=await session();if(!s)throw Error('Session atelier absente.');const d=payload&&payload.id?dossiers.find(x=>x.id===payload.id):null,endpoint=d&&/^loc-/.test(String(d.plan_code||''))?'digiy-loc-admin':'digiy-adhesion-inbox';const r=await fetch(U+'/functions/v1/'+endpoint,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.access_token,'apikey':K},body:JSON.stringify({action,...payload})});const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok)throw Error(j.error||j.detail||'Erreur atelier');return j}"
          if old not in s:
              if "endpoint=d&&/^loc-/" not in s: raise SystemExit('BAT call marker missing')
          else:
              s=s.replace(old,new,1)
          old2="window.confirmPayment=async(id,currency,amount)=>{if(!confirm('Confirmer le règlement exact de '+money(amount,currency)+' après BAT accepté ?'))return;try{await call('payment_confirm',{id,currency,amount,payment_method:'preuve client après BAT',note:'Règlement confirmé après BAT accepté'});await load()}catch(e){alert(e.message)}};"
          new2="window.confirmPayment=async(id,currency,amount)=>{if(!confirm('Confirmer le règlement exact de '+money(amount,currency)+' après BAT accepté ?'))return;try{const j=await call('payment_confirm',{id,currency,amount,payment_method:'preuve client après BAT',note:'Règlement confirmé après BAT accepté'});if(j.magic_link_sent===false)alert('Règlement LOC confirmé, mais le magic link n’a pas pu être envoyé automatiquement : '+(j.magic_link_error||'erreur email')+'. Le droit LOC reste actif et le lien pourra être renvoyé depuis PRO LOC.');await load()}catch(e){alert(e.message)}};"
          if old2 not in s:
              if 'j.magic_link_sent===false' not in s: raise SystemExit('BAT payment marker missing')
          else:
              s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          print('LOC tiered secure flow and legacy routes wired')
          PY
      - name: Commit LOC secure wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tarifs-loc.html preparer-ma-carte.html adhesion-petite-cote.html adhesion-dakar.html adhesion-dordogne.html adhesion-bordeaux.html demo-petite-cote.html demo-dordogne.html masters/BAT-ATELIER-DIGIYLYFE-V1.html
          git commit -m "fix: route every LOC entry to tiered annual flow [skip ci]"
          git push
