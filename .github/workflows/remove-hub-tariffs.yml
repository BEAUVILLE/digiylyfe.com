name: Retirer HUB des pages tarifs

on:
  push:
    paths:
      - '.github/workflows/remove-hub-tariffs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Retirer le lien HUB des tarifs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          files=['tarifs-adherents-1.html','tarifs-adherents.html']
          old='<a href="https://digiy-hub.digiylyfe.com/" id="hub"></a>'
          for name in files:
              p=Path(name)
              text=p.read_text(encoding='utf-8')
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'{name}: lien HUB attendu 1 fois, trouve {count}')
              text=text.replace(old,'')
              if 'href="https://digiy-hub.digiylyfe.com/"' in text:
                  raise SystemExit(f'{name}: acces HUB encore present')
              p.write_text(text,encoding='utf-8')
          PY

      - name: Controler et pousser
        shell: bash
        run: |
          git config user.name "DIGIYLYFE Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/remove-hub-tariffs.yml
          git add tarifs-adherents-1.html tarifs-adherents.html
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Retirer accès DIGIY HUB des pages tarifs"
          git push
