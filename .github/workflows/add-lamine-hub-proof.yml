name: Ajouter Lamine au HUB DRIVER

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-lamine-hub-proof.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Ajouter Lamine dans les preuves terrain
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: attendu 1 occurrence, trouvé {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '<meta content="index-hub-bonne-affaire-20260801" name="digiy-build"/>',
              '<meta content="index-hub-lamine-driver-20260803" name="digiy-build"/>',
              'build tag',
          )

          replace_once(
              '.proofGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}',
              '.proofGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}\n@media(max-width:820px){.proofGrid{grid-template-columns:repeat(2,1fr)}}',
              'grille preuves',
          )

          replace_once(
              '<div class="proofsHead"><h2 data-i18n="proofTitle">Le terrain est déjà visible</h2><p data-i18n="proofLead">Trois exemples réels. Un contact direct.</p></div>',
              '<div class="proofsHead"><h2 data-i18n="proofTitle">Le terrain est déjà visible</h2><p data-i18n="proofLead">Quatre exemples réels. Un contact direct.</p></div>',
              'titre preuves',
          )

          baptiste = '<a aria-label="Ouvrir la fiche Chez Baptiste" class="proofCard" data-hub-allow="fullscreen" href="https://part-chez-baptiste.digiylyfe.com/" rel="noopener noreferrer" target="_blank" title="S’ouvre séparément pour conserver le HUB DIGIYLYFE"><i>🏠</i><strong>Chez Baptiste</strong><small data-i18n="baptisteText">Hébergement · Saly · LOC</small><b data-i18n="seeCard">Voir la fiche →</b></a>'
          lamine = '<a aria-label="Ouvrir la fiche de Lamine — chauffeur privé Petite Côte" class="proofCard" data-hub-allow="fullscreen" href="https://partenaire-lamine.digiylyfe.com/" rel="noopener noreferrer" target="_blank" title="S’ouvre séparément pour conserver le HUB DIGIYLYFE"><i>🚗</i><strong>Lamine</strong><small data-i18n="lamineText">Chauffeur privé · Saly · AIBD · Petite Côte · DRIVER</small><b data-i18n="seeCard">Voir la fiche →</b></a>'
          replace_once(baptiste, baptiste + '\n' + lamine, 'carte Lamine')

          replace_once(
              "proofTitle:'Le terrain est déjà visible',proofLead:'Trois exemples réels. Un contact direct.',astouText:'Boutique locale · Saly · MARKET',babacarText:'Artisan · Saly · BUILD',baptisteText:'Hébergement · Saly · LOC',seeCard:'Voir la fiche →',",
              "proofTitle:'Le terrain est déjà visible',proofLead:'Quatre exemples réels. Un contact direct.',astouText:'Boutique locale · Saly · MARKET',babacarText:'Artisan · Saly · BUILD',baptisteText:'Hébergement · Saly · LOC',lamineText:'Chauffeur privé · Saly · AIBD · Petite Côte · DRIVER',seeCard:'Voir la fiche →',",
              'traduction française',
          )

          replace_once(
              "proofTitle:'The field is already visible',proofLead:'Three real examples. One direct contact.',astouText:'Local shop · Saly · MARKET',babacarText:'Tradesman · Saly · BUILD',baptisteText:'Accommodation · Saly · LOC',seeCard:'View profile →',",
              "proofTitle:'The field is already visible',proofLead:'Four real examples. One direct contact.',astouText:'Local shop · Saly · MARKET',babacarText:'Tradesman · Saly · BUILD',baptisteText:'Accommodation · Saly · LOC',lamineText:'Private driver · Saly · AIBD · Petite Côte · DRIVER',seeCard:'View profile →',",
              'traduction anglaise',
          )

          replace_once(
              '<a href="https://driver-client.digiylyfe.com/">🚗 DRIVER</a>',
              '<a href="https://driver-client.digiylyfe.com/">🚗 DRIVER</a>\n    <a href="https://partenaire-lamine.digiylyfe.com/">🚗 Lamine · DRIVER Petite Côte</a>',
              'accès sans JavaScript',
          )

          required = [
              'index-hub-lamine-driver-20260803',
              'https://partenaire-lamine.digiylyfe.com/',
              'data-i18n="lamineText"',
              "lamineText:'Chauffeur privé · Saly · AIBD · Petite Côte · DRIVER'",
              "lamineText:'Private driver · Saly · AIBD · Petite Côte · DRIVER'",
              'Quatre exemples réels. Un contact direct.',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit('Contrôle final échoué : ' + ' | '.join(missing))

          if text.count('https://partenaire-lamine.digiylyfe.com/') < 2:
              raise SystemExit('La fiche Lamine n’est pas assez reliée au HUB')

          path.write_text(text, encoding='utf-8')
          print('Lamine est maintenant relié au HUB DRIVER Petite Côte.')
          PY

      - name: Publier la correction et retirer l’outil temporaire
        run: |
          rm -f .github/workflows/add-lamine-hub-proof.yml
          git config user.name "DIGIYLYFE Build"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/add-lamine-hub-proof.yml
          git commit -m "HUB : faire remonter Lamine dans DRIVER Petite Côte"
          git push origin HEAD:main
