name: One-off Miami tariff tier fix
on:
  push:
    paths:
      - '.github/workflows/oneoff-miami-tariff-tiers-fix-20260911.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Miami pricing page
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tarifs-adherents-1.html')
          s=p.read_text()
          reps={
            '<div class="siteLevels">':'<div class="siteLevels" data-digiy-site-tiers="native">',
            "US:{sheet:'INCLUDED WITH DIGIY PRO',pro:'$29 / MONTH',proExtra:'OR $290 / YEAR',premium:'ON REQUEST',extra:'ON REQUEST'}":"US:{sheet:'INCLUDED WITH DIGIY PRO',pro:'$29 / MONTH',proExtra:'OR $290 / YEAR',premium:'$790+',extra:'$1,490+'}",
            'https://digiylyfe.com/digiy-contact-global.js?v=20260911-payment-visible-v3':'https://digiylyfe.com/digiy-contact-global.js?v=20260911-miami-v2'
          }
          for old,new in reps.items():
            if old not in s:
              raise SystemExit(f'missing expected pattern: {old[:80]}')
            s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git diff --check
          git diff -- tarifs-adherents-1.html
      - name: Commit correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tarifs-adherents-1.html
          git commit -m 'fix(miami): publish Premium and Extra prices without duplicate tiers [skip ci]'
          git push
