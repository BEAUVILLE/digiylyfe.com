name: Sort CAMPUS register A-Z

on:
  push:
    paths:
      - '.github/workflows/campus-sort-az.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sort CAMPUS interests alphabetically
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('digiy-campus-prive.html')
          s=p.read_text(encoding='utf-8')
          old="    var filtered=!q?rows:rows.filter(function(r){return norm([r.first_name,r.age,r.city,r.profile_status,r.phone_whatsapp,r.source_lang,r.pipeline_status].join(' ')).indexOf(q)>=0});"
          new="    var filtered=(!q?rows.slice():rows.filter(function(r){return norm([r.first_name,r.age,r.city,r.profile_status,r.phone_whatsapp,r.source_lang,r.pipeline_status].join(' ')).indexOf(q)>=0})).sort(function(a,b){return String(a.first_name||'').localeCompare(String(b.first_name||''),'fr',{sensitivity:'base',ignorePunctuation:true})});"
          if old in s:
              s=s.replace(old,new,1)
          elif "localeCompare(String(b.first_name||'')" not in s:
              raise SystemExit('CAMPUS render target missing')
          s=s.replace('<h1>🎓 Liste CAMPUS — Intéressés</h1>','<h1>🎓 Liste CAMPUS — Intéressés · A → Z</h1>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit CAMPUS A-Z sort
        run: |
          if git diff --quiet -- digiy-campus-prive.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add digiy-campus-prive.html
          git commit -m 'Sort CAMPUS interests alphabetically A-Z'
          git push
