name: Master alignment Bordeaux France

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply guarded patch v2
        run: python tools/master-align-bordeaux-france-once.py
      - name: Validate Bordeaux projection syntax
        run: node --check assets/digiy-territoire-bordeaux-projection-v1.js
      - name: Commit alignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bordeaux.html index.html territoire.html
          git diff --cached --check
          git commit -m "Territoires: aligner Bordeaux et porte France sur le MASTER"
          git push origin HEAD:main
