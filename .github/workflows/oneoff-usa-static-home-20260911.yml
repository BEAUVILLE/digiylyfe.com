name: One-off native USA home coherence
on:
  push:
    paths:
      - '.github/workflows/oneoff-usa-static-home-20260911.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply native USA patch
        run: python .github/scripts/patch_usa_native_20260911.py
      - name: Commit patch
        run: |
          git config user.name 'DIGIY LYFE'
          git config user.email 'baptistejb24@gmail.com'
          git add index.html digiy-contact-global-core-20260824.js digiy-contact-global-stable-20260830.js digiy-contact-global.js
          git commit -m 'fix: make Miami and USA native in public home'
          git push origin HEAD:main
