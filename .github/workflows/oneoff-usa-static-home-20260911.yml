name: One-off native USA home coherence
on:
  push:
    paths:
      - '.github/workflows/oneoff-usa-static-home-20260911.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make Miami and USA native in home + core
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          s = index.read_text()

          def rep(text, old, new, label, count=None):
              c = text.count(old)
              if count is not None and c != count:
                  raise SystemExit(f'{label}: expected {count}, found {c}')
              if c == 0:
                  raise SystemExit(f'{label}: anchor not found')
              return text.replace(old, new)

          s = rep(
              s,
              '<p data-i18n="worldIntro">Choisissez d’abord votre territoire. DIGIYLYFE vous conduit ensuite vers le besoin, la zone locale et les professionnels réellement basés ou intervenant sur le terrain.</p>',
              '<p data-i18n="worldIntro">Cinq portes réelles montrent aujourd’hui l’ouverture de DIGIYLYFE : Sénégal · Petite Côte et Dakar ; France · Vallée de la Dordogne et Bordeaux ; États-Unis · Miami. Choisissez votre territoire, puis votre besoin et votre zone.</p>',
              'static world intro', 1
          )

          s = rep(
              s,
              '<p class="globalDirectionLead" data-i18n="globalLead">Sénégal et France déjà actifs. Le monde suit progressivement.</p>',
              '<p class="globalDirectionLead" data-i18n="globalLead">Sénégal et France actifs · Miami ouvre les États-Unis. Le monde suit progressivement.</p>',
              'static global lead', 1
          )

          global_leads = {
              'Sénégal et France déjà actifs. Le monde suit progressivement.':'Sénégal et France actifs · Miami ouvre les États-Unis. Le monde suit progressivement.',
              'Senegal and France are already active. The world follows progressively.':'Senegal and France are active · Miami opens the United States. The world follows progressively.',
              'Senegal y Francia ya están activos. El mundo sigue progresivamente.':'Senegal y Francia están activos · Miami abre Estados Unidos. El mundo sigue progresivamente.',
              'Senegal e França já estão ativos. O mundo segue progressivamente.':'Senegal e França estão ativos · Miami abre os Estados Unidos. O mundo segue progressivamente.',
              'Senegal e Francia sono già attivi. Il mondo segue progressivamente.':'Senegal e Francia sono attivi · Miami apre gli Stati Uniti. Il mondo segue progressivamente.',
              'Senegal und Frankreich sind bereits aktiv. Die Welt folgt schrittweise.':'Senegal und Frankreich sind aktiv · Miami öffnet die Vereinigten Staaten. Die Welt folgt schrittweise.',
              'Senegal en Frankrijk zijn al actief. De wereld volgt stap voor stap.':'Senegal en Frankrijk zijn actief · Miami opent de Verenigde Staten. De wereld volgt stap voor stap.',
              'السنغال وفرنسا نشطتان بالفعل. ويتوسع العالم تدريجيًا.':'السنغال وفرنسا نشطتان · ميامي تفتح الولايات المتحدة. ويتوسع العالم تدريجيًا.'
          }
          for old, new in global_leads.items():
              if old not in s:
                  raise SystemExit('missing globalLead translation: '+old)
              s = s.replace(old, new)

          if 'data-fav-id="territoire-miami"' not in s:
              anchor = '        <style id="franceVitrineCartoucheStyle">'
              if s.count(anchor) != 1:
                  raise SystemExit(f'Miami insertion anchor count={s.count(anchor)}')
              miami = '''        <a class="territoryCard" href="https://digiylyfe.com/miami.html?lang=fr" data-fav-id="territoire-miami">
          <span class="territoryCountry">🇺🇸 <b>ÉTATS-UNIS</b></span>
          <picture class="territoryPhoto">
            <img src="https://digiylyfe.net/wp-content/uploads/2026/09/ChatGPT-Image-11-sept.-2026-22_03_22.png" alt="Miami · Florida" loading="lazy" decoding="async"/>
          </picture>
          <strong>DIGIY MIAMI</strong>
          <small>Miami · Floride · territoire ouvert</small>
          <span class="territoryBtn">OUVRIR LE TERRITOIRE</span>
        </a>
'''
              s = s.replace(anchor, miami + anchor)

          s = rep(
              s,
              'https://digiylyfe.com/digiy-contact-global.js?v=20260911-usa-world-v3',
              'https://digiylyfe.com/digiy-contact-global.js?v=20260911-usa-native-v4',
              'home relay version', 1
          )
          index.write_text(s)

          core = Path('digiy-contact-global-core-20260824.js')
          c = core.read_text()
          intro_map = {
              'Deux portes réelles montrent l’ouverture de DIGIYLYFE : Sénégal · Petite Côte et France · Périgord · Vallée de la Dordogne. Choisissez votre territoire, puis votre besoin et votre zone.':'Cinq portes réelles montrent aujourd’hui l’ouverture de DIGIYLYFE : Sénégal · Petite Côte et Dakar ; France · Vallée de la Dordogne et Bordeaux ; États-Unis · Miami. Choisissez votre territoire, puis votre besoin et votre zone.',
              'Two real doors show DIGIYLYFE’s reach: Senegal · Petite Côte and France · Périgord · Dordogne Valley. Choose your territory, then your need and local area.':'Five real doors now show DIGIYLYFE’s reach: Senegal · Petite Côte and Dakar; France · Dordogne Valley and Bordeaux; United States · Miami. Choose your territory, then your need and local area.',
              'Dos puertas reales muestran la apertura de DIGIYLYFE: Senegal · Petite Côte y Francia · Périgord · Valle del Dordoña. Elija su territorio, después su necesidad y su zona.':'Cinco puertas reales muestran hoy la apertura de DIGIYLYFE: Senegal · Petite Côte y Dakar; Francia · Valle del Dordoña y Burdeos; Estados Unidos · Miami. Elija su territorio, después su necesidad y su zona.',
              'Duas portas reais mostram a abertura da DIGIYLYFE: Senegal · Petite Côte e França · Périgord · Vale da Dordogne. Escolha o território, depois a necessidade e a zona.':'Cinco portas reais mostram hoje a abertura da DIGIYLYFE: Senegal · Petite Côte e Dakar; França · Vale da Dordogne e Bordéus; Estados Unidos · Miami. Escolha o território, depois a necessidade e a zona.',
              'Due porte reali mostrano l’apertura di DIGIYLYFE: Senegal · Petite Côte e Francia · Périgord · Valle della Dordogna. Scegli il territorio, poi il bisogno e la zona.':'Cinque porte reali mostrano oggi l’apertura di DIGIYLYFE: Senegal · Petite Côte e Dakar; Francia · Valle della Dordogna e Bordeaux; Stati Uniti · Miami. Scegli il territorio, poi il bisogno e la zona.',
              'Zwei reale Türen zeigen die Öffnung von DIGIYLYFE: Senegal · Petite Côte und Frankreich · Périgord · Dordogne-Tal. Wählen Sie zuerst das Gebiet, dann Bedarf und Zone.':'Fünf reale Türen zeigen heute die Reichweite von DIGIYLYFE: Senegal · Petite Côte und Dakar; Frankreich · Dordogne-Tal und Bordeaux; Vereinigte Staaten · Miami. Wählen Sie Ihr Gebiet, dann Bedarf und Zone.',
              'Twee echte ingangen tonen de internationale opening van DIGIYLYFE: Senegal · Petite Côte en Frankrijk · Périgord · Dordognevallei. Kies uw gebied, daarna uw behoefte en zone.':'Vijf echte ingangen tonen vandaag de uitbreiding van DIGIYLYFE: Senegal · Petite Côte en Dakar; Frankrijk · Dordognevallei en Bordeaux; Verenigde Staten · Miami. Kies uw gebied, daarna uw behoefte en zone.',
              'بابان حقيقيان يبرزان انفتاح DIGIYLYFE: السنغال · Petite Côte وفرنسا · Périgord · وادي دوردوني. اختر الإقليم ثم حاجتك والمنطقة المحلية.':'تُظهر خمس بوابات حقيقية اليوم توسع DIGIYLYFE: السنغال · Petite Côte وداكار؛ فرنسا · وادي دوردوني وبوردو؛ الولايات المتحدة · ميامي. اختر الإقليم ثم حاجتك والمنطقة المحلية.'
          }
          for old, new in intro_map.items():
              if old not in c:
                  raise SystemExit('missing core intro: '+old)
              c = c.replace(old, new)
          core.write_text(c)

          stable = Path('digiy-contact-global-stable-20260830.js')
          st = stable.read_text()
          st = rep(st,
                   '/digiy-contact-global-core-20260824.js?v=20260911-hubfix',
                   '/digiy-contact-global-core-20260824.js?v=20260911-usa-native-v4',
                   'core cache bust', 1)
          stable.write_text(st)

          relay = Path('digiy-contact-global.js')
          r = relay.read_text()
          r = rep(r,
                  '/digiy-contact-global-stable-20260830.js?v=20260911-usa-world-v3',
                  '/digiy-contact-global-stable-20260830.js?v=20260911-usa-native-v4',
                  'stable cache bust', 1)
          relay.write_text(r)
          PY
          git config user.name 'DIGIY LYFE'
          git config user.email 'baptistejb24@gmail.com'
          git add index.html digiy-contact-global-core-20260824.js digiy-contact-global-stable-20260830.js digiy-contact-global.js
          git commit -m 'fix: make Miami and USA native in public home'
          git push origin HEAD:main
