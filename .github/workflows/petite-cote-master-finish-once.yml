name: Petite Cote master finish once
on:
  push:
    paths:
      - '.github/workflows/petite-cote-master-finish-once.yml'
permissions:
  contents: write
jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shared scripts
        run: |
          node --check assets/digiy-petite-cote-config-v1.js
          node --check assets/digiy-territoire-petite-cote-projection-v1.js
      - name: Patch Saly and cache versions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('saly.html')
          s=p.read_text()
          old='<div class="realGrid"><a class="real" href="https://part-chez-baptiste.digiylyfe.com/"><span>🏠</span><strong>Chez Baptiste</strong><small>Appartement · Saly · contact direct</small><b data-open>OUVRIR →</b></a><a class="real" href="https://babacar-plombier-pro.digiylyfe.com/"><span>🔧</span><strong>Babacar Plombier Pro</strong><small>Artisan · Saly / Petite Côte</small><b data-open>OUVRIR →</b></a><a class="real" href="https://bcheikh.digiylyfe.com/"><span>🛍️</span><strong>BCHEIKH</strong><small>Vêtements · Saly · contact direct</small><b data-open>OUVRIR →</b></a><a class="real" href="https://partenaire-lamine.digiylyfe.com/"><span>🚗</span><strong>Lamine Driver</strong><small>Chauffeur · AIBD / Saly / Mbour</small><b data-open>OUVRIR →</b></a></div>'
          new='<div class="realGrid" id="realGrid"><div class="real" style="grid-column:1/-1">Chargement des professionnels réels…</div></div>'
          if old not in s:
              raise SystemExit('hardcoded realGrid block not found')
          s=s.replace(old,new,1)
          s=s.replace('<h2 id="realTitle">Déjà présents à Saly</h2><p class="lead" id="realLead">Quatre vraies présences publiques pour montrer le terrain réel. Elles passent devant les exemples.</p>','<h2 id="realTitle">Professionnels actifs à Saly</h2><p class="lead" id="realLead">Les présences réelles viennent de Supabase et restent devant les exemples.</p>',1)
          s=s.replace('/assets/digiy-petite-cote-config-v1.js?v=20260826','/assets/digiy-petite-cote-config-v1.js?v=20260827-master-i18n-v2',1)
          p.write_text(s)

          p=Path('demo-petite-cote.html')
          s=p.read_text()
          if '/assets/digiy-petite-cote-config-v1.js?v=20260826' not in s:
              raise SystemExit('demo config version marker not found')
          s=s.replace('/assets/digiy-petite-cote-config-v1.js?v=20260826','/assets/digiy-petite-cote-config-v1.js?v=20260827-master-i18n-v2',1)
          p.write_text(s)

          p=Path('territoire.html')
          s=p.read_text()
          a='/assets/digiy-petite-cote-config-v1.js?v=20260826-annonces-hot-v1'
          b='/assets/digiy-petite-cote-config-v1.js?v=20260827-master-i18n-v2'
          c='/assets/digiy-territoire-petite-cote-projection-v1.js?v=20260826-annonces-hot-v2'
          d='/assets/digiy-territoire-petite-cote-projection-v1.js?v=20260827-master-i18n-v3'
          if a not in s or c not in s:
              raise SystemExit('territoire cache markers not found')
          s=s.replace(a,b,1).replace(c,d,1)
          p.write_text(s)
          PY
      - name: Guard doctrine
        run: |
          ! grep -q 'part-chez-baptiste.digiylyfe.com' saly.html
          ! grep -q 'partenaire-lamine.digiylyfe.com' saly.html
          grep -q 'Les présences réelles viennent de Supabase' saly.html
          grep -q '20260827-master-i18n-v2' saly.html
          grep -q '20260827-master-i18n-v2' demo-petite-cote.html
          grep -q '20260827-master-i18n-v3' territoire.html
      - name: Commit public finish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add saly.html demo-petite-cote.html territoire.html
          git commit -m 'Petite Côte: aligner vitrine sur le MAITRE'
          git push
