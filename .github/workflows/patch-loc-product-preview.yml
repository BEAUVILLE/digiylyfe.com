name: Patch LOC product preview

on: push

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'run LOC product preview patch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch LOC product preview
        run: python3 .github/scripts/patch-loc-product-preview.py
      - name: Verify and commit targeted change
        run: |
          git diff --check
          test "$(git diff --name-only)" = "tarifs-loc.html"
          git config user.name "DIGIY LYFE"
          git config user.email "baptistejb24@gmail.com"
          git add tarifs-loc.html
          git commit -m "loc: show member control preview before adhesion"
          git push
