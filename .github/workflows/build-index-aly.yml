name: Build full index with Aly Kane

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-index-aly.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate complete index file
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('index.html')
          output_path = Path('index-avec-aly-complet.html')
          source = source_path.read_text(encoding='utf-8')

          aly_css = r'''
/* ── Aly Kane · La Voix du Terrain ── */
.alyDoor{
  position:relative;z-index:1;overflow:hidden;margin-top:18px;padding:17px;border-radius:28px;
  border:2px solid rgba(246,196,83,.82);
  background:radial-gradient(440px 210px at 100% 0,rgba(246,196,83,.29),transparent 65%),linear-gradient(145deg,#143d2b,#061c14 72%);
  box-shadow:0 18px 46px rgba(0,0,0,.32);display:grid;grid-template-columns:86px minmax(0,1fr) auto;gap:15px;align-items:center;
  transition:transform .16s ease,border-color .16s ease
}
.alyDoor:hover{transform:translateY(-2px);border-color:#fff1bd}
.alyPortrait{width:86px;height:86px;border-radius:27px;display:grid;place-items:center;overflow:hidden;border:1px solid rgba(255,241,189,.78);background:linear-gradient(145deg,#fff1bd,#f6c453,#22c55e);color:#06140f;font-size:42px;box-shadow:0 14px 34px rgba(0,0,0,.30)}
.alyCopy{min-width:0}.alyTag{display:block;color:#fff3cf;font-size:10.5px;font-weight:1000;letter-spacing:.1em;text-transform:uppercase}
.alyCopy strong{display:block;margin-top:5px;font-size:clamp(24px,5vw,39px);line-height:.98;font-weight:1000;letter-spacing:-.04em}
.alyCopy p{margin:8px 0 0;color:rgba(255,250,240,.82);font-size:13px;line-height:1.4;font-weight:900}
.alyQuote{display:block;margin-top:7px;color:#bdf7d2;font-size:11px;line-height:1.3;font-weight:1000}
.alyCta{min-width:180px;min-height:54px;padding:10px 16px;border-radius:999px;display:flex;align-items:center;justify-content:center;text-align:center;background:linear-gradient(135deg,#fff1bd,#f6c453,#22c55e);color:#06140f;font-size:12.5px;line-height:1.18;font-weight:1000;box-shadow:0 14px 34px rgba(0,0,0,.28)}
@media(max-width:820px){.alyDoor{grid-template-columns:70px 1fr}.alyPortrait{width:70px;height:70px;border-radius:23px;font-size:34px}.alyCta{grid-column:1/-1;width:100%}}
@media(max-width:620px){.alyDoor{padding:14px 12px;border-radius:23px;gap:10px}.alyCopy p{font-size:12px}}
'''

          if '/* ── Aly Kane · La Voix du Terrain ── */' not in source:
              source = source.replace('</style>', aly_css + '\n</style>', 1)

          aly_card = r'''
<a aria-label="Découvrir Aly Kane — La Voix du Terrain" class="alyDoor" data-hub-allow="fullscreen" href="./clip-ali.html">
  <span aria-hidden="true" class="alyPortrait">🦅</span>
  <span class="alyCopy">
    <span class="alyTag" data-i18n="alyTag">NOUVELLE VOIX · GUIDE DES TERRITOIRES</span>
    <strong data-i18n="alyTitle">ALY KANE · LA VOIX DU TERRAIN</strong>
    <p data-i18n="alyText">Découvrez en images le HUB, Saly, Sarlat et les portes DIGIYLYFE, avec lecture audio.</p>
    <span class="alyQuote" data-i18n="alyQuote">« DIGIYLYFE ne collectionne pas les adresses. DIGIYLYFE ouvre les portes. »</span>
  </span>
  <span class="alyCta" data-i18n="alyCta">Voir et écouter Aly Kane →</span>
</a>'''

          hub_needle = '</div>\n<a aria-label="Ouvrir LA VOIX ACTION PRO'
          if 'class="alyDoor"' not in source:
              if hub_needle not in source:
                  raise SystemExit('Point d’insertion HUB introuvable')
              source = source.replace(hub_needle, '</div>\n' + aly_card + '\n<a aria-label="Ouvrir LA VOIX ACTION PRO', 1)

          fr_old = "brandTag:'La Voix du Business · La Voie du Terrain',"
          fr_new = "alyTag:'NOUVELLE VOIX · GUIDE DES TERRITOIRES',alyTitle:'ALY KANE · LA VOIX DU TERRAIN',alyText:'Découvrez en images le HUB, Saly, Sarlat et les portes DIGIYLYFE, avec lecture audio.',alyQuote:'« DIGIYLYFE ne collectionne pas les adresses. DIGIYLYFE ouvre les portes. »',alyCta:'Voir et écouter Aly Kane →',brandTag:'La Voix du Business · La Voie du Terrain',"
          if "alyTitle:'ALY KANE" not in source:
              source = source.replace(fr_old, fr_new, 1)

          en_old = "brandTag:'The Voice of Business · The Path of the Field',"
          en_new = "alyTag:'NEW VOICE · TERRITORY GUIDE',alyTitle:'ALY KANE · THE VOICE OF THE FIELD',alyText:'Discover the HUB, Saly, Sarlat and the DIGIYLYFE doorways through images and audio narration.',alyQuote:'“DIGIYLYFE does not collect addresses. DIGIYLYFE opens doors.”',alyCta:'Watch and listen to Aly Kane →',brandTag:'The Voice of Business · The Path of the Field',"
          if "alyTitle:'ALY KANE · THE VOICE" not in source:
              source = source.replace(en_old, en_new, 1)

          old_menu = '<a href="https://digiy-clip.digiylyfe.com/" rel="noopener noreferrer" target="_blank" title="S’ouvre séparément pour conserver le HUB DIGIYLYFE">🎬 <span data-i18n="menuClip">Clip terrain</span></a>'
          new_menu = '<a class="gold" data-hub-allow="fullscreen" href="./clip-ali.html">🦅 <span>Aly Kane · La Voix du Terrain</span></a>\n' + old_menu
          if 'Aly Kane · La Voix du Terrain</span></a>\n<a href="https://digiy-clip' not in source:
              source = source.replace(old_menu, new_menu, 1)

          old_nojs = '<a href="https://pro-action-digiy.digiylyfe.com/">🎙️ ACTION PRO</a>'
          new_nojs = '<a href="./clip-ali.html">🦅 Aly Kane · La Voix du Terrain</a>\n    ' + old_nojs
          if '<a href="./clip-ali.html">🦅 Aly Kane' not in source:
              source = source.replace(old_nojs, new_nojs, 1)

          source = source.replace('index-hub-production-saly-sarlat-links-fixed-20260725', 'index-hub-aly-kane-complet-20260725', 1)
          output_path.write_text(source, encoding='utf-8')
          print(f'{output_path}: {len(source.splitlines())} lignes, {output_path.stat().st_size} octets')
          PY

      - name: Commit generated file
        run: |
          git config user.name "DIGIYLYFE Builder"
          git config user.email "actions@users.noreply.github.com"
          git add index-avec-aly-complet.html
          if git diff --cached --quiet; then
            echo "Aucun changement"
          else
            git commit -m "Add complete DIGIYLYFE index with Aly Kane"
            git push
          fi

# Trigger 2: workflow already present on main
