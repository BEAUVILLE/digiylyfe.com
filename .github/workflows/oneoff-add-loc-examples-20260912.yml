name: Add LOC examples

on:
  push:
    paths:
      - '.github/workflows/oneoff-add-loc-examples-20260912.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply LOC example patch
        run: python3 .github/scripts/add_loc_examples_20260912.py
      - name: Commit changes
        run: |
          git config user.name 'DIGIY LYFE'
          git config user.email 'baptistejb24@gmail.com'
          git add miami.html paris.html
          git commit -m 'feat: show LOC tier examples in Miami and Paris'
          git push
