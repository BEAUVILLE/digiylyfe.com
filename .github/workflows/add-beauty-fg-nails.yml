name: Add Beauty and FG NAILS

on:
  push:
    paths:
      - '.github/workflows/add-beauty-fg-nails.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add Beauty category and FG NAILS
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('territoire.html')
          s = p.read_text(encoding='utf-8')

          # 1) New territorial door
          s = s.replace("['shopping','🛍️'],['jobs','💼']", "['shopping','🛍️'],['beauty','💅'],['jobs','💼']")

          # 2) 8-language labels
          repl = {
            "shopping:'Acheter local',jobs:": "shopping:'Acheter local',beauty:'Beauté & Bien-être',jobs:",
            "shopping:'Shop local',jobs:": "shopping:'Shop local',beauty:'Beauty & Wellness',jobs:",
            "shopping:'Comprar local',jobs:": "shopping:'Comprar local',beauty:'Belleza y bienestar',jobs:",
            "shopping:'Comprar local',jobs:": "shopping:'Comprar local',beauty:'Beleza e bem-estar',jobs:",
            "shopping:'Lokal einkaufen',jobs:": "shopping:'Lokal einkaufen',beauty:'Schönheit & Wellness',jobs:",
            "shopping:'Comprare locale',jobs:": "shopping:'Comprare locale',beauty:'Bellezza e benessere',jobs:",
            "shopping:'Lokaal kopen',jobs:": "shopping:'Lokaal kopen',beauty:'Schoonheid & welzijn',jobs:",
            "shopping:'الشراء محلياً',jobs:": "shopping:'الشراء محلياً',beauty:'الجمال والعافية',jobs:",
          }
          # PT shares the same source phrase as ES; handle by scoped exact language line below.
          for old, new in repl.items():
            if old in s:
              s = s.replace(old, new, 1)

          # Ensure Portuguese gets its own wording if the first Comprar local belonged to ES.
          marker = "pt:{tag:'Profissionais do território"
          i = s.find(marker)
          if i >= 0:
            j = s.find("},\nde:{", i)
            if j >= 0:
              block = s[i:j]
              block = block.replace("shopping:'Comprar local',jobs:", "shopping:'Comprar local',beauty:'Beleza e bem-estar',jobs:")
              s = s[:i] + block + s[j:]

          # 3) FG NAILS in local fallback, only once
          fg = "{id:'fg-nails',territoryId:'petite-cote',name:'FG NAILS',need:'beauty',mainZone:'saly',zones:['saly'],services:['Beauté','Onglerie','Soins','Bien-être'],url:'https://f-g-nails.digiylyfe.com/'},\n"
          if "id:'fg-nails'" not in s:
            anchor = "{id:'astou',territoryId:'petite-cote',name:'Astou Boutique',need:'shopping',mainZone:'saly',zones:['saly'],services:['Boutique','Articles maison'],url:'https://astou-boutique.digiylyfe.com/'},\n"
            s = s.replace(anchor, anchor + fg)

          # 4) Route beauty-related metiers to the Beauty & Wellness door
          old = "var m={chauffeur:'transport',plombier:'artisan',electricien:'artisan',macon:'artisan',solaire:'artisan',logement:'accommodation','market-produits':'shopping',restaurant:'food',restauration:'food',jobs:'jobs',annonces:'announcements'};"
          new = "var m={chauffeur:'transport',plombier:'artisan',electricien:'artisan',macon:'artisan',solaire:'artisan',logement:'accommodation','market-produits':'shopping',beaute:'beauty','soins-beaute':'beauty',onglerie:'beauty',coiffeur:'beauty',massage:'beauty',restaurant:'food',restauration:'food',jobs:'jobs',annonces:'announcements'};"
          s = s.replace(old, new)
          s = s.replace("shopping:'shopping',restauration:'food'", "shopping:'shopping',beaute:'beauty',beauty:'beauty',restauration:'food'")

          p.write_text(s, encoding='utf-8')
          PY

          git config user.name "DIGIYLYFE Bot"
          git config user.email "actions@users.noreply.github.com"
          git add territoire.html
          git rm .github/workflows/add-beauty-fg-nails.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Territoires: add Beauté & Bien-être with FG NAILS"
          git push origin HEAD:main
