name: Patch France vitrine cartouche

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-france-vitrine-cartouche.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-index:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch index France cartouche
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'id="franceVitrineCartouche"' in s:
              raise SystemExit('Cartouche France déjà présente sur la vitrine')

          css='''
    .franceVitrineCartouche{grid-column:1/-1;min-height:230px;padding:16px;border-radius:24px;border:1px solid rgba(94,234,212,.48);background:radial-gradient(420px 220px at 20% 20%,rgba(94,234,212,.10),transparent 68%),linear-gradient(145deg,rgba(5,40,29,.96),rgba(4,24,18,.98));display:grid;grid-template-columns:minmax(250px,.9fr) minmax(0,1.1fr);gap:16px;align-items:center;box-shadow:0 16px 38px rgba(0,0,0,.24)}
    .franceMiniMap{position:relative;min-height:205px;border:1px solid rgba(94,234,212,.22);border-radius:20px;background:rgba(255,255,255,.025);overflow:hidden}
    .franceMiniMap svg{width:100%;height:205px;display:block}.franceMiniOutline{fill:rgba(8,70,52,.48);stroke:rgba(94,234,212,.72);stroke-width:3}.franceMiniFuture{fill:#dbe5df;opacity:.55}.franceMiniActive .halo{fill:rgba(246,196,83,.16);stroke:rgba(246,196,83,.55);stroke-width:2}.franceMiniActive .pin{fill:#f6c453;stroke:#fff1bd;stroke-width:2}.franceMiniActive text{fill:#ffe897;font-size:15px;font-weight:1000;paint-order:stroke;stroke:#06140f;stroke-width:4px}
    .franceMiniInfo{display:flex;flex-direction:column;gap:8px}.franceMiniCountry{color:#fde68a;font-size:11px;font-weight:1000;letter-spacing:.08em}.franceMiniInfo strong{font-size:clamp(22px,4.5vw,33px);line-height:1.02;font-weight:1000}.franceMiniInfo small{color:var(--soft);font-size:12px;line-height:1.45;font-weight:850}.franceMiniCities{display:flex;flex-wrap:wrap;gap:7px;margin:3px 0 2px}.franceMiniCity{padding:7px 9px;border-radius:999px;border:1px solid rgba(94,234,212,.28);background:rgba(94,234,212,.07);font-size:10px;font-weight:950}.franceMiniOpen{min-height:48px;margin-top:5px;padding:11px 14px;border-radius:999px;display:flex;align-items:center;justify-content:center;text-align:center;background:linear-gradient(135deg,var(--gold-soft),var(--gold),var(--green));color:#06140f;font-size:11px;font-weight:1000}
    @media(max-width:760px){.franceVitrineCartouche{grid-template-columns:1fr}.franceMiniMap{min-height:190px}.franceMiniMap svg{height:190px}}
'''
          if '</style>' not in s:
              raise SystemExit('Style principal introuvable')
          s=s.replace('</style>',css+'\n  </style>',1)

          bordeaux='''        <a class="territoryCard" href="https://digiylyfe.com/france.html">
          <span class="territoryCountry">🇫🇷 <b data-i18n="franceCountry">FRANCE</b></span>
          <picture class="territoryPhoto territoryPhotoFrance">
  <source type="image/avif" srcset="/assets/territoires/bordeaux.avif"/>
  <source type="image/webp" srcset="/assets/territoires/bordeaux.webp"/>
  <img src="/assets/territoires/bordeaux.png" alt="Bordeaux · Place de la Bourse et miroir d’eau" loading="lazy" decoding="async"/>
</picture>
          <strong>DIGIY BORDEAUX</strong>
          <small>Bordeaux · Gironde · Nouvelle-Aquitaine</small>
          <span class="territoryBtn" data-i18n="openTerritory">OUVRIR LE TERRITOIRE</span>
        </a>'''
          if bordeaux not in s:
              raise SystemExit('Carte Bordeaux de la vitrine introuvable')

          cartouche='''

        <a class="franceVitrineCartouche" id="franceVitrineCartouche" href="https://digiylyfe.com/france.html" aria-label="Ouvrir la carte interactive des territoires DIGIYLYFE en France">
          <div class="franceMiniMap" aria-hidden="true">
            <svg viewBox="0 0 430 245">
              <path class="franceMiniOutline" d="M142 27 L229 18 L303 50 L349 105 L337 155 L370 192 L333 224 L265 237 L188 228 L124 205 L74 169 L65 119 L89 82 L72 52 L112 35 Z"/>
              <circle class="franceMiniFuture" cx="221" cy="49" r="4"/><circle class="franceMiniFuture" cx="214" cy="83" r="4"/><circle class="franceMiniFuture" cx="316" cy="91" r="4"/><circle class="franceMiniFuture" cx="111" cy="112" r="4"/><circle class="franceMiniFuture" cx="275" cy="145" r="4"/><circle class="franceMiniFuture" cx="315" cy="195" r="4"/><circle class="franceMiniFuture" cx="161" cy="199" r="4"/>
              <g class="franceMiniActive"><circle class="halo" cx="112" cy="165" r="16"/><circle class="pin" cx="112" cy="165" r="7"/><text x="126" y="169">Bordeaux</text></g>
              <g class="franceMiniActive"><circle class="halo" cx="176" cy="177" r="16"/><circle class="pin" cx="176" cy="177" r="7"/><text x="190" y="181">Sarlat</text></g>
            </svg>
          </div>
          <div class="franceMiniInfo">
            <span class="franceMiniCountry">🇫🇷 <b data-i18n="franceCountry">FRANCE</b> · CARTE TERRITORIALE</span>
            <strong data-i18n="franceTitle">DIGIY FRANCE</strong>
            <small data-i18n="franceZones">2 TERRITOIRES ACTIFS · Vallée de la Dordogne · Bordeaux</small>
            <div class="franceMiniCities"><span class="franceMiniCity">Bordeaux</span><span class="franceMiniCity">Vallée de la Dordogne</span><span class="franceMiniCity">Sarlat</span></div>
            <span class="franceMiniOpen" data-i18n="openFrance">OUVRIR LA FRANCE</span>
          </div>
        </a>'''
          s=s.replace(bordeaux,bordeaux+cartouche,1)
          s=s.replace('index-empreinte-numerique-tarif-unique-reseau-retire-fg-retire-pwa-v10-20260826','index-france-cartouche-v1-20260831',1)
          p.write_text(s,encoding='utf-8')
          PY
          grep -F 'id="franceVitrineCartouche"' index.html
          grep -F 'index-france-cartouche-v1-20260831' index.html

      - name: Commit vitrine
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/patch-france-vitrine-cartouche.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/patch-france-vitrine-cartouche.yml
          git commit -m "Vitrine: afficher la cartouche France interactive"
          git push
