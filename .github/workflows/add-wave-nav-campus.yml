name: Add Carnet Wave to Campus admin rail

on:
  push:
    paths:
      - '.github/workflows/add-wave-nav-campus.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Carnet Wave link
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('digiy-campus-prive.html')
          s=p.read_text(encoding='utf-8')
          if 'https://backoffice.digiylyfe.com/carnet-wave.html' not in s:
              needle='🏷️ BONNE AFFAIRE</a>'
              pos=s.find(needle)
              if pos < 0:
                  raise SystemExit('Navigation marker not found')
              pos += len(needle)
              link='<a class="btn gold" href="https://backoffice.digiylyfe.com/carnet-wave.html">💳 CARNET WAVE</a>'
              s=s[:pos]+link+s[pos:]
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit navigation
        run: |
          if git diff --quiet -- digiy-campus-prive.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add digiy-campus-prive.html
          git commit -m 'Add Carnet Wave to Campus navigation'
          git push
