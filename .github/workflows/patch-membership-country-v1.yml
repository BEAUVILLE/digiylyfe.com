name: Patch membership country pricing V1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-membership-country-v1.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch membership pages and country handoff
        shell: python
        run: |
          from pathlib import Path

          pages=[Path('tarifs-adherents-1.html'),Path('tarifs-adherents.html')]
          old='<script src="https://digiylyfe.com/digiy-contact-global.js?v=20260815"></script>\n</body></html>'
          new='<script src="https://digiylyfe.com/digiy-contact-global.js?v=20260815"></script>\n<script src="/assets/digiy-membership-country-v1.js?v=20260823"></script>\n</body></html>'
          for path in pages:
              text=path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Safety stop: expected global script anchor missing in {path}')
              text=text.replace(old,new,1)
              path.write_text(text,encoding='utf-8')

          # Keep the non-JS first paint of Adhérent 2 on the Senegal/default rail.
          path=Path('tarifs-adherents.html')
          text=path.read_text(encoding='utf-8')
          replacements={
            '<div class="price" id="memberPrice">28 000 FCFA · 75 €</div>':'<div class="price" id="memberPrice">28 000 FCFA</div>',
            '<div class="price" id="sheetPrice">SÉNÉGAL · À PARTIR DE 100 000 FCFA · EUROPE · À PARTIR DE 250 €</div>':'<div class="price" id="sheetPrice">À PARTIR DE 100 000 FCFA</div>',
            '<div class="price" id="sitePrice">SÉNÉGAL · À PARTIR DE 550 000 FCFA · EUROPE · À PARTIR DE 950 €</div>':'<div class="price" id="sitePrice">SITE PREMIUM · À PARTIR DE 250 000 FCFA · SITE EXTRA · À PARTIR DE 450 000 FCFA</div>',
            'RESTO · EXPLORE · RÉSEAU : tarif unique 28 000 FCFA / 75 € par mois. DIGIY LOC est le seul module dont le tarif évolue par paliers selon le nombre d’hébergements actifs.':'RESTO · EXPLORE · RÉSEAU : tarif unique 28 000 FCFA par mois. DIGIY LOC est le seul module dont le tarif évolue par paliers selon le nombre d’hébergements actifs.'
          }
          for before,after in replacements.items():
              if before not in text:
                  raise SystemExit('Safety stop: static Adhérent 2 pricing anchor missing')
              text=text.replace(before,after,1)
          path.write_text(text,encoding='utf-8')

          # The post-payment form must honor ?country=sn/fr coming from the tariff page.
          path=Path('preparer-ma-carte.html')
          text=path.read_text(encoding='utf-8')
          old_render="""function renderCountries(){
            const cur=$('#country').value;
            $('#country').innerHTML=`<option value="">${txt('select')}</option>`+countries().map(c=>`<option value="${c.id}">${label(c)}</option>`).join('');
            if(countries().some(c=>c.id===cur))$('#country').value=cur;
          }"""
          new_render="""function renderCountries(){
            const cur=$('#country').value,requested=(Q.get('country')||'').toUpperCase();
            $('#country').innerHTML=`<option value="">${txt('select')}</option>`+countries().map(c=>`<option value="${c.id}">${label(c)}</option>`).join('');
            if(countries().some(c=>c.id===cur))$('#country').value=cur;
            else if(countries().some(c=>c.id===requested))$('#country').value=requested;
          }"""
          if old_render not in text:
              raise SystemExit('Safety stop: renderCountries anchor missing')
          text=text.replace(old_render,new_render,1)

          old_change="$('#country').addEventListener('change',()=>{renderTerritories();renderLangs();refreshMeta()});"
          new_change="$('#country').addEventListener('change',()=>{const u=new URL(location.href);if($('#country').value)u.searchParams.set('country',$('#country').value.toLowerCase());history.replaceState(null,'',u);renderTerritories();renderLangs();refreshMeta()});"
          if old_change not in text:
              raise SystemExit('Safety stop: country change anchor missing')
          text=text.replace(old_change,new_change,1)
          path.write_text(text,encoding='utf-8')

          Path('.github/workflows/patch-membership-country-v1.yml').unlink()
      - name: Commit exact membership patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tarifs-adherents-1.html tarifs-adherents.html preparer-ma-carte.html .github/workflows/patch-membership-country-v1.yml
          git diff --cached --check
          git commit -m "fix(adhesion): une devise par pays et passage du pays au dossier"
          git push
