name: Activate vitrine top
on:
  push:
    paths:
      - '.github/workflows/activate-vitrine-top.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Activate top block
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='vitrine-top-favoris.js'
          if marker not in s:
              assert '</body>' in s
              s=s.replace('</body>', '  <script src="./assets/js/vitrine-top-favoris.js?v=20260812-vitrine-top-v1" defer></script>\n</body>', 1)
              p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'DIGIY LYFE'
          git config user.email 'baptistejb24@gmail.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Afficher les 3 favoris et la doctrine en tête de vitrine'
            git push
          fi
