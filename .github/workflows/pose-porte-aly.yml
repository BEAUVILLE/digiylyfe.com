name: Poser la porte Aly Kane

on:
  push:
    branches:
      - main
    paths:
      - '.github/trigger-porte-aly.txt'

permissions:
  contents: write

jobs:
  pose-porte:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer la vitrine
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Ajouter uniquement la porte Aly Kane
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          if 'class="alyDoor"' in text or 'href="./clip-ali.html"' in text:
              print('La porte Aly Kane est déjà présente.')
              raise SystemExit(0)

          text = text.replace(
              'index-hub-production-saly-sarlat-links-fixed-20260725',
              'index-hub-aly-kane-door-20260726',
              1,
          )

          css = r'''

/* Aly Kane · La Voix du Terrain — porte du clip */
.alyDoor{
  position:relative;z-index:1;margin-top:12px;padding:15px;border-radius:25px;
  border:2px solid rgba(45,212,191,.72);
  background:radial-gradient(480px 220px at 100% 0,rgba(246,196,83,.25),transparent 64%),linear-gradient(145deg,rgba(9,72,49,.98),rgba(4,25,18,.99));
  box-shadow:0 18px 46px rgba(0,0,0,.30);display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:14px;align-items:center;
  transition:transform .16s ease,border-color .16s ease
}
.alyDoor:hover{transform:translateY(-2px);border-color:#fff1bd}
.alyIcon{width:76px;height:76px;border-radius:24px;display:grid;place-items:center;border:1px solid rgba(255,241,189,.78);background:linear-gradient(145deg,#fff1bd,#f6c453,#22c55e);color:#06140f;font-size:36px;box-shadow:0 14px 34px rgba(0,0,0,.30)}
.alyCopy{min-width:0}.alyTag{display:block;color:#bdf7d2;font-size:10px;font-weight:1000;letter-spacing:.1em;text-transform:uppercase}
.alyCopy strong{display:block;margin-top:5px;font-size:clamp(22px,4.7vw,35px);line-height:.98;font-weight:1000;letter-spacing:-.035em}
.alyCopy p{margin:8px 0 0;color:rgba(255,250,240,.82);font-size:12.8px;line-height:1.4;font-weight:900}
.alyCta{min-width:178px;min-height:54px;padding:10px 16px;border-radius:999px;display:flex;align-items:center;justify-content:center;text-align:center;background:linear-gradient(135deg,#fff1bd,#f6c453,#22c55e);color:#06140f;font-size:12.5px;line-height:1.18;font-weight:1000;box-shadow:0 14px 34px rgba(0,0,0,.28)}
@media(max-width:820px){.alyDoor{grid-template-columns:66px 1fr}.alyIcon{width:66px;height:66px;border-radius:22px;font-size:32px}.alyCta{grid-column:1/-1;width:100%}}
@media(max-width:620px){.alyDoor{padding:13px 11px;border-radius:22px;gap:10px}.alyCopy p{font-size:11.8px}}
'''
          if '</style>' not in text:
              raise SystemExit('Balise </style> introuvable : index.html inchangé.')
          text = text.replace('</style>', css + '\n</style>', 1)

          card = r'''<a aria-label="Découvrir Aly Kane — La Voix du Terrain" class="alyDoor" data-hub-allow="fullscreen" href="./clip-ali.html">
<span aria-hidden="true" class="alyIcon">🦅</span>
<span class="alyCopy">
<span class="alyTag" data-i18n="alyTag">CLIP · RÉCIT DES TERRITOIRES</span>
<strong data-i18n="alyTitle">ALY KANE · LA VOIX DU TERRAIN</strong>
<p data-i18n="alyText">Découvrez DIGIYLYFE, Saly, Sarlat et les portes du terrain en images, avec lecture audio.</p>
</span>
<span class="alyCta" data-i18n="alyCta">Voir et écouter le clip →</span>
</a>'''

          anchor = '''<span class="voiceCta"><span data-i18n="voiceCta">Parler ou rechercher →</span><span class="sensitiveHint" data-i18n="voiceSeparate">Micro · ouverture séparée</span></span>
</a>
<a aria-label="Ouvrir les 50 invitations pilotes DIGIYLYFE — 30 jours offerts"'''
          replacement = '''<span class="voiceCta"><span data-i18n="voiceCta">Parler ou rechercher →</span><span class="sensitiveHint" data-i18n="voiceSeparate">Micro · ouverture séparée</span></span>
</a>
''' + card + '''
<a aria-label="Ouvrir les 50 invitations pilotes DIGIYLYFE — 30 jours offerts"'''
          if anchor not in text:
              raise SystemExit('Point d’insertion principal introuvable : index.html inchangé.')
          text = text.replace(anchor, replacement, 1)

          nojs = '    <a href="https://pro-action-digiy.digiylyfe.com/">🎙️ ACTION PRO</a>\n'
          if nojs not in text:
              raise SystemExit('Point noscript introuvable : index.html inchangé.')
          text = text.replace(nojs, nojs + '    <a href="./clip-ali.html">🦅 Aly Kane · La Voix du Terrain</a>\n', 1)

          menu = '<a href="https://digiy-clip.digiylyfe.com/" rel="noopener noreferrer" target="_blank" title="S’ouvre séparément pour conserver le HUB DIGIYLYFE">🎬 <span data-i18n="menuClip">Clip terrain</span></a>'
          if menu not in text:
              raise SystemExit('Lien Clip terrain introuvable : index.html inchangé.')
          text = text.replace(menu, '<a class="gold" data-hub-allow="fullscreen" href="./clip-ali.html">🦅 <span data-i18n="menuAly">Aly Kane · La Voix du Terrain</span></a>\n' + menu, 1)

          fr = "brandTag:'La Voix du Business · La Voie du Terrain',hubKicker:"
          if fr not in text:
              raise SystemExit('I18N français introuvable : index.html inchangé.')
          text = text.replace(fr, "alyTag:'CLIP · RÉCIT DES TERRITOIRES',alyTitle:'ALY KANE · LA VOIX DU TERRAIN',alyText:'Découvrez DIGIYLYFE, Saly, Sarlat et les portes du terrain en images, avec lecture audio.',alyCta:'Voir et écouter le clip →',brandTag:'La Voix du Business · La Voie du Terrain',hubKicker:", 1)
          text = text.replace("menuClip:'Clip terrain',", "menuAly:'Aly Kane · La Voix du Terrain',menuClip:'Clip terrain',", 1)

          en = "brandTag:'The Voice of Business · The Path of the Field',hubKicker:"
          if en not in text:
              raise SystemExit('I18N anglais introuvable : index.html inchangé.')
          text = text.replace(en, "alyTag:'CLIP · STORIES FROM THE TERRITORIES',alyTitle:'ALY KANE · THE VOICE OF THE FIELD',alyText:'Discover DIGIYLYFE, Saly, Sarlat and the field doorways through images and audio narration.',alyCta:'Watch and listen to the clip →',brandTag:'The Voice of Business · The Path of the Field',hubKicker:", 1)
          text = text.replace("menuClip:'Field video',", "menuAly:'Aly Kane · The Voice of the Field',menuClip:'Field video',", 1)

          if text.count('class="alyDoor"') != 1 or text.count('href="./clip-ali.html"') != 3 or not text.rstrip().endswith('</html>'):
              raise SystemExit('Contrôle final échoué : index.html inchangé.')

          path.write_text(text, encoding='utf-8')
          print('Porte Aly Kane posée. Lignes :', len(text.splitlines()))
          PY

      - name: Publier la vitrine
        shell: bash
        run: |
          git config user.name "DIGIYLYFE Builder"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Aucun changement à publier"
          else
            git commit -m "Ajouter la porte Aly Kane sur la vitrine"
            git push origin main
          fi
