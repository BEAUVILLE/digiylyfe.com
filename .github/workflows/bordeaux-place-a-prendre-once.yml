name: Bordeaux place a prendre once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add place available badges
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('bordeaux.html')
          s=p.read_text(encoding='utf-8')
          repl={
            "badge:'EXEMPLE · PAS ENCORE UN ADHÉRENT'":"badge:'EXEMPLE · PLACE À PRENDRE'",
            "badge:'EXAMPLE · NOT YET A MEMBER'":"badge:'EXAMPLE · PLACE AVAILABLE'",
            "badge:'EJEMPLO · TODAVÍA NO ES MIEMBRO'":"badge:'EJEMPLO · PLAZA DISPONIBLE'",
            "badge:'EXEMPLO · AINDA NÃO É MEMBRO'":"badge:'EXEMPLO · LUGAR DISPONÍVEL'",
            "badge:'ESEMPIO · NON ANCORA MEMBRO'":"badge:'ESEMPIO · POSTO DISPONIBILE'",
            "badge:'BEISPIEL · NOCH KEIN MITGLIED'":"badge:'BEISPIEL · PLATZ FREI'",
            "badge:'VOORBEELD · NOG GEEN LID'":"badge:'VOORBEELD · PLEK BESCHIKBAAR'",
            "badge:'مثال · ليس عضواً بعد'":"badge:'مثال · مكان متاح'"
          }
          changed=0
          for old,new in repl.items():
              if old in s:
                  s=s.replace(old,new,1); changed+=1
          if changed != 8:
              raise SystemExit(f'Expected 8 badge replacements, got {changed}; aborting')
          p.write_text(s,encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bordeaux.html
          git commit -m "Bordeaux: afficher place à prendre sur les exemples"
          git push origin HEAD:main
