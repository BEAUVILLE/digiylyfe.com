name: Corrections finales de cohérence
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/freeze-coherence-fixes-20260906.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corriger uniquement les défauts validés
        shell: python
        run: |
          from pathlib import Path

          # 1) Navigation globale : MARKET -> MON COMMERCE, destination active vérifiée.
          p = Path('digiy-navigation-globale.js')
          s = p.read_text()
          old = "    ['🛍️ MARKET','https://market.digiylyfe.com/'],"
          new = "    ['🛍️ MON COMMERCE','https://mon-commerce.digiylyfe.com/'],"
          if s.count(old) != 1:
              raise SystemExit('ancre MARKET navigation absente ou non unique')
          s = s.replace(old, new, 1)
          version_old = ' * Version: dgn-global-v1-20260722'
          version_new = ' * Version: dgn-global-v1-20260906-commerce'
          if s.count(version_old) != 1:
              raise SystemExit('marqueur version navigation inattendu')
          s = s.replace(version_old, version_new, 1)
          if 'market.digiylyfe.com' in s or '🛍️ MARKET' in s:
              raise SystemExit('relique MARKET encore présente dans la navigation')
          if 'https://mon-commerce.digiylyfe.com/' not in s:
              raise SystemExit('destination MON COMMERCE absente')
          p.write_text(s)

          # 2) robots.txt : retirer PAY/MARKET legacy et éviter les groupes spécifiques incomplets.
          p = Path('robots.txt')
          r = p.read_text()
          for obsolete in ['Allow: /market/\n', 'Allow: /pay/\n', 'Disallow: /pay-pro/\n', 'Disallow: /market-pro/\n']:
              if r.count(obsolete) != 1:
                  raise SystemExit(f'directive legacy absente ou non unique: {obsolete.strip()}')
              r = r.replace(obsolete, '', 1)
          start = "# ============================================================\n# CRAWLERS IA — RÈGLES SPÉCIFIQUES\n# Bienvenue sur la façade. Pas dans la maison.\n# ============================================================\n\n"
          end = "# ============================================================\n# SITEMAP\n# ============================================================\n"
          if start not in r or end not in r:
              raise SystemExit('bornes du bloc crawlers introuvables')
          a = r.index(start)
          b = r.index(end)
          replacement = "# ============================================================\n# CRAWLERS & MOTEURS — RÈGLE UNIQUE\n# Tous appliquent le groupe User-agent: * ci-dessus.\n# Façade publique ouverte ; espaces sensibles exclus.\n# ============================================================\n\n"
          r = r[:a] + replacement + r[b:]
          if r.count('User-agent:') != 1 or 'User-agent: *' not in r:
              raise SystemExit('robots.txt doit garder un groupe unique User-agent: *')
          for required in ['Disallow: /dashboard-pro.html', 'Disallow: /admin/', 'Disallow: /*?token=', 'Disallow: /*?session=', 'Disallow: /api/', 'Sitemap: https://digiylyfe.com/sitemap.xml']:
              if required not in r:
                  raise SystemExit(f'protection robots manquante: {required}')
          for legacy in ['/market/', '/pay/', '/market-pro/', '/pay-pro/']:
              if legacy in r:
                  raise SystemExit(f'relique robots legacy encore présente: {legacy}')
          p.write_text(r)

          # 3) Accueil : supprimer uniquement le cartouche qui répète mot pour mot le hero.
          p = Path('index.html')
          h = p.read_text()
          before_scripts = h.count('<script')
          block = (
              '      <div class="doctrine">\n'
              '        <strong data-i18n="doctrineTitle">Votre savoir-faire. Votre identité. Vos objectifs.</strong>\n'
              '        <span data-i18n="doctrineText">DIGIYLYFE vous offre ses ailes pour aller plus loin.</span>\n'
              '      </div>\n'
          )
          if h.count(block) != 1:
              raise SystemExit('cartouche doublon accueil absent ou non unique')
          h = h.replace(block, '', 1)
          old_build = '<meta name="digiy-build" content="index-public-campus-age-mon-digiy-v2-20260904"/>'
          new_build = '<meta name="digiy-build" content="index-public-freeze-coherence-v1-20260906"/>'
          if h.count(old_build) != 1:
              raise SystemExit('marqueur build accueil inattendu')
          h = h.replace(old_build, new_build, 1)
          if '<strong data-i18n="doctrineTitle">' in h:
              raise SystemExit('doublon visuel doctrine encore présent')
          if h.count('<script') != before_scripts:
              raise SystemExit('scripts accueil modifiés par erreur')
          p.write_text(h)

          # 4) Carte : harmoniser le titre social avec le title réel, sans toucher au fonctionnement.
          p = Path('carte.index.html')
          c = p.read_text()
          before_scripts = c.count('<script')
          replacements = {
              '<meta property="og:title" content="DIGIYLYFE — Votre écosystème digital local">': '<meta property="og:title" content="DIGIYLYFE — Carte de visite interactive">',
              '<meta name="twitter:title" content="DIGIYLYFE — Votre écosystème digital local">': '<meta name="twitter:title" content="DIGIYLYFE — Carte de visite interactive">',
          }
          for old, new in replacements.items():
              if c.count(old) != 1:
                  raise SystemExit(f'metadata carte inattendue: {old}')
              c = c.replace(old, new, 1)
          if c.count('<script') != before_scripts:
              raise SystemExit('scripts carte modifiés par erreur')
          if c.count('DIGIYLYFE — Carte de visite interactive') < 3:
              raise SystemExit('titres carte non harmonisés')
          p.write_text(c)

      - name: Vérifier le patch final
        shell: bash
        run: |
          grep -F "MON COMMERCE','https://mon-commerce.digiylyfe.com/" digiy-navigation-globale.js
          ! grep -F 'market.digiylyfe.com' digiy-navigation-globale.js
          grep -F 'User-agent: *' robots.txt
          test "$(grep -c '^User-agent:' robots.txt)" -eq 1
          ! grep -E '/(market|pay)(-pro)?/' robots.txt
          grep -F 'index-public-freeze-coherence-v1-20260906' index.html
          ! grep -F '<strong data-i18n="doctrineTitle">' index.html
          grep -F '<meta property="og:title" content="DIGIYLYFE — Carte de visite interactive">' carte.index.html
          grep -F '<meta name="twitter:title" content="DIGIYLYFE — Carte de visite interactive">' carte.index.html
      - name: Commit
        shell: bash
        run: |
          git config user.name 'DIGIY LYFE'
          git config user.email 'baptistejb24@gmail.com'
          git add digiy-navigation-globale.js robots.txt index.html carte.index.html
          git commit -m 'Corriger les derniers défauts de cohérence avant gel'
          git push
