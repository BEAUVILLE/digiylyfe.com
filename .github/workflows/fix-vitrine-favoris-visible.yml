name: Fix vitrine favoris visibles
on:
  push:
    paths:
      - '.github/workflows/fix-vitrine-favoris-visible.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retablir 3 favoris visibles
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1) Bloc favoris en dur dans l'index, avant la signature.
          p=Path('index.html')
          s=p.read_text()
          if 'id="digiyTopFavorites"' not in s:
              marker='    <div id="digiyTopDoctrine" class="digiyTopDoctrine"'
              assert marker in s, 'signature DIGIYLYFE introuvable'
              block='''    <section id="digiyTopFavorites" class="digiyTopFavorites" aria-label="Mes 3 favoris DIGIYLYFE" style="margin:0 0 10px;padding:12px;border:1px solid rgba(246,196,83,.48);border-radius:22px;background:linear-gradient(145deg,rgba(246,196,83,.11),rgba(34,197,94,.08));box-shadow:0 10px 28px rgba(0,0,0,.18)">\n      <div class="digiyTopFavoritesTitle" style="margin:0 0 8px;color:#fff3cf;font-size:12px;font-weight:1000;letter-spacing:.08em;text-align:center">⭐ MES FAVORIS · 3 MAX</div>\n      <div class="digiyTopFavoritesGrid" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">\n        <div class="digiyTopFavorite emptySlot" style="min-height:68px;padding:10px 9px;border:1px dashed rgba(246,196,83,.35);border-radius:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;text-align:center"><span class="ico">☆</span><b>Choisir un favori</b></div>\n        <div class="digiyTopFavorite emptySlot" style="min-height:68px;padding:10px 9px;border:1px dashed rgba(246,196,83,.35);border-radius:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;text-align:center"><span class="ico">☆</span><b>Choisir un favori</b></div>\n        <div class="digiyTopFavorite emptySlot" style="min-height:68px;padding:10px 9px;border:1px dashed rgba(246,196,83,.35);border-radius:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;text-align:center"><span class="ico">☆</span><b>Choisir un favori</b></div>\n      </div>\n    </section>\n\n'''
              s=s.replace(marker,block+marker,1)
          s=s.replace('v=20260812-vitrine-favoris-v3','v=20260812-vitrine-favoris-v4')
          p.write_text(s)

          # 2) Toujours rendre 3 emplacements : favoris choisis + cases libres.
          p=Path('assets/js/vitrine-top-favoris.js')
          s=p.read_text()
          anchor="  var MODULES=[];"
          if 'var EMPTY_SLOT=' not in s:
              slots="""  var EMPTY_SLOT={fr:'Choisir un favori',en:'Choose a favorite',es:'Elegir un favorito',pt:'Escolher um favorito',de:'Favorit wählen',it:'Scegli un preferito',nl:'Kies een favoriet',ar:'اختر مفضلة'};\n\n"""
              assert anchor in s
              s=s.replace(anchor,slots+anchor,1)

          old="""    if(!valid.length){grid.innerHTML='<div class=\"digiyTopFavoritesEmpty\" style=\"grid-column:1/-1\">'+c.empty+'</div>';}\n    else{\n      grid.innerHTML=valid.map(function(m){\n        var label=labelOf(m.card,m.key);\n        return '<a class=\"digiyTopFavorite'+(m.key==='voice'?' voiceFav':'')+'\" href=\"'+m.href+'\" target=\"_blank\" rel=\"noopener noreferrer\"><span class=\"ico\">'+m.icon+'</span><b>'+label+'</b></a>';\n      }).join('');\n    }"""
          new="""    var cells=valid.map(function(m){\n      var label=labelOf(m.card,m.key);\n      return '<a class=\"digiyTopFavorite'+(m.key==='voice'?' voiceFav':'')+'\" href=\"'+m.href+'\" target=\"_blank\" rel=\"noopener noreferrer\"><span class=\"ico\">'+m.icon+'</span><b>'+label+'</b></a>';\n    });\n    for(var i=valid.length;i<MAX;i++){\n      cells.push('<div class=\"digiyTopFavorite emptySlot\"><span class=\"ico\">☆</span><b>'+EMPTY_SLOT[lang()]+'</b></div>');\n    }\n    grid.innerHTML=cells.join('');"""
          assert old in s, 'bloc renderTop attendu introuvable'
          s=s.replace(old,new,1)
          s=s.replace(".digiyTopFavorite.voiceFav b{font-size:15px}",".digiyTopFavorite.voiceFav b{font-size:15px}.digiyTopFavorite.emptySlot{border-style:dashed;opacity:.74;background:rgba(255,255,255,.035)}")
          p.write_text(s)
          PY
      - name: Nettoyer et publier
        run: |
          rm -f .github/workflows/fix-vitrine-favoris-visible.yml
          git config user.name 'DIGIY LYFE'
          git config user.email 'baptistejb24@gmail.com'
          git add index.html assets/js/vitrine-top-favoris.js .github/workflows/fix-vitrine-favoris-visible.yml
          git commit -m 'Rétablir les 3 favoris visibles avec la signature'
          git push