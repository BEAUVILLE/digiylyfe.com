name: Final freeze subtraction

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/freeze-final-subtraction.yml

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply guarded subtraction
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')
          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          # 1) Sitemap: noindex/operator pages must not be advertised.
          p = Path('sitemap.xml')
          s = read(p)
          for target in ('menu.html', 'inscription.html', 'support-whatsapp.html'):
              lines = s.splitlines()
              hits = [line for line in lines if f'https://digiylyfe.com/{target}' in line]
              if len(hits) > 1:
                  raise SystemExit(f'{target}: expected at most 1 sitemap entry, found {len(hits)}')
              if hits:
                  lines = [line for line in lines if f'https://digiylyfe.com/{target}' not in line]
                  s = '\n'.join(lines) + ('\n' if s.endswith('\n') else '')
          for target in ('menu.html', 'inscription.html', 'support-whatsapp.html'):
              if f'https://digiylyfe.com/{target}' in s:
                  raise SystemExit(f'{target}: still present in sitemap')
          write(p, s)

          # 2) Operator support page: keep functionality, remove from indexing.
          p = Path('support-whatsapp.html')
          s = read(p)
          desired = '<meta name="robots" content="noindex,nofollow">'
          if desired not in s:
              marker = '<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">'
              if s.count(marker) != 1:
                  raise SystemExit(f'support viewport marker count={s.count(marker)}')
              s = s.replace(marker, marker + '\n' + desired, 1)
          if s.count(desired) != 1:
              raise SystemExit('support robots meta not unique')
          write(p, s)

          # 3) Old commercial pages: current adhesion page is the single tariff door.
          for name in ('qr-module-digiylyfe.html', 'ciblage-pros-digiylyfe.html'):
              p = Path(name)
              s = read(p)
              old = 'https://tarifs.digiylyfe.com/'
              new = 'https://digiylyfe.com/tarifs-adherents-1.html'
              count = s.count(old)
              if count > 1:
                  raise SystemExit(f'{name}: old tariff URL count={count}')
              if count == 1:
                  s = s.replace(old, new, 1)
              if old in s or new not in s:
                  raise SystemExit(f'{name}: tariff rail not aligned')
              write(p, s)
          PY

          rm -f .github/workflows/freeze-final-subtraction.yml
          git config user.name "DIGIY LYFE"
          git config user.email "baptistejb24@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Finaliser la soustraction avant freeze"
          git push
