name: One-off refresh payment section
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oneoff-bust-payment-section-cache-20260911.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh payment section script version
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tarifs-adherents-1.html')
          s=p.read_text(encoding='utf-8')
          old='digiy-contact-global.js?v=20260911-prevalidation-v2'
          new='digiy-contact-global.js?v=20260911-payment-visible-v3'
          if old not in s:
              raise SystemExit('marker missing')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
      - name: Commit refresh
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tarifs-adherents-1.html
          git commit -m "fix: keep payment section visible while locked [skip ci]"
          git push