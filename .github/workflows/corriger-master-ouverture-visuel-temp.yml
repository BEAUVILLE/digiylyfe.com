name: Corriger MASTER ouverture et visuel nettoyage

on:
  push:
    paths:
      - '.github/workflows/corriger-master-ouverture-visuel-temp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Corriger moteur et visuel
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('assets/digiy-public-module-master-v2.js')
          s=p.read_text(encoding='utf-8')
          repl={
            "view:'OUVRIR LA FICHE →'":"view:'OUVRIR →'",
            "view:'OPEN PROFILE →'":"view:'OPEN →'",
            "view:'ABRIR FICHA →'":"view:'ABRIR →'",
            "view:'PROFIL ÖFFNEN →'":"view:'ÖFFNEN →'",
            "view:'APRI SCHEDA →'":"view:'APRI →'",
            "view:'PROFIEL OPENEN →'":"view:'OPENEN →'",
            "view:'فتح البطاقة ←'":"view:'فتح ←'"
          }
          for a,b in repl.items():
              s=s.replace(a,b)
          p.write_text(s,encoding='utf-8')

          p=Path('assets/digiy-master-ui-v1.css')
          s=p.read_text(encoding='utf-8')
          marker='/* CLEANING VISUAL MASTER V2 */'
          if marker not in s:
              s += "\n"+marker+"\n" + "body[data-digiy-module=\"cleaning\"] .listing{display:grid!important;grid-template-columns:minmax(210px,38%) minmax(0,62%)!important;overflow:hidden!important;align-items:stretch!important}\nbody[data-digiy-module=\"cleaning\"] .visual{display:block!important;position:relative!important;min-height:340px!important;background:#0b3326!important;overflow:hidden!important}\nbody[data-digiy-module=\"cleaning\"] .visual img{display:block!important;width:100%!important;height:100%!important;min-height:340px!important;object-fit:cover!important;object-position:center!important}\nbody[data-digiy-module=\"cleaning\"] .info{padding:18px!important}\n@media(max-width:650px){body[data-digiy-module=\"cleaning\"] .listing{grid-template-columns:1fr!important}body[data-digiy-module=\"cleaning\"] .visual,body[data-digiy-module=\"cleaning\"] .visual img{min-height:250px!important;max-height:320px!important}}\n"
          p.write_text(s,encoding='utf-8')

          p=Path('nettoyage-master.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('digiy-master-ui-v1.css?v=20260830-v1','digiy-master-ui-v1.css?v=20260830-cleaning-v2')
          s=s.replace('digiy-public-module-master-v2.js?v=20260830-ui-v1','digiy-public-module-master-v2.js?v=20260830-open-v2')
          s=s.replace('/sw.js?v=20260830-master-ui-v5','/sw.js?v=20260830-master-ui-v6')
          p.write_text(s,encoding='utf-8')

          p=Path('sw.js')
          s=p.read_text(encoding='utf-8').replace('digiylyfe-pwa-20260830-master-ui-v5','digiylyfe-pwa-20260830-master-ui-v6')
          p.write_text(s,encoding='utf-8')
          for fn in ['index.html','territoire.html']:
              p=Path(fn); s=p.read_text(encoding='utf-8').replace('/sw.js?v=20260830-master-ui-v5','/sw.js?v=20260830-master-ui-v6'); p.write_text(s,encoding='utf-8')
          PY
      - name: Vérifier
        run: |
          set -euo pipefail
          grep -F "view:'OUVRIR →'" assets/digiy-public-module-master-v2.js
          ! grep -F "OUVRIR LA FICHE" assets/digiy-public-module-master-v2.js
          grep -F 'CLEANING VISUAL MASTER V2' assets/digiy-master-ui-v1.css
          grep -F 'grid-template-columns:minmax(210px,38%)' assets/digiy-master-ui-v1.css
          grep -F 'digiy-public-module-master-v2.js?v=20260830-open-v2' nettoyage-master.html
          grep -F 'digiylyfe-pwa-20260830-master-ui-v6' sw.js
          node --check assets/digiy-public-module-master-v2.js
      - name: Publier et nettoyer
        run: |
          set -euo pipefail
          rm -f .github/workflows/corriger-master-ouverture-visuel-temp.yml
          git config user.name 'DIGIYLYFE Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/digiy-public-module-master-v2.js assets/digiy-master-ui-v1.css nettoyage-master.html sw.js index.html territoire.html .github/workflows/corriger-master-ouverture-visuel-temp.yml
          git commit -m 'MASTER: ouvrir simplement et renforcer visuel nettoyage'
          git push origin main
