name: One-off dossier country prices fix
on:
  push:
    paths:
      - '.github/workflows/oneoff-dossier-country-prices-fix-20260911.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch dossier free card and site tier prices
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('assets/digiy-fiche-flow-20260911.js')
          s=p.read_text()

          old="function ensureFreeCard(d,l){let e=document.getElementById('digiyFreeCardEntry'),hero=document.querySelector('.hero');if(!hero)return;if(!e){e=document.createElement('section');e.id='digiyFreeCardEntry';e.className='digiy-free-card-entry';e.innerHTML='<div class=\"k\" id=\"dfcK\"></div><h2 id=\"dfcT\"></h2><div class=\"zero\">0 FCFA · 0 €</div><p id=\"dfcL\"></p><div class=\"infos\" id=\"dfcI\"></div><a id=\"dfcB\"></a><div class=\"sep\" id=\"dfcS\"></div>';hero.parentNode.insertBefore(e,hero)}document.getElementById('dfcK').textContent=d.k;document.getElementById('dfcT').textContent=d.t;document.getElementById('dfcL').textContent=d.l;document.getElementById('dfcI').textContent=d.i;document.getElementById('dfcB').textContent=d.b;document.getElementById('dfcS').textContent=d.s;const p=new URLSearchParams(location.search),country=(p.get('country')||(document.getElementById('country')&&document.getElementById('country').value)||'sn').toLowerCase();document.getElementById('dfcB').href='/carte-gratuite.html?country='+(country==='fr'?'fr':'sn')+'&lang='+l}"
          new="function ensureFreeCard(d,l){let e=document.getElementById('digiyFreeCardEntry'),hero=document.querySelector('.hero');if(!hero)return;if(!e){e=document.createElement('section');e.id='digiyFreeCardEntry';e.className='digiy-free-card-entry';e.innerHTML='<div class=\"k\" id=\"dfcK\"></div><h2 id=\"dfcT\"></h2><div class=\"zero\" id=\"dfcZero\"></div><p id=\"dfcL\"></p><div class=\"infos\" id=\"dfcI\"></div><a id=\"dfcB\"></a><div class=\"sep\" id=\"dfcS\"></div>';hero.parentNode.insertBefore(e,hero)}document.getElementById('dfcK').textContent=d.k;document.getElementById('dfcT').textContent=d.t;document.getElementById('dfcL').textContent=d.l;document.getElementById('dfcI').textContent=d.i;document.getElementById('dfcB').textContent=d.b;document.getElementById('dfcS').textContent=d.s;const p=new URLSearchParams(location.search),raw=(p.get('country')||(document.getElementById('country')&&document.getElementById('country').value)||'sn').toLowerCase(),country=raw==='us'?'us':raw==='fr'?'fr':'sn',zero=country==='us'?'$0':country==='fr'?'0 €':'0 FCFA';document.getElementById('dfcZero').textContent=zero;document.getElementById('dfcB').href='/carte-gratuite.html?country='+country+'&lang='+l}"
          if old not in s:
              raise SystemExit('free card marker missing')
          s=s.replace(old,new,1)

          old2="function ensureSiteChoices(){const x0=document.getElementById('x0'),x1=document.getElementById('x1'),x2=document.getElementById('x2'),tp=document.getElementById('tierPremium'),te=document.getElementById('tierExtra'),wrap=document.getElementById('siteTierWrap'),choices=x0&&x0.parentElement;if(x1){x1.style.display='none';x1.disabled=true}if(x2){x2.style.display='none';x2.setAttribute('aria-hidden','true')}if(wrap)wrap.style.display='none';if(!choices||!x2||!tp||!te)return;let p=document.getElementById('digiySitePremiumChoice'),e=document.getElementById('digiySiteExtraChoice');if(!p){p=document.createElement('button');p.type='button';p.className='choice';p.id='digiySitePremiumChoice';choices.appendChild(p)}if(!e){e=document.createElement('button');e.type='button';e.className='choice';e.id='digiySiteExtraChoice';choices.appendChild(e)}p.textContent=tp.textContent||'⭐ SITE PREMIUM';e.textContent=te.textContent||'🚀 SITE EXTRA';p.onclick=function(){x2.click();tp.click();if(wrap)wrap.style.display='none';syncSiteChoices()};e.onclick=function(){x2.click();te.click();if(wrap)wrap.style.display='none';syncSiteChoices()};if(x0&&!x0.dataset.digiySiteSync){x0.dataset.digiySiteSync='1';x0.addEventListener('click',()=>setTimeout(syncSiteChoices,0))}syncSiteChoices()}"
          new2="function ensureSiteChoices(){const x0=document.getElementById('x0'),x1=document.getElementById('x1'),x2=document.getElementById('x2'),tp=document.getElementById('tierPremium'),te=document.getElementById('tierExtra'),wrap=document.getElementById('siteTierWrap'),choices=x0&&x0.parentElement;if(x1){x1.style.display='none';x1.disabled=true}if(x2){x2.style.display='none';x2.setAttribute('aria-hidden','true')}if(wrap)wrap.style.display='none';if(!choices||!x2||!tp||!te)return;let p=document.getElementById('digiySitePremiumChoice'),e=document.getElementById('digiySiteExtraChoice');if(!p){p=document.createElement('button');p.type='button';p.className='choice';p.id='digiySitePremiumChoice';choices.appendChild(p)}if(!e){e=document.createElement('button');e.type='button';e.className='choice';e.id='digiySiteExtraChoice';choices.appendChild(e)}const q=new URLSearchParams(location.search),raw=(q.get('country')||(document.getElementById('country')&&document.getElementById('country').value)||'sn').toLowerCase(),country=raw==='us'?'us':raw==='fr'?'fr':'sn',prices={sn:{premium:'250 000 FCFA+',extra:'450 000 FCFA+'},fr:{premium:'480 €+',extra:'800 €+'},us:{premium:'$790+',extra:'$1,490+'}},price=prices[country];p.textContent=(tp.textContent||'⭐ SITE PREMIUM')+' · '+price.premium;e.textContent=(te.textContent||'🚀 SITE EXTRA')+' · '+price.extra;p.onclick=function(){x2.click();tp.click();if(wrap)wrap.style.display='none';syncSiteChoices()};e.onclick=function(){x2.click();te.click();if(wrap)wrap.style.display='none';syncSiteChoices()};if(x0&&!x0.dataset.digiySiteSync){x0.dataset.digiySiteSync='1';x0.addEventListener('click',()=>setTimeout(syncSiteChoices,0))}syncSiteChoices()}"
          if old2 not in s:
              raise SystemExit('site choice marker missing')
          s=s.replace(old2,new2,1)
          p.write_text(s)

          p=Path('preparer-ma-carte.html')
          s=p.read_text()
          old3='/assets/digiy-fiche-flow-20260911.js?v=20260911-direct-site-tiers-v3'
          new3='/assets/digiy-fiche-flow-20260911.js?v=20260911-country-prices-v1'
          if old3 not in s:
              raise SystemExit('loader version marker missing')
          p.write_text(s.replace(old3,new3,1))
          PY
          git diff --check
          git diff -- assets/digiy-fiche-flow-20260911.js preparer-ma-carte.html
      - name: Commit correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/digiy-fiche-flow-20260911.js preparer-ma-carte.html
          git commit -m 'fix(dossier): preserve country and show site tier prices [skip ci]'
          git push
