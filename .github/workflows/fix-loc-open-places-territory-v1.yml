name: Fix LOC open places territory
on:
  push:
    paths:
      - '.github/workflows/fix-loc-open-places-territory-v1.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Broaden LOC places and bump loader
        run: |
          python3 - <<'PY'
          from pathlib import Path

          loc = Path('assets/digiy-territoire-petite-cote-loc-v1.js')
          s = loc.read_text(encoding='utf-8')
          old = "function active(){var p=params();return (p.get('zone')||'')==='petite-cote'&&(p.get('local')||'')==='saly'&&(p.get('need')||'')==='accommodation'}"
          new = "function active(){var p=params();return (p.get('zone')||'')==='petite-cote'&&(p.get('need')||'')==='accommodation'}"
          if old not in s:
              raise SystemExit('Expected LOC active condition not found; aborting.')
          s = s.replace(old, new, 1)
          s = s.replace('/* DIGIYLYFE — SALY / PETITE COTE · LOC V1', '/* DIGIYLYFE — PETITE COTE · LOC V1', 1)
          loc.write_text(s, encoding='utf-8')

          page = Path('territoire.html')
          t = page.read_text(encoding='utf-8')
          old_loader = '/assets/digiy-territoire-petite-cote-loc-v1.js?v=20260829-v1'
          new_loader = '/assets/digiy-territoire-petite-cote-loc-v1.js?v=20260829-v2'
          if old_loader not in t:
              raise SystemExit('Expected LOC loader not found in territoire.html; aborting.')
          t = t.replace(old_loader, new_loader, 1)
          page.write_text(t, encoding='utf-8')
          PY

          grep -F "return (p.get('zone')||'')==='petite-cote'&&(p.get('need')||'')==='accommodation'" assets/digiy-territoire-petite-cote-loc-v1.js
          grep -F 'digiy-territoire-petite-cote-loc-v1.js?v=20260829-v2' territoire.html
      - name: Commit production correction and remove installer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-loc-open-places-territory-v1.yml
          git add assets/digiy-territoire-petite-cote-loc-v1.js territoire.html
          git commit -m 'SALY LOC: keep three open places across territory filters [skip ci]'
          git push
