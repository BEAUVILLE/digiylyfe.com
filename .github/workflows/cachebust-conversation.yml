name: Cache-bust manifeste conversationnel

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cachebust-conversation.yml"

permissions:
  contents: write

jobs:
  cachebust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Forcer le nouveau script conversationnel
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = './assets/js/digiy-fidelisation.js?v=20260801-hero'
          new = './assets/js/digiy-fidelisation.js?v=20260810-conversation'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Référence digiy-fidelisation attendue introuvable')
          p.write_text(text, encoding='utf-8')
          PY

      - name: Nettoyer le workflow ponctuel et pousser
        shell: bash
        run: |
          rm -f .github/workflows/cachebust-conversation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git add -u .github/workflows/cachebust-conversation.yml
          if git diff --cached --quiet; then
            echo "Aucun changement à pousser."
            exit 0
          fi
          git commit -m "Forcer le chargement du manifeste conversationnel [skip ci]"
          git push
