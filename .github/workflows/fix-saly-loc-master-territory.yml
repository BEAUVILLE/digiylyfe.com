name: Fix SALY LOC master territory
on:
  push:
    paths:
      - '.github/workflows/fix-saly-loc-master-territory.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Broaden LOC master mount and bump loader
        run: |
          python3 - <<'PY'
          from pathlib import Path

          sig = Path('assets/digiy-saly-baptiste-signature-v1.js')
          s = sig.read_text(encoding='utf-8')
          old = "if(zone!=='petite-cote'||local!=='saly'||(need&&need!=='accommodation'))return false;"
          new = "if(zone!=='petite-cote'||(need&&need!=='accommodation'))return false;"
          if old not in s:
              raise SystemExit('Expected territory mount condition not found; aborting.')
          s = s.replace(old, new, 1)
          sig.write_text(s, encoding='utf-8')

          page = Path('territoire.html')
          t = page.read_text(encoding='utf-8')
          old_loader = '/assets/digiy-saly-baptiste-signature-v1.js?v=20260828-v1'
          new_loader = '/assets/digiy-saly-baptiste-signature-v1.js?v=20260829-territory-v2'
          if old_loader not in t:
              raise SystemExit('Expected Saly signature loader not found in territoire.html; aborting.')
          t = t.replace(old_loader, new_loader, 1)
          page.write_text(t, encoding='utf-8')
          PY

          grep -F "if(zone!=='petite-cote'||(need&&need!=='accommodation'))return false;" assets/digiy-saly-baptiste-signature-v1.js
          grep -F 'digiy-saly-baptiste-signature-v1.js?v=20260829-territory-v2' territoire.html
      - name: Commit production correction and remove installer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-saly-loc-master-territory.yml
          git add assets/digiy-saly-baptiste-signature-v1.js territoire.html
          git commit -m 'SALY LOC: use master card across territory filters [skip ci]'
          git push
