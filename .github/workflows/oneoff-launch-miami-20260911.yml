          rep('tarifs-loc.html','<select id="country" required><option value="sn">Sénégal · FCFA</option><option value="eu">Europe · €</option></select>','<select id="country" required><option value="sn">Sénégal · FCFA</option><option value="eu">Europe · €</option><option value="us">USA · Miami · $</option></select>')
          rep('tarifs-loc.html','<article class="pay" id="payEu"><strong>🇪🇺 EUROPE · SENDWAVE → WAVE SÉNÉGAL</strong><div class="name">Jean Baptiste Beauville</div><a href="tel:+221771342889">+221 77 134 28 89</a><p id="sendwave">Depuis l’Europe, utilisez Sendwave vers ce numéro Wave Sénégal pour le règlement annuel affiché.</p></article>','<article class="pay" id="payEu"><strong>🇪🇺 EUROPE · SENDWAVE → WAVE SÉNÉGAL</strong><div class="name">Jean Baptiste Beauville</div><a href="tel:+221771342889">+221 77 134 28 89</a><p id="sendwave">Depuis l’Europe, utilisez Sendwave vers ce numéro Wave Sénégal pour le règlement annuel affiché.</p></article><article class="pay hidden" id="payUs"><strong>🇺🇸 USA · SENDWAVE → WAVE SÉNÉGAL</strong><div class="name">Jean Baptiste Beauville</div><a href="tel:+221771342889">+221 77 134 28 89</a><p>From the United States, use Sendwave to this Wave Senegal number only after DIGIYLYFE validates your file.</p></article>')
          reps={
            "{max:3,label:'1–3',snRef:28000,snAnnual:268800,euRef:75,euAnnual:720}":"{max:3,label:'1–3',snRef:28000,snAnnual:268800,euRef:75,euAnnual:720,usAnnual:790}",
            "{max:10,label:'4–10',snRef:35000,snAnnual:336000,euRef:95,euAnnual:912}":"{max:10,label:'4–10',snRef:35000,snAnnual:336000,euRef:95,euAnnual:912,usAnnual:990}",
            "{max:15,label:'11–15',snRef:45000,snAnnual:432000,euRef:125,euAnnual:1200}":"{max:15,label:'11–15',snRef:45000,snAnnual:432000,euRef:125,euAnnual:1200,usAnnual:1290}",
            "{max:20,label:'16–20',snRef:55000,snAnnual:528000,euRef:150,euAnnual:1440}":"{max:20,label:'16–20',snRef:55000,snAnnual:528000,euRef:150,euAnnual:1440,usAnnual:1590}",
            "{max:25,label:'21–25',snRef:65000,snAnnual:624000,euRef:180,euAnnual:1728}":"{max:25,label:'21–25',snRef:65000,snAnnual:624000,euRef:180,euAnnual:1728,usAnnual:null}",
            "{max:30,label:'26–30',snRef:75000,snAnnual:720000,euRef:210,euAnnual:2016}":"{max:30,label:'26–30',snRef:75000,snAnnual:720000,euRef:210,euAnnual:2016,usAnnual:null}",
