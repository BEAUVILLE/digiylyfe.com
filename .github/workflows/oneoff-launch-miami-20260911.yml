name: One-off launch Miami pilot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oneoff-launch-miami-20260911.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Open Miami pilot
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          def rep(path, old, new, count=1):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'marker missing in {path}: {old[:120]}')
              s=s.replace(old,new,count)
              p.write_text(s,encoding='utf-8')

          # 1) Country runtime: US / Miami pilot, only validated public prices.
          p=Path('assets/digiy-adhesion-runtime-v1.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          gm=d.setdefault('generated_from_master',{})
          gm['usa_country']='BEAUVILLE/digiy-master-modeles/MASTER-PAYS-USA-V1/config/country.json'
          gm['usa_pricing']='BEAUVILLE/digiy-master-modeles/MASTER-PAYS-USA-V1/config/pricing.json'
          d['countries']=[c for c in d.get('countries',[]) if c.get('id')!='US']
          d['countries'].append({
            'id':'US','slug':'united-states','status':'active',
            'labels':{'fr':'États-Unis','en':'United States','es':'Estados Unidos','pt':'Estados Unidos','it':'Stati Uniti','de':'Vereinigte Staaten','nl':'Verenigde Staten','ar':'الولايات المتحدة'},
