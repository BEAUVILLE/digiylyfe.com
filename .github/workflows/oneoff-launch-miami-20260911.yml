          rep('tarifs-loc.html',"   '<td class=\"annualPrice\">'+money(t.euAnnual,'eu')+'<span class=\"saving\">− '+money(euSave,'eu')+' · + 2 mois offerts</span></td>';","   '<td class=\"annualPrice\">'+money(t.euAnnual,'eu')+'<span class=\"saving\">− '+money(euSave,'eu')+' · + 2 mois offerts</span></td>'+\n   '<td class=\"annualPrice\">'+(t.usAnnual?money(t.usAnnual,'us')+' / year · 0% DIGIYLYFE commission':'SUR DEVIS')+'</td>';",1)
          rep('tarifs-loc.html',"var tr=document.createElement('tr');tr.innerHTML='<td>+40</td><td>SUR DEVIS</td><td>SUR DEVIS</td><td>SUR DEVIS</td><td>SUR DEVIS</td>';body.appendChild(tr);","var tr=document.createElement('tr');tr.innerHTML='<td>+40</td><td>SUR DEVIS</td><td>SUR DEVIS</td><td>SUR DEVIS</td><td>SUR DEVIS</td><td>SUR DEVIS</td>';body.appendChild(tr);",1)
