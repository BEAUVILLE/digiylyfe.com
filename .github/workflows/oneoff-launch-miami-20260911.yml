          # 3) Free card page: US country + $0. US pilot intake falls back to direct WhatsApp if server-side US intake is unavailable.
          rep('carte-gratuite.html','<div class="free">0 FCFA · 0 €</div>','<div class="free">0 FCFA · 0 € · $0</div>')
          rep('carte-gratuite.html','<select id="country" required><option value="SN">🇸🇳 Sénégal</option><option value="FR">🇫🇷 France</option></select>','<select id="country" required><option value="SN">🇸🇳 Sénégal</option><option value="FR">🇫🇷 France</option><option value="US">🇺🇸 USA · Miami</option></select>')
          rep('carte-gratuite.html',"document.getElementById('country').value=c==='FR'?'FR':'SN';document.getElementById('backTariffs').href='https://digiylyfe.com/tarifs-adherents-1.html?country='+(c==='FR'?'fr':'sn');","const initialCountry=c==='US'?'US':c==='FR'?'FR':'SN';document.getElementById('country').value=initialCountry;document.getElementById('backTariffs').href='https://digiylyfe.com/tarifs-adherents-1.html?country='+initialCountry.toLowerCase();")
          rep('carte-gratuite.html',"try{const r=await fetch(ENDPOINT,{method:'POST'","const selectedCountry=document.getElementById('country').value;if(selectedCountry==='US'){const msg=['🪪 DIGIYLYFE — MIAMI PILOT · FREE CARD REQUEST','',`Business: ${document.getElementById('proName').value}`,`Contact: ${document.getElementById('responsible').value}`,`Activity: ${document.getElementById('job').value}`,`City / area: ${document.getElementById('zone').value}`,`WhatsApp / phone: ${document.getElementById('phone').value}`,`Email: ${document.getElementById('email').value}`,'','No payment requested · Miami pilot'].join('\\n');wa.href='https://wa.me/221771342889?text='+encodeURIComponent(msg);after.classList.add('show');status.textContent=lang()==='es'?'Piloto Miami: continúa por WhatsApp para enviar tu solicitud de tarjeta gratuita.':'Miami pilot: continue on WhatsApp to send your free card request.';btn.disabled=false;return}try{const r=await fetch(ENDPOINT,{method:'POST'",1)
