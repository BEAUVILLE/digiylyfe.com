              'modules':{'loc':{'billing_period':'year','commission_rate':0,'tiers':[{'max':3,'label':'1–3','amount':790},{'max':10,'label':'4–10','amount':990},{'max':15,'label':'11–15','amount':1290},{'max':20,'label':'16–20','amount':1590}],'above_20':'quote'}},
              'services':{}
            },
            'territories':[{'id':'US-FL-MIAMI','slug':'miami','status':'active','labels':{'fr':'Miami · Floride','en':'Miami · Florida','es':'Miami · Florida','pt':'Miami · Flórida','it':'Miami · Florida','de':'Miami · Florida','nl':'Miami · Florida','ar':'ميامي · فلوريدا'},'zones':[{'id':'US-FL-MIAMI-MIAMI','slug':'miami','label':'Miami','status':'active'}]}]
          })
