          rep('tarifs-adherents-1.html',old,new)
          rep('tarifs-adherents-1.html',"if(pc)pc.style.display=payApproved?'flex':'none';document.querySelectorAll('[data-country]')","if(pc)pc.style.display=payApproved?'flex':'none';const payCards=document.querySelectorAll('#paiement .payCard');if(payCards.length>=2){payCards[0].hidden=countryId!=='SN';payCards[1].hidden=countryId==='SN';const f=payCards[1].querySelector('.payFlag');if(f)f.textContent=countryId==='US'?'🇺🇸':'🇪🇺'}if(countryId==='US'){document.getElementById('sendwaveTitle').textContent='USA · SENDWAVE → WAVE SENEGAL';document.getElementById('sendwaveText').textContent='From the United States, select Senegal and Jean Baptiste Beauville: +221 77 134 28 89.'}document.querySelectorAll('[data-country]')",1)
          rep('tarifs-adherents-1.html',"setLang(localStorage.getItem('digiy_lang')||'fr');","setLang((new URLSearchParams(location.search)).get('lang')||localStorage.getItem('digiy_lang')||'fr');",1)

          # 5) Prevalidation loader: allow US and hide unpriced optional services during the Miami pilot.
          rep('preparer-ma-carte.html',"const locNeed=(q.get('need')||'').toLowerCase(),locModule=(q.get('module')||'').toLowerCase(),locProduct=(q.get('product')||'').toLowerCase();","const locNeed=(q.get('need')||'').toLowerCase(),locModule=(q.get('module')||'').toLowerCase(),locProduct=(q.get('product')||'').toLowerCase(),usPilot=(q.get('country')||'').toLowerCase()==='us';")
          rep('preparer-ma-carte.html',"if(c==='fr'||c==='eu')u.searchParams.set('country','eu');else if(c==='sn')u.searchParams.set('country','sn');","if(c==='fr'||c==='eu')u.searchParams.set('country','eu');else if(c==='sn')u.searchParams.set('country','sn');else if(c==='us')u.searchParams.set('country','us');")
          rep('preparer-ma-carte.html',"const forceCarnet=carnet?'<style data-carnet-force-minimal>","const forceUs=usPilot?'<style data-us-pilot>.extra{display:none!important}</style>':'';\nconst forceCarnet=carnet?'<style data-carnet-force-minimal>",1)
          rep('preparer-ma-carte.html',"h=h.replace(/<\\/head>/i,forceCarnet+tariffLayout+freeCardStyle+'</head>');","h=h.replace(/<\\/head>/i,forceUs+forceCarnet+tariffLayout+freeCardStyle+'</head>');",1)

