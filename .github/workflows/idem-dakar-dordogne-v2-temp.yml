name: Idem Dakar Dordogne Sarlat V2
on:
  push:
    paths:
      - '.github/workflows/idem-dakar-dordogne-v2-temp.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Appliquer et vérifier
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess

          p=Path('assets/digiy-territoire-runtime-v1.js'); s=p.read_text(encoding='utf-8')
          old="var LOCAL_NEEDS={'petite-cote':[['cleaning','🧹'],['professional','🏛️']]};"
          new="var LOCAL_NEEDS={'petite-cote':[['cleaning','🧹'],['professional','🏛️']],'dakar':[['cleaning','🧹'],['professional','🏛️']],'vallee-dordogne':[['cleaning','🧹'],['professional','🏛️']]};"
          assert old in s
          s=s.replace(old,new,1)
          marker='function renderNeeds(){'
          helper="""function localNeedMeta(id,meta){
            if(id==='cleaning'&&territoryId!=='petite-cote'){
              var generic={fr:'NETTOYAGE · Maison · Entretien · Bureaux',en:'CLEANING · Home · Maintenance · Offices',es:'LIMPIEZA · Hogar · Mantenimiento · Oficinas',pt:'LIMPEZA · Casa · Manutenção · Escritórios',de:'REINIGUNG · Haus · Pflege · Büros',it:'PULIZIA · Casa · Manutenzione · Uffici',nl:'SCHOONMAAK · Woning · Onderhoud · Kantoren',ar:'تنظيف · منازل · صيانة · مكاتب'};
              return generic[lang]||generic.fr;
            }
            return meta[id]||'';
          }

          """
          assert marker in s and 'function localNeedMeta(' not in s
          s=s.replace(marker,helper+marker,1)
          assert "sm.textContent=meta[n[0]]||'';" in s
          s=s.replace("sm.textContent=meta[n[0]]||'';","sm.textContent=localNeedMeta(n[0],meta);",1)
          p.write_text(s,encoding='utf-8')

          p=Path('dakar.html'); s=p.read_text(encoding='utf-8')
          artisan='<a class="need" href="/territoire.html?zone=dakar&need=artisan"><i>🔧</i><strong data-i18n="nArtisan">TROUVER UN ARTISAN</strong><small data-i18n="openNeed">Ouvrir à Dakar →</small></a>'
          add=artisan+'\n<a class="need" data-digiy-master-href="/nettoyage-master.html?territory=dakar" href="/nettoyage-master.html?territory=dakar&lang=fr"><i>🧹</i><strong data-i18n="nCleaning">SERVICE DE NETTOYAGE</strong><small data-i18n="openNeed">Ouvrir à Dakar →</small></a>\n<a class="need" data-digiy-master-href="/services-professionnels-master.html?territory=dakar" href="/services-professionnels-master.html?territory=dakar&lang=fr"><i>🏛️</i><strong data-i18n="nProfessional">SERVICES PROFESSIONNELS</strong><small data-i18n="openNeed">Ouvrir à Dakar →</small></a>'
          assert artisan in s
          s=s.replace(artisan,add,1)
          assert "nJobs:pk.needs.jobs,nVoice:pk.needs.guidance})}" in s
          s=s.replace("nJobs:pk.needs.jobs,nVoice:pk.needs.guidance})}","nJobs:pk.needs.jobs,nVoice:pk.needs.guidance,nCleaning:pk.needs.cleaning,nProfessional:pk.needs.professional})}",1)
          oldset="document.querySelectorAll('[data-lang]').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-lang')===l)});"
          assert oldset in s
          s=s.replace(oldset,oldset+"document.querySelectorAll('[data-digiy-master-href]').forEach(function(a){var u=new URL(a.getAttribute('data-digiy-master-href'),location.origin);u.searchParams.set('lang',l);a.href=u.pathname+u.search});",1)
          p.write_text(s,encoding='utf-8')

          p=Path('assets/digiy-dakar-i18n-v1.js'); s=p.read_text(encoding='utf-8')
          repl={
            '"guidance":"LA VOIX"}':'"guidance":"LA VOIX","cleaning":"SERVICE DE NETTOYAGE","professional":"SERVICES PROFESSIONNELS"}',
            '"guidance":"THE VOICE"}':'"guidance":"THE VOICE","cleaning":"CLEANING SERVICE","professional":"PROFESSIONAL SERVICES"}',
            '"guidance":"LA VOZ"}':'"guidance":"LA VOZ","cleaning":"SERVICIO DE LIMPIEZA","professional":"SERVICIOS PROFESIONALES"}',
            '"guidance":"A VOZ"}':'"guidance":"A VOZ","cleaning":"SERVIÇO DE LIMPEZA","professional":"SERVIÇOS PROFISSIONAIS"}',
            '"guidance":"LA VOCE"}':'"guidance":"LA VOCE","cleaning":"SERVIZIO DI PULIZIA","professional":"SERVIZI PROFESSIONALI"}',
            '"guidance":"DIE STIMME"}':'"guidance":"DIE STIMME","cleaning":"REINIGUNGSSERVICE","professional":"PROFESSIONELLE DIENSTE"}',
            '"guidance":"DE STEM"}':'"guidance":"DE STEM","cleaning":"SCHOONMAAKSERVICE","professional":"PROFESSIONELE DIENSTEN"}',
            '"guidance":"الصوت"}':'"guidance":"الصوت","cleaning":"خدمة تنظيف","professional":"الخدمات المهنية"}'
          }
          for a,b in repl.items(): assert a in s; s=s.replace(a,b,1)
          p.write_text(s,encoding='utf-8')

          p=Path('sarlat.html'); s=p.read_text(encoding='utf-8')
          old="var NEEDS=[['announcements','⚡','ANNONCES'],['transport','🚗','SE DÉPLACER'],['artisan','🔧','TROUVER UN ARTISAN'],['accommodation','🏠','DORMIR OU LOUER']"
          new="var NEEDS=[['announcements','⚡','ANNONCES'],['transport','🚗','SE DÉPLACER'],['artisan','🔧','TROUVER UN ARTISAN'],['cleaning','🧹','SERVICE DE NETTOYAGE'],['professional','🏛️','SERVICES PROFESSIONNELS'],['accommodation','🏠','DORMIR OU LOUER']"
          assert old in s; s=s.replace(old,new,1)
          labels={
            "guidance:'LA VOIX'}":"guidance:'LA VOIX',cleaning:'SERVICE DE NETTOYAGE',professional:'SERVICES PROFESSIONNELS'}",
            "guidance:'THE VOICE'}":"guidance:'THE VOICE',cleaning:'CLEANING SERVICE',professional:'PROFESSIONAL SERVICES'}",
            "guidance:'LA VOZ'}":"guidance:'LA VOZ',cleaning:'SERVICIO DE LIMPIEZA',professional:'SERVICIOS PROFESIONALES'}",
            "guidance:'A VOZ'}":"guidance:'A VOZ',cleaning:'SERVIÇO DE LIMPEZA',professional:'SERVIÇOS PROFISSIONAIS'}",
            "guidance:'LA VOCE'}":"guidance:'LA VOCE',cleaning:'SERVIZIO DI PULIZIA',professional:'SERVIZI PROFESSIONALI'}",
            "guidance:'DIE STIMME'}":"guidance:'DIE STIMME',cleaning:'REINIGUNGSSERVICE',professional:'PROFESSIONELLE DIENSTE'}",
            "guidance:'DE STEM'}":"guidance:'DE STEM',cleaning:'SCHOONMAAKSERVICE',professional:'PROFESSIONELE DIENSTEN'}",
            "guidance:'الصوت'}":"guidance:'الصوت',cleaning:'خدمة تنظيف',professional:'الخدمات المهنية'}"
          }
          for a,b in labels.items(): assert a in s; s=s.replace(a,b,1)
          oldclick="b.onclick=function(){state.need=state.need===n[0]?'':n[0];var u=new URL(location.href);"
          newclick="b.onclick=function(){if(n[0]==='cleaning'||n[0]==='professional'){var path=n[0]==='cleaning'?'/nettoyage-master.html':'/services-professionnels-master.html',m=new URL(path,location.origin);m.searchParams.set('territory','vallee-dordogne');m.searchParams.set('local','sarlat');m.searchParams.set('lang',lang());location.href=m.pathname+m.search;return}state.need=state.need===n[0]?'':n[0];var u=new URL(location.href);"
          assert oldclick in s; s=s.replace(oldclick,newclick,1)
          s=re.sub(r"/sw\.js\?v=[^'\"]+","/sw.js?v=20260830-master-ui-v8",s)
          p.write_text(s,encoding='utf-8')

          p=Path('territoire.html'); s=p.read_text(encoding='utf-8')
          s=re.sub(r'digiy-territoire-runtime-v1\.js\?v=[^\"]+','digiy-territoire-runtime-v1.js?v=20260830-native-doors-v2',s)
          s=re.sub(r"/sw\.js\?v=[^'\"]+","/sw.js?v=20260830-master-ui-v8",s)
          p.write_text(s,encoding='utf-8')
          for fn in ['index.html','nettoyage-master.html','services-professionnels-master.html']:
              p=Path(fn); x=p.read_text(encoding='utf-8'); x=re.sub(r"/sw\.js\?v=[^'\"]+","/sw.js?v=20260830-master-ui-v8",x); p.write_text(x,encoding='utf-8')
          p=Path('sw.js'); x=p.read_text(encoding='utf-8'); x=re.sub(r"const DIGIY_PWA_VERSION = '[^']+';","const DIGIY_PWA_VERSION = 'digiylyfe-pwa-20260830-master-ui-v8';",x); p.write_text(x,encoding='utf-8')

          checks={
            'assets/digiy-territoire-runtime-v1.js':["'dakar':[['cleaning','🧹'],['professional','🏛️']]","'vallee-dordogne':[['cleaning','🧹'],['professional','🏛️']]","function localNeedMeta("],
            'dakar.html':['data-i18n="nCleaning"','data-i18n="nProfessional"','data-digiy-master-href'],
            'sarlat.html':["['cleaning','🧹','SERVICE DE NETTOYAGE']","['professional','🏛️','SERVICES PROFESSIONNELS']","m.searchParams.set('local','sarlat')"],
            'territoire.html':['native-doors-v2'],
            'sw.js':['digiylyfe-pwa-20260830-master-ui-v8']
          }
          for fn,needles in checks.items():
              txt=Path(fn).read_text(encoding='utf-8')
              for needle in needles: assert needle in txt,(fn,needle)
          subprocess.run(['node','--check','assets/digiy-territoire-runtime-v1.js'],check=True)
          subprocess.run(['node','--check','assets/digiy-dakar-i18n-v1.js'],check=True)
          PY
      - name: Publier et nettoyer
        run: |
          set -euo pipefail
          rm -f .github/workflows/idem-dakar-dordogne-temp.yml .github/workflows/idem-dakar-dordogne-v2-temp.yml
          git config user.name 'DIGIYLYFE Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/digiy-territoire-runtime-v1.js assets/digiy-dakar-i18n-v1.js dakar.html sarlat.html territoire.html index.html nettoyage-master.html services-professionnels-master.html sw.js .github/workflows/idem-dakar-dordogne-temp.yml .github/workflows/idem-dakar-dordogne-v2-temp.yml
          git commit -m 'Territoires: aligner Dakar Dordogne et Sarlat sur les portes natives'
          git push origin main
