name: Brancher le cartouche fidélisation

on:
  push:
    paths:
      - '.github/workflows/brancher-fidelisation.yml'

permissions:
  contents: write

jobs:
  brancher:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer la vitrine
        uses: actions/checkout@v4

      - name: Ajouter le chargement du cartouche
        shell: python
        run: |
          from pathlib import Path

          page = Path('index.html')
          workflow = Path('.github/workflows/brancher-fidelisation.yml')
          html = page.read_text(encoding='utf-8')
          tag = '<script src="./assets/js/digiy-fidelisation.js?v=20260801" defer></script>'

          if tag not in html:
              marker = '</body>'
              position = html.find(marker)
              if position < 0:
                  raise SystemExit('Balise </body> introuvable dans index.html')
              html = html[:position] + tag + '\n' + html[position:]
              page.write_text(html, encoding='utf-8')

          if workflow.exists():
              workflow.unlink()

      - name: Publier la modification ciblée
        run: |
          git config user.name "DIGIYLYFE Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/brancher-fidelisation.yml
          git diff --cached --quiet && exit 0
          git commit -m "Afficher la fidélisation client dans la vitrine"
          git push