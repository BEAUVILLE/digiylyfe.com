name: Dakar projection cache fix once
on:
  push:
    paths:
      - '.github/workflows/dakar-final-voice-fix-once.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate patch
        run: python3 -m py_compile scripts/dakar-final-voice-fix.py
      - name: Apply
        run: python3 scripts/dakar-final-voice-fix.py
      - name: Validate
        run: |
          node --check assets/digiy-territoire-public-safety-v1.js
          grep -q "placeholderCard(id,ex,i)" assets/digiy-territoire-public-safety-v1.js
          ! grep -q "placeholderCard(id,ex,i+1)" assets/digiy-territoire-public-safety-v1.js
          grep -q "digiy-territoire-public-safety-v1.js?v=20260827-dakar-master-v2" territoire.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/digiy-territoire-public-safety-v1.js territoire.html
          git commit -m 'Dakar: forcer les variantes 1 2 3 sans cache ancien'
          git push
