let lang="fr";
const $=id=>document.getElementById(id);
function safeLang(x){return T[x]?x:"fr"}
function setLang(x){
 lang=safeLang(x); const t=T[lang];
 document.documentElement.lang=lang; document.documentElement.dir=(lang==="ar"?"rtl":"ltr");
 document.title=t.title;
 $("back").textContent=t.back;$("action").textContent=t.action;$("h1").textContent=t.h1;$("lead").textContent=t.lead;

 $("l_manager").textContent=t.manager;$("manager_name").placeholder=t.manager_ph;
 $("l_wa").textContent=t.wa;$("whatsapp_num").placeholder=t.wa_ph;
 $("l_offer").textContent=t.offer;$("offer_chosen").value=t.offer_value;
 $("l_pay").textContent=t.pay;

 document.querySelectorAll("[data-l]").forEach(b=>b.classList.toggle("on",b.dataset.l===lang));
 localStorage.setItem("digiy_lang",lang);
}
function val(id){return $(id).value.trim()}
function buildMessage(){
 const t=T[lang], ji=parseInt(val("job_type")||"0",10), pi=parseInt(val("pay_method")||"0",10);
 let s=t.msg_title+"\n----------------------------------------\n";
 s+=t.m_activity+" : "+val("activity_name")+"\n";
 s+=t.m_job+" : "+(T[lang].jobs[ji]||"")+"\n";

 s+="----------------------------------------\n"+t.m_end; return s;
}
function ready(){if(!$("f").checkValidity()){$("f").reportValidity();return false}return true}
$("f").addEventListener("submit",e=>{e.preventDefault();if(!ready())return;location.href="https://wa.me/"+DIGIY_PHONE+"?text="+encodeURIComponent(buildMessage())});
