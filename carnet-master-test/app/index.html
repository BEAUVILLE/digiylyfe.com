<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <meta name="theme-color" content="#07150f">
  <title>PRO CARNET — rail test</title>
</head>
<body style="margin:0;min-height:100vh;display:grid;place-items:center;background:#06140f;color:#fff8e8;font-family:system-ui;font-weight:900;text-align:center;padding:24px">
  Chargement du rail PRO CARNET…
<script>
(async()=>{
  "use strict";
  const SOURCE="https://raw.githubusercontent.com/BEAUVILLE/pro-carnet/5bdf3055a0083ef8fb01a32cb389b3cd1d51dd76/app/index.html";
  try{
    const res=await fetch(SOURCE,{cache:"no-store"});
    if(!res.ok) throw new Error("source_http_"+res.status);
    const html=await res.text();
    if(!html.includes("PRO CARNET") || !html.includes("btnMagicAdd") || !html.includes("navAdmin")) throw new Error("source_rail_invalid");
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.body.innerHTML='<main style="max-width:560px"><h1>PRO CARNET</h1><p>Rail de référence indisponible.</p><p style="opacity:.7">'+String(err?.message||err)+'</p><p><a href="../index.html" style="color:#f4d27a">↩ Retour porte OTP</a></p></main>';
  }
})();
</script>
</body>
</html>
