<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,follow"><title>Brochure métier — DIGIYLYFE</title><style>
*{box-sizing:border-box}body{margin:0;background:#071b14;color:#eef5ed;font-family:system-ui,-apple-system,sans-serif}a{color:inherit}.bar{position:sticky;top:0;z-index:20;background:#102b1e;border-bottom:1px solid #426e55;padding:10px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;padding:11px 14px;border-radius:10px;text-decoration:none;font-weight:800;font-size:.9rem;cursor:pointer}.back{background:#e9cd87;color:#13251a}.bar strong{flex:1;font-size:.95rem}.tools{position:sticky;top:67px;z-index:10;background:#102b1e;padding:10px 12px;display:flex;justify-content:center;align-items:center;gap:12px;border-bottom:1px solid #355643}button{border:1px solid #8da999;background:#173e2d;color:white}.count{font-weight:750;font-variant-numeric:tabular-nums}main{max-width:920px;margin:auto;padding:18px 12px 28px}.status{color:#c7decd;text-align:center;line-height:1.5}.sheet{display:block;width:100%;height:auto;background:white;box-shadow:0 8px 24px #0007;margin:0 auto 22px}.fallback{display:none;text-align:center}.fallback iframe{width:100%;height:70dvh;border:1px solid #355643;background:white}.footer{text-align:center;padding:25px}button:disabled{opacity:.42}@media(max-width:600px){.bar strong{flex-basis:100%;order:-1}.tools{top:98px}.btn{padding:12px}.sheet{margin-bottom:14px}}@media print{.bar,.tools,.status,.footer{display:none}body{background:white}.sheet{box-shadow:none;break-after:page}}
</style></head><body><nav class="bar"><a class="btn back" href="/outils-gestion-demo.html">← Retour aux outils</a><strong id="title">Brochure DIGIYLYFE</strong></nav><div class="tools"><button class="btn" id="prev" disabled>← Précédente</button><span id="count" class="count">…</span><button class="btn" id="next" disabled>Suivante →</button></div><main><p id="status" class="status" role="status">Chargement des pages du document…</p><div id="pages"></div><div id="fallback" class="fallback"><p>Votre appareil ne permet pas l'affichage multipage ici. Utilisez le retour ci-dessus pour revenir aux outils.</p><iframe id="native" title="Lecture du PDF"></iframe></div></main><footer class="footer"><a class="btn back" href="/outils-gestion-demo.html">← Retour aux outils</a></footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script>
(function(){'use strict';
const docs={loc:['DIGIY LOC','/loc.pdf'],driver:['DIGIY DRIVER','/driver.pdf'],commerce:['MON COMMERCE','/commerce.pdf'],carnet:['PRO CARNET','/carnet.pdf'],explore:['DIGIY EXPLORE','/explore.pdf'],resto:['DIGIY RESTO · Exemple neutre','/resto-exemple.pdf'],build:['DIGIY BUILD · Exemple neutre','/build-exemple.pdf']};
const key=new URLSearchParams(location.search).get('doc'),d=Object.prototype.hasOwnProperty.call(docs,key)?docs[key]:null;
const status=document.getElementById('status'),pages=document.getElementById('pages'),count=document.getElementById('count');
const prev=document.getElementById('prev'),next=document.getElementById('next');let current=1,total=0;
if(!d){status.textContent='Brochure introuvable. Revenez aux outils.';return}
document.title=d[0]+' — DIGIYLYFE';document.getElementById('title').textContent=d[0];
function update(n){if(!total)return;current=Math.min(total,Math.max(1,n));count.textContent=current+' / '+total;prev.disabled=current===1;next.disabled=current===total;const c=document.getElementById('page-'+current);if(c)c.scrollIntoView({behavior:'smooth',block:'start'});}
prev.addEventListener('click',()=>update(current-1));next.addEventListener('click',()=>update(current+1));
function fallback(){status.textContent='Aperçu alternatif disponible ci-dessous.';document.getElementById('fallback').style.display='block';document.getElementById('native').src=d[1];count.textContent='PDF';}
async function start(){if(!window.pdfjsLib){fallback();return}try{
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const pdf=await pdfjsLib.getDocument({url:d[1],disableAutoFetch:false}).promise;total=pdf.numPages;count.textContent='1 / '+total;prev.disabled=true;next.disabled=total<2;
for(let i=1;i<=total;i++){const p=await pdf.getPage(i);const v=p.getViewport({scale:1});const ratio=Math.min(2,Math.max(1,devicePixelRatio||1));const width=Math.max(280,Math.min(860,pages.clientWidth));const viewport=p.getViewport({scale:(width/v.width)*ratio});const canvas=document.createElement('canvas');canvas.id='page-'+i;canvas.className='sheet';canvas.width=Math.floor(viewport.width);canvas.height=Math.floor(viewport.height);canvas.style.scrollMarginTop='175px';canvas.setAttribute('aria-label','Page '+i+' sur '+total);pages.appendChild(canvas);await p.render({canvasContext:canvas.getContext('2d'),viewport:viewport}).promise;status.textContent='Page '+i+' sur '+total+' chargée.';}
status.textContent=total+' page'+(total>1?'s':'')+' · Faites défiler ou utilisez les flèches.';const observer=new IntersectionObserver(entries=>{for(const e of entries){if(e.isIntersecting){const n=Number(e.target.id.replace('page-',''));if(n){current=n;count.textContent=n+' / '+total;prev.disabled=n===1;next.disabled=n===total}}}},{threshold:.5});pages.querySelectorAll('canvas').forEach(c=>observer.observe(c));
}catch(e){pages.textContent='';fallback()}}
start();
})();
</script></body></html>
