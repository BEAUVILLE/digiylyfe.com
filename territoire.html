function syncUrl(){if(!history.replaceState)return;var u=new URL(location.href);u.searchParams.set('zone',territoryId);if(state.need)u.searchParams.set('need',state.need);else u.searchParams.delete('need');if(state.zone!=='all')u.searchParams.set('local',state.zone);else u.searchParams.delete('local');u.searchParams.set('lang',lang);history.replaceState({},'',u.pathname+u.search)}
function renderHeader(){var c=current(),tr=T[lang];document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.title='DIGIY '+label(c.name)+' | DIGIYLYFE';document.getElementById('country').textContent=label(c.country);document.getElementById('territoryName').textContent='DIGIY '+label(c.name).toUpperCase();document.getElementById('tagline').textContent=tr.tag;document.getElementById('path').textContent=tr.path;document.getElementById('needTitle').textContent=tr.need;document.getElementById('zoneTitle').textContent=tr.zone;document.getElementById('sarlatDoor').classList.toggle('show',territoryId==='vallee-dordogne');document.querySelectorAll('[data-lang]').forEach(function(b){b.classList.toggle('active',b.dataset.lang===lang)});document.getElementById('source').textContent=state.live?tr.sourceLive:tr.sourceFallback}
function renderNeeds(){var root=document.getElementById('needs'),tr=T[lang];root.innerHTML='';NEEDS.forEach(function(n){var b=document.createElement('button');b.type='button';b.className='need'+(state.need===n[0]?' active':'');var ic=document.createElement('strong'),tx=document.createElement('span');ic.textContent=n[1];tx.textContent=tr.labels[n[0]];b.append(ic,tx);b.addEventListener('click',function(){if(n[0]==='guidance'){location.href='https://pro-action-digiy.digiylyfe.com/';return}state.need=state.need===n[0]?'':n[0];syncUrl();renderNeeds();renderResults()});root.appendChild(b)})}
function renderZones(){var root=document.getElementById('zones'),tr=T[lang],zones=['all'].concat(current().zones);root.innerHTML='';zones.forEach(function(z){var b=document.createElement('button');b.type='button';b.className='chip'+(state.zone===z?' active':'');b.textContent=z==='all'?tr.all:zoneName(z);b.addEventListener('click',function(){state.zone=z;syncUrl();renderZones();renderResults()});root.appendChild(b)})}
function matches(p){if(p.territoryId!==territoryId)return false;if(state.need&&p.need!==state.need)return false;if(state.zone==='all')return true;return p.mainZone===state.zone||(p.zones||[]).indexOf(state.zone)>=0}
function contactsOf(p){if(p.contacts&&p.contacts.length)return p.contacts;return p.url?[{label:T[lang].profile,url:p.url}]:[]}
function renderResults(){var root=document.getElementById('results'),tr=T[lang],list=state.pros.filter(matches).sort(function(a,b){return (a.rank||50)-(b.rank||50)||a.name.localeCompare(b.name)});document.getElementById('status').textContent=list.length+' '+tr.results;root.innerHTML='';if(!list.length){var e=document.createElement('div');e.className='empty';e.textContent=tr.empty;root.appendChild(e);return}list.forEach(function(p){var c=document.createElement('article');c.className='card';var h=document.createElement('h3');h.textContent=p.name;var s=document.createElement('p');s.className='summary';s.textContent=label(p.summary)||((p.services||[]).join(' · '));var m=document.createElement('div');m.className='meta';m.textContent='📍 '+tr.based+' '+zoneName(p.mainZone)+'\n🚐 '+tr.serves+' '+((p.zones||[]).map(zoneName).join(' · ')||tr.all);m.style.whiteSpace='pre-line';var sv=document.createElement('div');sv.className='services';(p.services||[]).forEach(function(x){var sp=document.createElement('span');sp.className='service';sp.textContent=x;sv.appendChild(sp)});var ac=document.createElement('div');ac.className='actions';contactsOf(p).forEach(function(x){var a=document.createElement('a');a.href=x.url;a.textContent=x.label||tr.profile;if(/^https?:/.test(x.url)){a.target='_blank';a.rel='noopener noreferrer'}ac.appendChild(a)});c.append(h,s,m,sv,ac);root.appendChild(c)})}
function render(){renderHeader();renderNeeds();renderZones();renderResults()}
document.querySelectorAll('[data-lang]').forEach(function(b){b.addEventListener('click',function(){lang=b.dataset.lang;try{localStorage.setItem('digiy-lang',lang)}catch(e){}syncUrl();render()})});
if(!TERRITORIES[territoryId])territoryId='petite-cote';render();loadLive().then(render).catch(function(){state.live=false;render()});
})();
</script>
</body>
