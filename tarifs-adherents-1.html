function render(){const d=T[lang()]||T.fr,p=PRICES[countryId];document.documentElement.dir=lang()==='ar'?'rtl':'ltr';['kicker','h1','lead','freeKicker','freeTitle','freeText','pathTitle','pathText','sheet','sheetRequired','sheetText','sheetPeriod','sheetOwnership','member','memberAfter','memberText','memberPeriod','memberNote','site','siteOptional','siteText','sitePeriod','siteNote','ruleTitle','rule','back','hub'].forEach(k=>document.getElementById(k).textContent=d[k]);document.getElementById('freePriceLabel').textContent=d.freePrice;d.benefits.forEach((x,i)=>document.getElementById('benefit'+(i+1)).textContent=x);document.getElementById('freeCta').textContent=d.freeCta;document.getElementById('seeCard').textContent=d.seeCard;document.getElementById('sheetPrice').textContent=p.sheet;document.getElementById('memberPrice').textContent=p.pro;document.getElementById('memberPeriod').textContent=d.memberPeriod+(p.proExtra?' · '+p.proExtra:'');document.getElementById('sitePrice').textContent=p.site;document.getElementById('sheetItems').innerHTML=d.sheetItems.map(x=>'<li>✓ '+x+'</li>').join('');document.getElementById('memberItems').innerHTML=d.memberItems.map(x=>'<li>✓ '+x+'</li>').join('');document.getElementById('siteItems').innerHTML=d.siteItems.map(x=>'<li>✓ '+x+'</li>').join('');document.getElementById('freeCta').href='/carte-gratuite.html?country='+countryId.toLowerCase();document.querySelectorAll('[data-country]').forEach(b=>{const on=b.dataset.country===countryId;b.classList.toggle('active',on);b.setAttribute('aria-pressed',on?'true':'false')});try{localStorage.setItem('digiy_country',countryId)}catch(_){}const u=new URL(location.href);u.searchParams.set('country',countryId.toLowerCase());history.replaceState(null,'',u)}
