  if(!lang){try{lang=localStorage.getItem('digiy-lang')}catch(e){}}
  if(/^(fr|en|es|pt|it|de|nl|ar)$/.test(lang||''))target.searchParams.set('lang',lang);
  location.replace(target.href);
})();
</script>
