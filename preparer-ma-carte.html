<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#06140f">
<title>DIGIYLYFE — Préparer mon dossier</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#06140f;color:#fffaf0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center}p{font-weight:900}</style>
</head>
<body>
<p>DIGIYLYFE · préparation du dossier…</p>
<script>
(function(){
  'use strict';
  var q=new URLSearchParams(location.search);
  var carnet=(q.get('product')||'').toLowerCase()==='carnet-pro';
  var territory=(q.get('territory')||'').toLowerCase();
  var dakar=territory==='dakar';
  var bordeaux=territory==='bordeaux';
  var dordogne=territory==='vallee-dordogne';
  var petiteCote=territory==='petite-cote';
  fetch('/preparer-ma-carte-core-20260824.html?v=20260824-carnet-v1',{cache:'no-store'})
    .then(function(r){if(!r.ok)throw new Error('load '+r.status);return r.text();})
    .then(function(h){
      var forceCarnet=carnet?'<style data-carnet-force-minimal>label:has(#territory),label:has(#baseZone),label:has(#photo),#pendingZoneWrap,#countryMeta,#geoTitle,#coverageTitle,label:has(#wholeTerritory),#zonesLead,#serviceZones,.services,.extra{display:none!important}</style>':'';
      var tariffLayout=!carnet?'<style data-digiy-tariff-layout>.digiy-tariff-row{display:grid!important;grid-template-columns:minmax(0,1.55fr) minmax(160px,.75fr)!important;gap:12px!important;padding:12px!important;border:1px solid #ffffff1f!important;border-radius:14px!important;background:#ffffff05!important}.digiy-tariff-row label{display:grid!important;gap:7px!important;min-width:0!important}.digiy-tariff-label,.digiy-tariff-price-label{display:block!important;line-height:1.25!important}.digiy-price-wrap{display:block!important;position:relative!important}.digiy-price-wrap input{padding-right:68px!important}.digiy-currency{right:12px!important;white-space:nowrap!important}@media(max-width:640px){.digiy-tariff-row{grid-template-columns:1fr!important;gap:10px!important}.digiy-tariff-rows{gap:12px!important}}</style>':'';
      if(dakar){
        h=h.replace("const RUNTIME_URL='/assets/digiy-adhesion-runtime-v1.json';","const RUNTIME_URL='/assets/digiy-adhesion-runtime-dakar-v1.json?v=20260826';");
      }else if(bordeaux){
        h=h.replace("const RUNTIME_URL='/assets/digiy-adhesion-runtime-v1.json';","const RUNTIME_URL='/assets/digiy-adhesion-runtime-bordeaux-v1.json?v=20260826';");
      }else if(dordogne){
        h=h.replace("const RUNTIME_URL='/assets/digiy-adhesion-runtime-v1.json';","const RUNTIME_URL='/assets/digiy-adhesion-runtime-dordogne-v1.json?v=20260826';");
      }
      if(!carnet){
        var baseNeedle="service_4:$('#s4').value.trim()||null,photo_path:pp";
        var baseReplacement="service_4:$('#s4').value.trim()||null,indicative_tariffs:(window.DIGIY_INDICATIVE_TARIFFS?window.DIGIY_INDICATIVE_TARIFFS():[]),photo_path:pp";
        var adminNeedle="if(base.service_4)lines.push('4. '+base.service_4);\n  lines.push('','Option : '+option);";
        var adminReplacement="if(base.service_4)lines.push('4. '+base.service_4);\n  if(Array.isArray(base.indicative_tariffs)&&base.indicative_tariffs.length){lines.push('','TARIFS INDICATIFS');base.indicative_tariffs.forEach(function(tariff,i){var cur=tariff.currency_code==='XOF'?'FCFA':tariff.currency_code==='EUR'?'€':(tariff.currency_code||'');lines.push((i+1)+'. '+tariff.label+' : '+tariff.price+(cur?' '+cur:''));});}\n  lines.push('','Option : '+option);";
        if(h.indexOf(baseNeedle)===-1||h.indexOf(adminNeedle)===-1)throw new Error('tariff integration marker missing');
        h=h.replace(baseNeedle,baseReplacement).replace(adminNeedle,adminReplacement);
      }
      var addon='';
      if(!carnet)addon+='<script src="/assets/digiy-indicative-tariffs-v1.js?v=20260827-v2"><\/script>';
      addon+='<script src="/assets/digiy-dossier-carnet-v1.js?v=20260824-carnet-minimal-v3"><\/script>';
      if(dakar)addon+='<script src="/assets/digiy-dossier-prefill-dakar-v1.js?v=20260826"><\/script>';
      if(bordeaux)addon+='<script src="/assets/digiy-dossier-prefill-bordeaux-v1.js?v=20260826"><\/script>';
      if(dordogne)addon+='<script src="/assets/digiy-dossier-prefill-dordogne-v1.js?v=20260826"><\/script>';
      if(petiteCote)addon+='<script src="/assets/digiy-dossier-prefill-petite-cote-v1.js?v=20260826"><\/script>';
      h=h.replace(/<\/head>/i,forceCarnet+tariffLayout+'</head>');
      h=h.replace(/<\/body>/i,addon+'</body>');
      document.open();
      document.write(h);
      document.close();
    })
    .catch(function(){
      document.body.innerHTML='<main style="padding:24px"><h1>DIGIYLYFE</h1><p>Le dossier n’a pas pu être chargé. Rechargez cette page.</p><p><a href="https://digiylyfe.com/" style="color:#f6c453">← Retour DIGIYLYFE</a></p></main>';
    });
})();
</script>
</body>
</html>
