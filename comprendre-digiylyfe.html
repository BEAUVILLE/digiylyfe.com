<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Comprendre DIGIYLYFE en trois images : les activités locales, une interface simple et le contact direct."><title>DIGIYLYFE — Le territoire en trois regards</title><style>
*{box-sizing:border-box}body{margin:0;background:#071810;color:#f4f6ee;font:15px system-ui,sans-serif}main{max-width:540px;margin:auto;padding:10px 12px calc(14px + env(safe-area-inset-bottom))}header{display:flex;justify-content:space-between;align-items:center;padding:4px 0 10px;font-size:12px;letter-spacing:.08em}header strong{color:#c7ef80}#stage{position:relative;aspect-ratio:9/16;background:#073d2b;overflow:hidden;border-radius:5px;width:min(100%,calc((100svh - 225px)*9/16));margin:auto}#stage img{position:absolute;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .75s ease}#stage img.active{opacity:1}.controls{display:flex;gap:8px;margin-top:10px}button,select{font:inherit;border:1px solid #547148;border-radius:10px;background:#133422;color:white;min-height:44px;padding:9px 12px}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}#play{flex:1;background:#c7ef80;color:#0b2515;font-weight:750}#status{min-height:18px;font-size:12px;margin:8px 0;color:#d0dacb}details{font-size:12px;color:#b6c6b0}summary{cursor:pointer;padding:4px 0}select{width:100%;margin:8px 0}details p{line-height:1.5}button:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #ffe488;outline-offset:2px}@media(prefers-reduced-motion:reduce){#stage img{transition:none}}
</style></head><body><main><header><a href="/#comment-ca-marche" style="color:#c7ef80;text-decoration:none">‹ Retour à DIGIYLYFE</a><span id="count">1 / 3</span></header><div id="stage" aria-label="Diaporama DIGIYLYFE"><img class="active" src="/assets/serie-mobile/01.webp" decoding="async" alt="Voir l’essentiel simplement" width="941" height="1672"><img class="" src="/assets/serie-mobile/02.webp" decoding="async" alt="L’interface du territoire" width="941" height="1672"><img class="" src="/assets/serie-mobile/03.webp" decoding="async" alt="Ce qui travaille derrière" width="941" height="1672"></div><div class="controls"><button id="prev" aria-label="Diapo précédente">‹</button><button id="play">▶ Écouter la série</button><button id="next" aria-label="Diapo suivante">›</button></div><p id="status" role="status" aria-live="polite">Appuyez sur Écouter pour démarrer.</p><a id="zoom" href="/assets/serie-mobile/01.webp" target="_blank" rel="noopener" style="display:inline-block;color:#c7ef80;font-size:12px;padding:8px 0">Agrandir l’image</a><details><summary>Choisir la voix</summary><label for="voice">Voix française du téléphone</label><select id="voice"><option value="">Voix française automatique</option></select><p>Ce lecteur reprend le principe du lecteur d’Aly : votre appareil lit la nouvelle narration. Le timbre dépend de la voix choisie. Gardez cette page ouverte pendant l’écoute.</p></details></main><script>
'use strict';
const TEXTS=["Sur votre téléphone, vous voyez l’essentiel : un besoin, un professionnel près de vous, un contact direct. DIGIYLYFE simplifie la recherche pour vous aider à trouver votre réponse sur le territoire.", "À Saly, Ngaparou, Somone ou Mbour, les besoins rencontrent les activités locales. DIGIYLYFE leur donne une place pour être trouvées. Vous choisissez votre interlocuteur, puis vous échangez directement avec lui.", "Derrière cette interface, une organisation relie les fiches, les outils et les territoires. Elle soutient la présence des professionnels et facilite l’accès au contact. La relation reste humaine et directe, avec zéro commission DIGIYLYFE sur vos transactions."];
const images=[...document.querySelectorAll('#stage img')],play=document.querySelector('#play'),prev=document.querySelector('#prev'),next=document.querySelector('#next'),status=document.querySelector('#status'),select=document.querySelector('#voice');
const synth=window.speechSynthesis;
let cur=0,playing=false,token=0,timer=null,utterance=null,voices=[],done=false;
function show(n){cur=n;images.forEach((img,i)=>{img.classList.toggle('active',i===cur);img.setAttribute('aria-hidden',i===cur?'false':'true')});document.querySelector('#count').textContent=`${cur+1} / 3`;document.querySelector('#zoom').href=images[cur].src;prev.disabled=cur===0;next.disabled=cur===2;}
function stop(message='Lecture arrêtée. Reprenez cette diapo quand vous voulez.') {token++;clearTimeout(timer);playing=false;if(synth)synth.cancel();utterance=null;play.textContent='▶ Reprendre cette diapo';status.textContent=message;}
function loadVoices(){if(!synth)return;const previous=select.value;voices=synth.getVoices().filter(v=>/^fr(?:-|_|$)/i.test(v.lang));select.replaceChildren(new Option('Voix française automatique',''));voices.forEach(v=>select.add(new Option(v.name,v.voiceURI)));let saved='';try{saved=localStorage.getItem('digiy_series_voice')||''}catch{}const best=voices.find(v=>v.voiceURI===(previous||saved))||voices.find(v=>/Thomas/i.test(v.name))||voices.find(v=>v.lang==='fr-FR')||voices[0];if(best)select.value=best.voiceURI;}
function speak(){if(!synth||!window.SpeechSynthesisUtterance){status.textContent='Ouvrez ce fichier dans un navigateur avec lecture vocale pour écouter la série.';return;}
 const id=++token;clearTimeout(timer);synth.cancel();playing=true;done=false;play.textContent='■ Arrêter';status.textContent='Préparation de la voix…';
 utterance=new SpeechSynthesisUtterance(TEXTS[cur]);const chosen=voices.find(v=>v.voiceURI===select.value);if(chosen)utterance.voice=chosen;utterance.lang=chosen?.lang||'fr-FR';utterance.rate=.95;utterance.pitch=1;
 utterance.onstart=()=>{if(id===token)status.textContent=`Lecture de la diapo ${cur+1} sur 3…`};
 utterance.onend=()=>{if(id!==token||!playing)return;if(cur<2){timer=setTimeout(()=>{if(id!==token||!playing)return;show(cur+1);speak()},650)}else{playing=false;done=true;utterance=null;play.textContent='↻ Réécouter la série';status.textContent='DIGIYLYFE. Votre place dans le village numérique.'}};
 utterance.onerror=e=>{if(id!==token)return;stop('La voix n’a pas démarré. Choisissez une voix française, puis relancez la lecture.');};
 synth.speak(utterance);
}
play.onclick=()=>{if(playing){stop();return}if(done)show(0);speak()};
function move(n){stop('Diapo prête. Appuyez sur Écouter.');done=false;show(Math.max(0,Math.min(2,n)));play.textContent='▶ Écouter dès cette diapo'}
prev.onclick=()=>move(cur-1);next.onclick=()=>move(cur+1);
select.onchange=()=>{const restart=playing;stop('Voix sélectionnée. Appuyez sur Écouter.');try{localStorage.setItem('digiy_series_voice',select.value)}catch{}if(restart)speak()};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing)stop('Lecture interrompue. Appuyez sur Reprendre.')});
window.addEventListener('pagehide',()=>stop());
if(synth){loadVoices();synth.addEventListener('voiceschanged',loadVoices)}else{play.disabled=true;status.textContent='La lecture vocale nécessite un navigateur compatible.'}show(0);
</script></body></html>
