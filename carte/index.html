<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DIGIYLYFE — Carte de visite interactive</title>
<link rel="canonical" href="https://digiylyfe.com/carte/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://digiylyfe.com/carte/">
<meta property="og:title" content="DIGIYLYFE — Votre écosystème digital local">
<meta property="og:description" content="Local · Direct · 0 % commission · Sénégal | France">
<meta property="og:image" content="https://digiylyfe.com/carte-visite-digiy.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://digiylyfe.com/carte-visite-digiy.png">
<style>
html,body{margin:0;height:100%;background:#03120d;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#fff}
body{display:flex;flex-direction:column;min-height:100dvh}
iframe{width:100%;flex:1;border:0;display:block;background:#03120d}
.phoneHelp{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:9px 12px calc(9px + env(safe-area-inset-bottom));background:#061a12;border-top:1px solid rgba(246,196,83,.35);font-size:12px;font-weight:900}
#phoneText{color:#fff1bd}
#copyPhone{border:1px solid rgba(246,196,83,.55);background:rgba(246,196,83,.14);color:#fff;border-radius:999px;padding:8px 12px;font:inherit;cursor:pointer}
#copyPhone.done{background:#25D366;color:#04120d}
</style>
</head>
<body>
<iframe id="cardFrame" src="/carte.index.html" title="Carte de visite interactive DIGIYLYFE"></iframe>
<div class="phoneHelp">
  <span>📞 Si l’appel ne s’ouvre pas :</span>
  <span id="phoneText">numéro disponible sur la carte</span>
  <button type="button" id="copyPhone">📋 Copier le numéro</button>
</div>
<script>
(function(){
  var frame=document.getElementById('cardFrame');
  var phoneText=document.getElementById('phoneText');
  var copyBtn=document.getElementById('copyPhone');
  var phone='';
  frame.addEventListener('load',function(){
    try{
      var link=frame.contentDocument.querySelector('a[href^="tel:"]');
      if(link){
        phone=(link.getAttribute('href')||'').replace(/^tel:/,'');
        phoneText.textContent=phone;
      }
    }catch(e){}
  });
  copyBtn.addEventListener('click',async function(){
    if(!phone)return;
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText){
        await navigator.clipboard.writeText(phone);
      }else{
        var ta=document.createElement('textarea');
        ta.value=phone;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();
      }
      copyBtn.textContent='✅ Numéro copié';
      copyBtn.classList.add('done');
      setTimeout(function(){copyBtn.textContent='📋 Copier le numéro';copyBtn.classList.remove('done');},1600);
    }catch(e){phoneText.textContent=phone;}
  });
})();
</script>
</body>
</html>
