<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Atelier SITE — brouillon</title><style>body{font:17px system-ui;background:#121914;color:#eee;margin:0}main{max-width:760px;margin:auto;padding:24px}label{display:block;margin:12px 0}input,select,textarea,button{box-sizing:border-box;width:100%;padding:12px;font:inherit;border:1px solid #777;border-radius:8px}button{background:#dfbd65;color:#141414;font-weight:bold;margin:8px 0}button:disabled{opacity:.4}pre{white-space:pre-wrap;overflow-wrap:anywhere}a{color:#dfbd65}</style></head><body><main><h1>MASTER SITE · Atelier brouillon</h1><p>Session atelier existante obligatoire. Aucune publication. Les données de la carte et du dossier restent inchangées.</p><p><a href="ADHESIONS-ATELIER-DIGIYLYFE-V1.html">Retour aux adhésions / connexion atelier</a></p><form id="form"><label>ID dossier adhésion<input id="dossier" required autocomplete="off"></label><label>Famille MASTER (choix humain)<select id="family"><option value="service">Service / artisan</option><option value="commerce">Commerce</option><option value="lieu">Lieu / tourisme</option><option value="visuel">Beauté / restauration / visuel</option></select></label><button type="button" id="load">Charger le dossier validé</button><p id="status" role="status"></p><label>Slug du site<input id="slug" required pattern="[a-z0-9]+(-[a-z0-9]+)*"></label><label>URL HTTPS image permanente (facultative)<input id="hero" type="url"></label><label>URL HTTPS vidéo directe (facultative)<input id="video" type="url"></label><label>Lien dossier Drive public (facultatif)<input id="drive" type="url"></label><label>Lien Google Maps (facultatif)<input id="maps" type="url"></label><label>URL publique carte (facultative)<input id="card" type="url"></label><button id="generate" type="submit" disabled>Préparer client.json brouillon</button></form><h2>Aperçu JSON privé à l'atelier</h2><pre id="preview"></pre><label><input id="review" type="checkbox" style="width:auto" disabled> J'ai contrôlé le brouillon et les liens ; je comprends que cet export ne publie rien.</label><button id="download" disabled>Exporter le brouillon</button></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script type="module">
import {buildSite} from './site-bridge.mjs';
const $=id=>document.getElementById(id);
const sb=window.supabase.createClient('https://wesqmwjjtsefyjnluosj.supabase.co','sb_publishable_tGHItRgeWDmGjnd0CK1DVQ_BIep4Ug3');
let dossier=null,draft=null,epoch=0;
const status=s=>{$('status').textContent=s;};
function clearDraft(){draft=null;$('preview').textContent='';$('review').checked=false;$('review').disabled=true;$('download').disabled=true;}
function clearSource(){epoch++;dossier=null;$('generate').disabled=true;clearDraft();}
$('dossier').addEventListener('input',clearSource);$('family').addEventListener('change',clearSource);
for(const id of ['slug','hero','video','drive','maps','card'])$(id).addEventListener('input',clearDraft);
$('load').onclick=async()=>{clearSource();const request=epoch;$('load').disabled=true;try{
 const {data:{session}}=await sb.auth.getSession();if(!session)throw Error('Session atelier absente.');
 // Existing authorized card reader, not a SITE publication authorization.
 const {data,error}=await sb.functions.invoke('digiy-adhesion-card-bridge',{body:{id:$('dossier').value.trim(),purpose:'card',format:'unifie',master_type:$('family').value}});
 if(request!==epoch)return;
 if(error||data?._version!=='V1-UNIFIE')throw Error('Lecture du dossier refusée ou indisponible.');
 if(data.site?.demande!==true||!['en_cours','livre'].includes(data.site.statut))throw Error('Prestation SITE non en cours / livrée.');
 if(data.validation?.dossier!=='valide')throw Error('Dossier non validé.');
 dossier=data;$('slug').value=data.identifiant||'';$('generate').disabled=false;
 status('Dossier chargé. Vérifier les textes FR validés et les liens permanents. Aucune photo temporaire importée.');
 }catch(e){if(request===epoch)status(e.message);}finally{$('load').disabled=false;}};
function permanent(s){if(!s)return '';const u=new URL(s);if(u.pathname.includes('/storage/v1/object/sign/')||u.searchParams.has('token'))throw Error('URL temporaire interdite.');return s;}
$('form').onsubmit=e=>{e.preventDefault();clearDraft();try{if(!dossier)throw Error('Charger le dossier.');draft=buildSite(dossier,{slug:$('slug').value,sector:({service:'service',commerce:'commerce',lieu:'tourisme',visuel:'beaute'})[$('family').value],media:{hero_image:permanent($('hero').value),hero_video:permanent($('video').value),drive_folder:permanent($('drive').value)},maps:permanent($('maps').value),card_url:permanent($('card').value)});$('preview').textContent=JSON.stringify(draft,null,2);$('review').disabled=false;status('Brouillon généré. Contrôle humain requis.');}catch(e){status(e.message);}};
$('review').onchange=()=>{$('download').disabled=!draft||!$('review').checked;};
$('download').onclick=()=>{if(!draft||!$('review').checked)return;const u=URL.createObjectURL(new Blob([JSON.stringify(draft,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='client.brouillon.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);};
</script></body></html>
