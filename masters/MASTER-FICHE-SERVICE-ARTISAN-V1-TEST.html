<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>MASTER FICHE SERVICE / ARTISAN — DIGIYLYFE</title>
<style>
:root{--a:#126b43;--b:#e4b84b;--ink:#10251c;--muted:#66746d;--bg:#fff9ef;--line:#00000016}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,var(--bg),#efe6d6);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}a{text-decoration:none;color:inherit}button{font:inherit}.wrap{width:min(1040px,calc(100% - 24px));margin:auto}.top{position:sticky;top:0;z-index:20;background:#fffdf8ef;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.topin{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-weight:1000;color:var(--a)}.langs{display:flex;gap:4px;flex-wrap:wrap}.langs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 10px;font-weight:900}.langs button.active{background:var(--a);color:#fff}.hero{padding:18px 0 10px}.heroCard{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;align-items:center;background:linear-gradient(135deg,var(--a),#073828);color:#fff;border-radius:32px;padding:24px;box-shadow:0 22px 55px #0002}.photo,.secondaryPhoto{width:100%;object-fit:cover;border-radius:24px;background:#ffffff18}.photo{aspect-ratio:4/3}.secondaryPhoto{aspect-ratio:16/10}.kicker{font-size:.8rem;font-weight:1000;text-transform:uppercase;color:#ffe8a5}.hero h1{font-size:clamp(2.2rem,7vw,4.8rem);line-height:.92;margin:8px 0}.lead{line-height:1.55;color:#ffffffdf}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btn{border:0;border-radius:999px;padding:12px 16px;font-weight:1000;background:#fff;color:#123}.btn.main{background:linear-gradient(135deg,#fff0b4,var(--b));color:#2d2108}.btn.site{background:#0b2f21;color:#fff;border:1px solid #ffffff44}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:14px;padding:10px 0 28px}.panel{background:#ffffffdc;border:1px solid var(--line);border-radius:28px;padding:20px;box-shadow:0 12px 32px #0001}.panel h2{margin:0 0 12px;color:var(--a)}.services{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.service{padding:14px;border-radius:17px;background:#126b4311;border:1px solid #126b431c;font-weight:900}.qr{text-align:center}.qr img{width:min(230px,100%);padding:10px;background:#fff;border-radius:18px}.note{color:var(--muted);line-height:1.55}.foot{padding:10px 0 40px;text-align:center;color:var(--muted);font-size:.85rem}@media(max-width:760px){.heroCard,.grid{grid-template-columns:1fr}.heroCard{padding:18px}.services{grid-template-columns:1fr}.topin{align-items:flex-start;padding:8px 0;flex-direction:column}.langs{width:100%}}
</style>
</head>
<body>
<header class="top"><div class="wrap topin"><div class="brand">DIGIYLYFE · SERVICE / ARTISAN</div><div class="langs" id="langs"></div></div></header>
<main class="wrap">
<section class="hero"><div class="heroCard"><div><div class="kicker" id="kicker"></div><h1 id="name"></h1><p class="lead" id="lead"></p><div class="actions"><a class="btn main" id="wa">💬 WhatsApp</a><a class="btn" id="call">📞 Appeler</a><button class="btn" id="share">📤 Partager</button><a class="btn site" id="site" target="_blank" rel="noopener">🌐 Voir le site</a></div></div><img class="photo" id="photo" alt="Photo professionnelle"></div></section>
<section class="grid"><div><article class="panel"><h2>Services</h2><div class="services" id="services"></div></article><article class="panel" style="margin-top:14px"><h2>À propos</h2><p class="note" id="about"></p></article><article class="panel" id="secondaryPanel" style="margin-top:14px"><h2>En image</h2><img class="secondaryPhoto" id="secondaryPhoto" alt="Photo secondaire"></article></div><aside><article class="panel"><h2>Zone</h2><p id="zone" class="note"></p><p class="note"><strong>Contact direct · Paiement direct · 0 % commission DIGIYLYFE.</strong></p></article><article class="panel qr" style="margin-top:14px" id="qrPanel"><h2>QR</h2><img id="qr" alt="QR fiche"><p class="note" id="url"></p></article></aside></section>
</main><footer class="foot">MASTER TEST · 2 photos maximum · validation humaine obligatoire</footer>
<script>
const FICHE={published:false,subscriptionActive:false,name:'PROFESSIONNEL EXEMPLE',phone:'+221000000000',whatsapp:'+221000000000',photoUrl:'',secondaryPhotoUrl:'',finalUrl:'',qrUrl:'',siteUrl:'',ficheColor:'#126b43',ficheColor2:'#e4b84b',languages:['fr','en','es','pt','it','de','nl','ar'],i18n:{fr:{job:'Artisan / Service',zone:'Zone générale',lead:'Présentation courte validée par le professionnel.',about:'Ici vient la présentation complète du professionnel, sans texte inventé.',services:['Service 1','Service 2','Service 3','Service 4']},en:{job:'Trade / Service',zone:'General area',lead:'Short presentation approved by the professional.',about:'Full professional presentation goes here.',services:['Service 1','Service 2','Service 3','Service 4']}}};
const $=s=>document.querySelector(s),LANGS=FICHE.languages||['fr'];let lang=new URLSearchParams(location.search).get('lang')||'fr';if(!LANGS.includes(lang))lang='fr';document.documentElement.style.setProperty('--a',FICHE.ficheColor||'#126b43');document.documentElement.style.setProperty('--b',FICHE.ficheColor2||'#e4b84b');
function data(){return FICHE.i18n?.[lang]||FICHE.i18n?.fr||{}}function cleanPhone(x){return String(x||'').replace(/\D/g,'')}
function fallback(){return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650"><rect width="100%" height="100%" fill="${FICHE.ficheColor||'#126b43'}"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="white" font-size="48" font-family="Arial">PHOTO</text></svg>`)}
function render(){const d=data();document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';$('#name').textContent=FICHE.name||'';$('#kicker').textContent=[d.job,d.zone].filter(Boolean).join(' · ');$('#lead').textContent=d.lead||'';$('#about').textContent=d.about||'';$('#zone').textContent=d.zone||'';$('#services').innerHTML=(d.services||[]).map(x=>`<div class="service">${String(x)}</div>`).join('');$('#photo').src=FICHE.photoUrl||fallback();if(FICHE.secondaryPhotoUrl){$('#secondaryPhoto').src=FICHE.secondaryPhotoUrl}else{$('#secondaryPanel').style.display='none'}$('#wa').href='https://wa.me/'+cleanPhone(FICHE.whatsapp);$('#call').href='tel:'+FICHE.phone;$('#url').textContent=FICHE.finalUrl||'';if(FICHE.siteUrl){$('#site').href=FICHE.siteUrl}else{$('#site').style.display='none'}if(FICHE.qrUrl){$('#qr').src=FICHE.qrUrl}else{$('#qrPanel').style.display='none'}document.querySelectorAll('[data-l]').forEach(b=>b.classList.toggle('active',b.dataset.l===lang));}
$('#langs').innerHTML=LANGS.map(l=>`<button data-l="${l}">${l.toUpperCase()}</button>`).join('');document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{lang=b.dataset.l;history.replaceState(null,'','?lang='+lang);render()});$('#share').onclick=async()=>{const u=FICHE.finalUrl||location.href;try{if(navigator.share)await navigator.share({title:FICHE.name,url:u});else await navigator.clipboard.writeText(u)}catch{}};render();
</script>
</body></html>
