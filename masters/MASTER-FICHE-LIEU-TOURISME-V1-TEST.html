<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>MASTER FICHE LIEU / TOURISME — DIGIYLYFE</title>
<style>
:root{--a:#315b43;--b:#c99743;--ink:#25190f;--muted:#705b48;--bg:#fffaf1;--line:#00000016}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,var(--bg),#ead4ad);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}a{text-decoration:none;color:inherit}button{font:inherit}.wrap{width:min(1120px,calc(100% - 24px));margin:auto}.top{position:sticky;top:0;z-index:20;background:#fffaf1ed;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.topin{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-weight:1000;color:var(--a)}.langs{display:flex;gap:4px;flex-wrap:wrap}.langs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 10px;font-weight:900}.langs button.active{background:var(--a);color:#fff}.hero{padding:18px 0 10px}.heroCard{position:relative;overflow:hidden;min-height:520px;border-radius:36px;display:flex;align-items:flex-end;padding:32px;color:#fff;background:#25190f;box-shadow:0 24px 60px #0003}.heroCard>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}.heroCard:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0001,#000b);z-index:1}.heroCopy{position:relative;z-index:2;max-width:760px}.kicker{font-size:.8rem;font-weight:1000;text-transform:uppercase;color:#ffe8ac}.hero h1{font-family:Georgia,serif;font-size:clamp(2.5rem,8vw,5.4rem);line-height:.9;margin:8px 0}.lead{line-height:1.55;color:#ffffffed}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btn{border:0;border-radius:999px;padding:12px 16px;font-weight:1000;background:#fff;color:#321}.btn.main{background:linear-gradient(135deg,#fff1bd,var(--b));color:#2d2107}.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.fact,.section{background:#ffffffdc;border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 12px 32px #0001}.fact strong{display:block;color:var(--a);font-size:1.05rem}.fact span{display:block;color:var(--muted);margin-top:5px;font-size:.9rem}.section{margin:14px 0}.section h2{margin:0 0 12px;color:var(--a)}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.gallery img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:16px}.pricing{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.price{padding:14px;border-radius:18px;background:#315b4310;border:1px solid #315b4320}.price strong{display:block;color:var(--a)}.note{color:var(--muted);line-height:1.55}.bottom{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.qr{text-align:center}.qr img{width:min(220px,100%);padding:10px;background:#fff;border-radius:18px}.foot{padding:10px 0 40px;text-align:center;color:var(--muted);font-size:.85rem}@media(max-width:780px){.facts{grid-template-columns:1fr 1fr}.gallery{grid-template-columns:1fr 1fr}.bottom{grid-template-columns:1fr}.heroCard{min-height:430px;padding:20px}.topin{align-items:flex-start;padding:8px 0;flex-direction:column}.langs{width:100%}}@media(max-width:520px){.facts,.pricing{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top"><div class="wrap topin"><div class="brand">DIGIYLYFE · LIEU / TOURISME</div><div class="langs" id="langs"></div></div></header>
<main class="wrap">
<section class="hero"><div class="heroCard"><img id="photo" alt="Photo du lieu"><div class="heroCopy"><div class="kicker" id="kicker"></div><h1 id="name"></h1><p class="lead" id="lead"></p><div class="actions"><a class="btn main" id="wa">💬 Demande directe</a><a class="btn" id="call">📞 Appeler</a><button class="btn" id="share">📤 Partager</button></div></div></div></section>
<section class="facts" id="facts"></section>
<section class="section" id="galleryPanel"><h2 id="galleryTitle">Le lieu en images</h2><div class="gallery" id="gallery"></div></section>
<section class="section" id="pricingPanel"><h2 id="pricingTitle">Tarifs / Conditions</h2><div class="pricing" id="pricing"></div></section>
<section class="bottom"><article class="section"><h2 id="aboutTitle">À propos du lieu</h2><p class="note" id="about"></p><p class="note" id="contactNote"></p><p class="note"><strong>Demande directe · Paiement direct · 0 % commission DIGIYLYFE.</strong></p></article><aside class="section qr" id="qrPanel"><h2>QR</h2><img id="qr" alt="QR fiche"><p class="note" id="url"></p></aside></section>
</main><footer class="foot">MASTER TEST · disponibilités et tarifs uniquement s'ils sont validés · validation humaine obligatoire</footer>
<script>
const FICHE={published:false,subscriptionActive:false,name:'LIEU EXEMPLE',phone:'+221000000000',whatsapp:'+221000000000',photoUrl:'',finalUrl:'',qrUrl:'',ficheColor:'#315b43',ficheColor2:'#c99743',languages:['fr','en','es','pt','it','de','nl','ar'],i18n:{fr:{job:'Lieu / Hébergement',zone:'Zone générale',lead:'Promesse et présentation courte validées par le lieu.',about:'Présentation complète du lieu, sans texte inventé.'},en:{job:'Place / Accommodation',zone:'General area',lead:'Short promise and presentation approved by the host.',about:'Full place presentation goes here.'}},facts:[{label:'Type',value:'À préciser'},{label:'Capacité',value:'À préciser'},{label:'Accès',value:'À préciser'},{label:'Zone',value:'À préciser'}],gallery:[],pricing:[],contactNote:''};
const $=s=>document.querySelector(s),LANGS=FICHE.languages||['fr'];let lang=new URLSearchParams(location.search).get('lang')||'fr';if(!LANGS.includes(lang))lang='fr';document.documentElement.style.setProperty('--a',FICHE.ficheColor||'#315b43');document.documentElement.style.setProperty('--b',FICHE.ficheColor2||'#c99743');
function data(){return FICHE.i18n?.[lang]||FICHE.i18n?.fr||{}}function cleanPhone(x){return String(x||'').replace(/\D/g,'')}function photoFallback(){return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700"><rect width="100%" height="100%" fill="${FICHE.ficheColor||'#315b43'}"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="white" font-size="52" font-family="Arial">PHOTO DU LIEU</text></svg>`)}
function render(){const d=data();document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';$('#name').textContent=FICHE.name||'';$('#kicker').textContent=[d.job,d.zone].filter(Boolean).join(' · ');$('#lead').textContent=d.lead||'';$('#about').textContent=d.about||'';$('#contactNote').textContent=FICHE.contactNote||'';$('#photo').src=FICHE.photoUrl||photoFallback();$('#wa').href='https://wa.me/'+cleanPhone(FICHE.whatsapp);$('#call').href='tel:'+FICHE.phone;$('#url').textContent=FICHE.finalUrl||'';$('#facts').innerHTML=(FICHE.facts||[]).map(x=>`<article class="fact"><strong>${x.label||''}</strong><span>${x.value||''}</span></article>`).join('');const g=FICHE.gallery||[];if(!g.length){$('#galleryPanel').style.display='none'}else{$('#galleryPanel').style.display='block';$('#gallery').innerHTML=g.map(x=>`<img src="${x.url||x}" alt="${x.alt||FICHE.name||''}">`).join('')}const p=FICHE.pricing||[];if(!p.length){$('#pricingPanel').style.display='none'}else{$('#pricingPanel').style.display='block';$('#pricing').innerHTML=p.map(x=>`<div class="price"><strong>${x.label||''}</strong><span>${x.value||''}</span>${x.note?`<p class="note">${x.note}</p>`:''}</div>`).join('')}if(FICHE.qrUrl){$('#qr').src=FICHE.qrUrl}else{$('#qrPanel').style.display='none'}document.querySelectorAll('[data-l]').forEach(b=>b.classList.toggle('active',b.dataset.l===lang));}
$('#langs').innerHTML=LANGS.map(l=>`<button data-l="${l}">${l.toUpperCase()}</button>`).join('');document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{lang=b.dataset.l;history.replaceState(null,'','?lang='+lang);render()});$('#share').onclick=async()=>{const u=FICHE.finalUrl||location.href;try{if(navigator.share)await navigator.share({title:FICHE.name,url:u});else await navigator.clipboard.writeText(u)}catch{}};render();
</script>
</body></html>
