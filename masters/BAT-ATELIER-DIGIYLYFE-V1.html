<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#06140f"><title>DIGIYLYFE — Atelier BAT</title><style>
:root{--bg:#04140f;--ink:#fffaf0;--muted:#cbd8d1;--gold:#f6c453;--green:#22c55e;--red:#ef4444;--orange:#f59e0b;--line:#ffffff24}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#075b32,#04140f 34%);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{width:min(1080px,calc(100% - 22px));margin:auto;padding:16px 0 50px}.hero,.box,.card{border:1px solid var(--line);border-radius:22px;background:rgba(4,20,15,.95);box-shadow:0 18px 48px #0004}.hero,.box{padding:20px;margin-bottom:14px}.hero h1{margin:5px 0 8px;font-size:clamp(32px,7vw,54px)}.note{color:var(--muted);line-height:1.5}.login{display:grid;grid-template-columns:1fr auto;gap:8px}.toolbar,.actions{display:flex;gap:8px;flex-wrap:wrap}.login input,.toolbar input,.batUrl,input.preview{border:1px solid var(--line);border-radius:12px;background:#061b14;color:white;padding:11px;font:inherit}.toolbar input{flex:1;min-width:220px}button,a.btn{border:1px solid var(--line);border-radius:999px;padding:10px 13px;background:#ffffff0d;color:white;font:inherit;font-weight:900;cursor:pointer;text-decoration:none}.primary{background:linear-gradient(135deg,#fff1bd,var(--gold),var(--green));color:#07160f!important}.ok{border-color:#22c55e77!important;background:#22c55e14!important}.warn{border-color:#f59e0b77!important;background:#f59e0b14!important}.danger{border-color:#ef444477!important;background:#ef444416!important}.status{padding:12px;border:1px solid var(--line);border-radius:14px;margin-top:10px}.list{display:grid;gap:12px}.card{padding:16px}.card h2{margin:0}.badges{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0}.badge{border:1px solid var(--line);border-radius:999px;padding:6px 9px;font-size:11px;font-weight:900}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.panel{padding:12px;border:1px solid var(--line);border-radius:15px;background:#ffffff07}.panel b{color:#ffe9a8}.preview{width:100%;margin-top:8px}.batUrl{width:100%;margin-top:8px}.total{font-size:22px;color:#fff1bd;font-weight:1000}.clientNote{white-space:pre-wrap;color:#ffd9d9}.hidden{display:none!important}@media(max-width:700px){.grid,.login{grid-template-columns:1fr}.toolbar{display:grid}.toolbar input{min-width:0}}
</style></head><body><main class="wrap">
<section class="hero"><div style="font-size:11px;font-weight:1000;letter-spacing:.1em;color:#f6c453">ATELIER DIGIYLYFE · BON À TIRER</div><h1>BAT client</h1><p class="note"><strong>Ordre verrouillé :</strong> dossier → préparation → présentation → corrections → BAT accepté → règlement → activation. Le paiement ne peut plus être confirmé avant BAT.</p></section>
<section class="box" id="loginBox"><h2>Connexion atelier</h2><div class="login"><input id="email" type="email" value="baptistejb24@gmail.com" autocomplete="email"><button class="primary" id="sendCode">RECEVOIR LE CODE</button><input id="otp" inputmode="numeric" maxlength="8" placeholder="Code OTP"><button id="verifyCode">VALIDER LE CODE</button></div><div id="loginStatus" class="status">Une session atelier existante sera réutilisée.</div></section>
<section class="box hidden" id="inboxBox"><div class="toolbar"><button class="primary" id="refresh">ACTUALISER</button><input id="search" placeholder="Nom, métier, zone…"><a class="btn" href="./ADHESIONS-ATELIER-DIGIYLYFE-V1.html">← ADHÉSIONS</a><button id="logout">DÉCONNEXION</button></div><div id="summary" class="status">Chargement…</div></section>
<section class="list" id="list"></section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(()=>{'use strict';
const U='https://wesqmwjjtsefyjnluosj.supabase.co',K='sb_publishable_tGHItRgeWDmGjnd0CK1DVQ_BIep4Ug3',sb=window.supabase.createClient(U,K),$=s=>document.querySelector(s);let dossiers=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function pill(label,v){let c=['accepte','confirme','valide','publiee','actif'].includes(v)?'ok':['a_corriger','refuse','refusee','annule'].includes(v)?'danger':'warn';return `<span class="badge ${c}">${esc(label)} : ${esc(v||'—')}</span>`}
function money(v,c){const n=Number(v||0);return c==='EUR'?n.toLocaleString('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0}):n.toLocaleString('fr-FR')+' FCFA'}
function dt(v){return v?new Date(v).toLocaleString('fr-FR'):'—'}
async function session(){return (await sb.auth.getSession()).data.session}
async function call(action,payload={}){const s=await session();if(!s)throw Error('Session atelier absente.');const r=await fetch(U+'/functions/v1/digiy-adhesion-inbox',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.access_token,'apikey':K},body:JSON.stringify({action,...payload})});const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok)throw Error(j.error||j.detail||'Erreur atelier');return j}
async function load(){try{const j=await call('list');dossiers=j.dossiers||[];$('#loginBox').classList.add('hidden');$('#inboxBox').classList.remove('hidden');render()}catch(e){$('#loginStatus').textContent=e.message}}
function batPanel(d){const s=d.bat_snapshot||{},cur=s.currency||d.currency_code||'EUR',total=s.total_amount;let extra='';if(d.bat_status==='a_corriger')extra=`<div class="status danger"><b>CORRECTION CLIENT</b><div class="clientNote">${esc(d.bat_client_note||'')}</div><small>${esc(dt(d.bat_correction_requested_at))}</small></div>`;if(d.bat_status==='accepte')extra=`<div class="status ok"><b>✅ BAT ACCEPTÉ</b> · ${esc(dt(d.bat_approved_at))}${d.bat_client_note?`<div class="clientNote">${esc(d.bat_client_note)}</div>`:''}</div>`;return `<div class="panel"><b>1 · PRÉSENTATION / BAT</b><div class="badges">${pill('BAT',d.bat_status)}${pill('VERSION','v'+(d.bat_version||0))}</div>${Number.isFinite(Number(total))?`<div class="total">TOTAL BAT · ${money(total,cur)}</div>`:''}${extra}<input class="preview" id="pv-${d.id}" type="url" placeholder="https://... version fiche/site à faire valider" value="${esc(d.bat_preview_url||'')}"><div class="actions" style="margin-top:8px"><button class="primary" onclick="sendBat('${d.id}')">${d.bat_status==='a_preparer'?'CRÉER LE BAT':'CRÉER UNE NOUVELLE VERSION BAT'}</button></div><div id="link-${d.id}"></div></div>`}
function payPanel(d){const s=d.bat_snapshot||{},cur=String(s.currency||d.currency_code||'').toUpperCase(),total=Number(s.total_amount),can=d.bat_status==='accepte'&&d.payment_proof_url&&d.payment_status!=='confirme'&&Number.isFinite(total);return `<div class="panel"><b>2 · RÈGLEMENT APRÈS BAT</b><div class="badges">${pill('PAIEMENT',d.payment_status)}${d.payment_proof_url?pill('PREUVE','reçue'):pill('PREUVE','absente')}</div>${d.payment_proof_url?`<a class="btn" target="_blank" rel="noopener" href="${esc(d.payment_proof_url)}">👁 OUVRIR LA PREUVE</a>`:'<p class="note">Le client dépose sa preuve depuis son lien BAT après acceptation.</p>'}${can?`<div class="actions" style="margin-top:10px"><button class="ok" onclick="confirmPayment('${d.id}','${esc(cur)}',${total})">✅ CONFIRMER ${esc(money(total,cur))}</button></div>`:''}${d.payment_status==='confirme'?'<div class="status ok">✅ RÈGLEMENT CONFIRMÉ · activation autorisée selon les autres contrôles.</div>':d.bat_status!=='accepte'?'<div class="status warn">🔒 Paiement bloqué tant que le BAT n’est pas accepté.</div>':''}</div>`}
function render(){const q=$('#search').value.trim().toLowerCase(),rows=dossiers.filter(d=>!q||[d.pro_name,d.job_label,d.zone_label].join(' ').toLowerCase().includes(q));$('#summary').innerHTML=`${rows.length} dossier(s) · <strong>${rows.filter(d=>d.bat_status==='accepte').length} BAT accepté(s)</strong> · ${rows.filter(d=>d.bat_status==='a_corriger').length} correction(s) demandée(s)`;$('#list').innerHTML=rows.map(d=>`<article class="card"><h2>${esc(d.pro_name||'Sans nom')}</h2><div class="note">${esc(d.job_label)} · ${esc(d.zone_label)}</div><div class="badges">${pill('DOSSIER',d.status)}${pill('CARTE/FICHE',d.card_status)}${pill('BAT',d.bat_status)}${pill('PAIEMENT',d.payment_status)}</div><div class="grid">${batPanel(d)}${payPanel(d)}</div></article>`).join('')}
window.sendBat=async id=>{const preview=$('#pv-'+id).value.trim(),out=$('#link-'+id);if(!/^https:\/\//i.test(preview)){out.innerHTML='<div class="status danger">URL HTTPS de prévisualisation obligatoire.</div>';return}try{const j=await call('bat_send',{id,preview_url:preview});const link=j.bat_url||'';out.innerHTML=`<div class="status ok"><b>LIEN BAT CLIENT — À ENVOYER MAINTENANT</b><input class="batUrl" value="${esc(link)}" readonly><div class="actions" style="margin-top:8px"><button onclick="copyBat('${id}')">COPIER LE LIEN</button><a class="btn" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent('Bonjour, voici votre bon à tirer DIGIYLYFE à vérifier et valider avant règlement : '+link)}">WHATSAPP →</a></div><small>Le token n’est pas stocké en clair. Si ce lien est perdu, créez une nouvelle version BAT.</small></div>`;await load()}catch(e){out.innerHTML='<div class="status danger">'+esc(e.message)+'</div>'}};
window.copyBat=async id=>{const x=$('#link-'+id+' .batUrl');if(x){await navigator.clipboard.writeText(x.value);x.select()}};
window.confirmPayment=async(id,currency,amount)=>{if(!confirm('Confirmer le règlement exact de '+money(amount,currency)+' après BAT accepté ?'))return;try{await call('payment_confirm',{id,currency,amount,payment_method:'preuve client après BAT',note:'Règlement confirmé après BAT accepté'});await load()}catch(e){alert(e.message)}};
$('#refresh').onclick=load;$('#search').addEventListener('input',render);$('#logout').onclick=async()=>{await sb.auth.signOut();location.reload()};
$('#sendCode').onclick=async()=>{const em=$('#email').value.trim();try{const {error}=await sb.auth.signInWithOtp({email:em,options:{shouldCreateUser:false}});if(error)throw error;$('#loginStatus').textContent='Code envoyé. Saisissez les 8 chiffres reçus.'}catch(e){$('#loginStatus').textContent=e.message}};
$('#verifyCode').onclick=async()=>{const em=$('#email').value.trim(),code=$('#otp').value.replace(/\D/g,'').slice(0,8);try{const {error}=await sb.auth.verifyOtp({email:em,token:code,type:'email'});if(error)throw error;await load()}catch(e){$('#loginStatus').textContent=e.message}};
(async()=>{if(await session())await load()})();
})();</script></body></html>
