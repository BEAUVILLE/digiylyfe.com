<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>MASTER FICHE COMMERCE — DIGIYLYFE</title>
<style>
:root{--a:#7b0757;--b:#d8a84e;--ink:#2b1825;--muted:#756672;--bg:#fff8fc;--line:#00000014}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,var(--bg),#f4e9ef);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}a{text-decoration:none;color:inherit}button{font:inherit}.wrap{width:min(1080px,calc(100% - 24px));margin:auto}.top{position:sticky;top:0;z-index:20;background:#fffdfceb;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.topin{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-weight:1000;color:var(--a)}.langs{display:flex;gap:4px;flex-wrap:wrap}.langs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 10px;font-weight:900}.langs button.active{background:var(--a);color:#fff}.hero{padding:18px 0 10px}.heroCard{position:relative;overflow:hidden;min-height:440px;border-radius:34px;display:flex;align-items:flex-end;padding:28px;color:#fff;background:var(--a);box-shadow:0 24px 60px #0002}.heroCard>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}.heroCard:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0002,#000b);z-index:1}.heroCopy{position:relative;z-index:2;max-width:760px}.kicker{font-size:.8rem;font-weight:1000;text-transform:uppercase;color:#ffe8ac}.hero h1{font-size:clamp(2.3rem,8vw,5.2rem);line-height:.9;margin:8px 0}.lead{line-height:1.55;color:#ffffffed}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btn{border:0;border-radius:999px;padding:12px 16px;font-weight:1000;background:#fff;color:#321}.btn.main{background:linear-gradient(135deg,#fff1be,var(--b));color:#2e2107}.section{background:#ffffffdc;border:1px solid var(--line);border-radius:28px;padding:20px;margin:14px 0;box-shadow:0 12px 32px #0001}.section h2{margin:0 0 12px;color:var(--a)}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.product{border:1px solid var(--line);border-radius:20px;overflow:hidden;background:#fff}.product img{width:100%;aspect-ratio:4/3;object-fit:cover;background:#eee}.product .body{padding:13px}.product h3{margin:0 0 5px}.price{font-weight:1000;color:var(--a)}.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:16px}.note{color:var(--muted);line-height:1.55}.bottom{display:grid;grid-template-columns:1fr .8fr;gap:14px}.qr{text-align:center}.qr img{width:min(220px,100%);padding:10px;background:#fff;border-radius:18px}.foot{padding:10px 0 40px;text-align:center;color:var(--muted);font-size:.85rem}@media(max-width:780px){.products{grid-template-columns:1fr 1fr}.gallery{grid-template-columns:1fr 1fr}.bottom{grid-template-columns:1fr}.heroCard{min-height:380px;padding:20px}.topin{align-items:flex-start;padding:8px 0;flex-direction:column}.langs{width:100%}}@media(max-width:520px){.products{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top"><div class="wrap topin"><div class="brand">DIGIYLYFE · COMMERCE</div><div class="langs" id="langs"></div></div></header>
<main class="wrap">
<section class="hero"><div class="heroCard"><img id="photo" alt="Univers du commerce"><div class="heroCopy"><div class="kicker" id="kicker"></div><h1 id="name"></h1><p class="lead" id="lead"></p><div class="actions"><a class="btn main" id="wa">🛍️ Commander / WhatsApp</a><a class="btn" id="call">📞 Appeler</a><button class="btn" id="share">📤 Partager</button></div></div></div></section>
<section class="section"><h2 id="productsTitle">Produits / Sélection</h2><div class="products" id="products"></div></section>
<section class="section" id="galleryPanel"><h2 id="galleryTitle">Photos & univers</h2><div class="gallery" id="gallery"></div></section>
<section class="bottom"><article class="section"><h2 id="aboutTitle">Le commerce</h2><p class="note" id="about"></p><p class="note" id="contactNote"></p><p class="note"><strong>Commande directe · Paiement direct · 0 % commission DIGIYLYFE.</strong></p></article><aside class="section qr" id="qrPanel"><h2>QR</h2><img id="qr" alt="QR fiche"><p class="note" id="url"></p></aside></section>
</main><footer class="foot">MASTER TEST · aucun prix ni produit inventé · validation humaine obligatoire</footer>
<script>
const FICHE={published:false,subscriptionActive:false,name:'COMMERCE EXEMPLE',phone:'+221000000000',whatsapp:'+221000000000',photoUrl:'',finalUrl:'',qrUrl:'',ficheColor:'#7b0757',ficheColor2:'#d8a84e',languages:['fr','en','es','pt','it','de','nl','ar'],i18n:{fr:{job:'Commerce',zone:'Zone générale',lead:'Univers et promesse validés par le commerce.',about:'Présentation du commerce, sans texte inventé.'},en:{job:'Shop',zone:'General area',lead:'Brand universe and promise approved by the shop.',about:'Shop presentation goes here.'}},products:[{name:'Produit 1',price:'',image:''},{name:'Produit 2',price:'',image:''},{name:'Produit 3',price:'',image:''}],gallery:[],contactNote:''};
const $=s=>document.querySelector(s),LANGS=FICHE.languages||['fr'];let lang=new URLSearchParams(location.search).get('lang')||'fr';if(!LANGS.includes(lang))lang='fr';document.documentElement.style.setProperty('--a',FICHE.ficheColor||'#7b0757');document.documentElement.style.setProperty('--b',FICHE.ficheColor2||'#d8a84e');
function data(){return FICHE.i18n?.[lang]||FICHE.i18n?.fr||{}}function cleanPhone(x){return String(x||'').replace(/\D/g,'')}function photoFallback(txt='PHOTO'){return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650"><rect width="100%" height="100%" fill="${FICHE.ficheColor||'#7b0757'}"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="white" font-size="48" font-family="Arial">${txt}</text></svg>`)}
function render(){const d=data();document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';$('#name').textContent=FICHE.name||'';$('#kicker').textContent=[d.job,d.zone].filter(Boolean).join(' · ');$('#lead').textContent=d.lead||'';$('#about').textContent=d.about||'';$('#contactNote').textContent=FICHE.contactNote||'';$('#photo').src=FICHE.photoUrl||photoFallback();$('#wa').href='https://wa.me/'+cleanPhone(FICHE.whatsapp);$('#call').href='tel:'+FICHE.phone;$('#url').textContent=FICHE.finalUrl||'';$('#products').innerHTML=(FICHE.products||[]).map(p=>`<article class="product"><img src="${p.image||photoFallback('PRODUIT')}" alt="${p.name||''}"><div class="body"><h3>${p.name||''}</h3>${p.price?`<div class="price">${p.price}</div>`:''}${p.note?`<p class="note">${p.note}</p>`:''}</div></article>`).join('');const g=FICHE.gallery||[];if(!g.length){$('#galleryPanel').style.display='none'}else{$('#gallery').innerHTML=g.map(x=>`<img src="${x.url||x}" alt="${x.alt||FICHE.name||''}">`).join('')}if(FICHE.qrUrl){$('#qr').src=FICHE.qrUrl}else{$('#qrPanel').style.display='none'}document.querySelectorAll('[data-l]').forEach(b=>b.classList.toggle('active',b.dataset.l===lang));}
$('#langs').innerHTML=LANGS.map(l=>`<button data-l="${l}">${l.toUpperCase()}</button>`).join('');document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{lang=b.dataset.l;history.replaceState(null,'','?lang='+lang);render()});$('#share').onclick=async()=>{const u=FICHE.finalUrl||location.href;try{if(navigator.share)await navigator.share({title:FICHE.name,url:u});else await navigator.clipboard.writeText(u)}catch{}};render();
</script>
</body></html>
