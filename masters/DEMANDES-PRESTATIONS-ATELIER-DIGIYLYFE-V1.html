<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>DIGIYLYFE — Demandes Fiche & Site</title><style>:root{--bg:#06140f;--panel:#0b2119;--gold:#f6c453;--green:#22c55e;--txt:#fffaf0;--soft:#c8d6cf;--line:#ffffff24;--red:#ef4444}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#075b32,#06140f 35%);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{width:min(1080px,calc(100% - 22px));margin:auto;padding:16px 0 50px}.hero,.box,.card{border:1px solid var(--line);border-radius:22px;background:#071a13ee;box-shadow:0 16px 42px #0004}.hero,.box{padding:18px;margin-bottom:12px}.hero h1{margin:5px 0;font-size:clamp(31px,6vw,50px)}.note{color:var(--soft);line-height:1.45}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:grid;gap:6px;font-size:12px;font-weight:900;color:#ffe9a8}input,select{width:100%;border:1px solid var(--line);border-radius:12px;background:#06140f;color:#fff;padding:11px;font:inherit}button,a.btn{border:1px solid var(--line);border-radius:999px;background:#ffffff0d;color:#fff;padding:10px 13px;font:inherit;font-weight:1000;cursor:pointer;text-decoration:none}.primary{background:linear-gradient(135deg,#fff1bd,var(--gold),var(--green));color:#06140f!important}.actions,.filters{display:flex;gap:8px;flex-wrap:wrap}.status{margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:14px;font-weight:850}.ok{border-color:#22c55e77;background:#22c55e12}.bad{border-color:#ef444477;background:#ef444412}.list{display:grid;gap:10px}.card{padding:15px}.head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.tag{display:inline-block;padding:6px 9px;border-radius:999px;background:#f6c45318;border:1px solid #f6c45355;color:#ffe9a8;font-size:11px;font-weight:1000}.price{font-weight:1000;color:#ffe9a8}.meta{color:var(--soft);font-size:12px;line-height:1.45}.details{white-space:pre-wrap;margin:10px 0;color:#f7f1e6}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row select{width:auto;min-width:160px}@media(max-width:700px){.grid{grid-template-columns:1fr}.head{flex-direction:column}.row select{width:100%}}</style></head><body><main class="wrap"><section class="hero"><small style="font-weight:1000;color:#ffe9a8">ATELIER DIGIYLYFE · DEMANDES COMMERCIALES</small><h1>Fiches & Sites</h1><p class="note">📄 Fiche professionnelle : 100 000 FCFA · 🌐 Site : à partir de 550 000 FCFA. Demande ≠ paiement ≠ fabrication. L’humain décide.</p></section><section class="box" id="loginBox"><h2>Connexion atelier</h2><div class="grid"><label>Email atelier<input id="email" type="email" value="baptistejb24@gmail.com"></label><label>Code reçu<input id="otp" inputmode="numeric" maxlength="8"></label></div><div class="actions" style="margin-top:10px"><button id="sendCode">RECEVOIR LE CODE</button><button class="primary" id="verifyCode">VALIDER LE CODE</button><a class="btn" href="./ADHESIONS-ATELIER-DIGIYLYFE-V1.html">ADHÉSIONS</a><a class="btn" href="./GENERATEUR-ATELIER-FICHE-DIGIYLYFE-V1.html">GÉNÉRATEUR FICHE</a></div><div id="loginStatus" class="status">Une session déjà ouverte sera réutilisée.</div></section><section class="box"><div class="filters"><button class="primary" data-filter="all">TOUTES</button><button data-filter="fiche">📄 FICHES</button><button data-filter="site">🌐 SITES</button><button id="refresh">ACTUALISER</button></div><div id="summary" class="status">Chargement…</div></section><section id="list" class="list"></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const U='https://wesqmwjjtsefyjnluosj.supabase.co',K='sb_publishable_tGHItRgeWDmGjnd0CK1DVQ_BIep4Ug3',sb=window.supabase.createClient(U,K),$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let rows=[],filter='all';
async function session(){return(await sb.auth.getSession()).data.session}async function api(action,payload={}){const s=await session();if(!s)throw Error('Session atelier absente.');const r=await fetch(U+'/functions/v1/digiy-service-inbox',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.access_token,'apikey':K},body:JSON.stringify({action,...payload})});const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok)throw Error(j.error||j.detail||'Erreur atelier');return j}
const money=n=>new Intl.NumberFormat('fr-FR').format(Number(n||0))+' FCFA',date=x=>x?new Date(x).toLocaleString('fr-FR'):'—',safe=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const labels={nouvelle:'NOUVELLE',a_contacter:'À CONTACTER',devis:'DEVIS',acceptee:'ACCEPTÉE',refusee:'REFUSÉE',en_cours:'EN COURS',livree:'LIVRÉE',archivee:'ARCHIVÉE'};
function render(){const data=filter==='all'?rows:rows.filter(x=>x.request_type===filter);$('#summary').className='status ok';$('#summary').textContent=`${rows.length} demande(s) · ${rows.filter(x=>x.request_type==='fiche').length} fiche(s) · ${rows.filter(x=>x.request_type==='site').length} site(s)`;$('#list').innerHTML=data.length?data.map(r=>`<article class="card"><div class="head"><div><span class="tag">${r.request_type==='site'?'🌐 SITE':'📄 FICHE'}</span><h2 style="margin:8px 0 3px">${safe(r.requester_name)}</h2><div class="meta">${safe(r.activity_label)} · ${safe(r.zone_label)} · ${date(r.created_at)}</div></div><div class="price">${r.request_type==='site'?'À partir de ':''}${money(r.starting_price_xof)}</div></div><div class="details">${safe(r.details||'Aucun détail complémentaire.')}</div><div class="meta">📞 ${safe(r.phone)} · 💬 ${safe(r.whatsapp)}${r.current_site_url?` · 🌐 ${safe(r.current_site_url)}`:''}</div><div class="row" style="margin-top:12px"><select data-id="${r.id}">${Object.entries(labels).map(([v,l])=>`<option value="${v}" ${v===r.status?'selected':''}>${l}</option>`).join('')}</select><button class="primary" data-save="${r.id}">ENREGISTRER LE STATUT</button>${r.request_type==='fiche'?'<a class="btn" href="./GENERATEUR-ATELIER-FICHE-DIGIYLYFE-V1.html">OUVRIR GÉNÉRATEUR FICHE</a>':''}</div></article>`).join(''):'<section class="box"><strong>Aucune demande pour ce filtre.</strong></section>';$$('[data-save]').forEach(b=>b.onclick=()=>save(b.dataset.save))}
async function load(){try{const j=await api('list');rows=j.requests||[];render()}catch(e){$('#summary').className='status bad';$('#summary').textContent=e.message}}
async function save(id){try{const s=$(`select[data-id="${id}"]`);await api('set_status',{id,status:s.value});await load()}catch(e){alert(e.message)}}
$$('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;$$('[data-filter]').forEach(x=>x.classList.toggle('primary',x===b));render()});$('#refresh').onclick=load;
$('#sendCode').onclick=async()=>{try{const email=$('#email').value.trim();if(!email)throw Error('Email requis.');const {error}=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:false}});if(error)throw error;$('#loginStatus').className='status ok';$('#loginStatus').textContent='Code envoyé.'}catch(e){$('#loginStatus').className='status bad';$('#loginStatus').textContent=e.message}};
$('#verifyCode').onclick=async()=>{try{const email=$('#email').value.trim(),token=$('#otp').value.trim();const {error}=await sb.auth.verifyOtp({email,token,type:'email'});if(error)throw error;$('#loginStatus').className='status ok';$('#loginStatus').textContent='Atelier connecté.';await load()}catch(e){$('#loginStatus').className='status bad';$('#loginStatus').textContent=e.message}};
(async()=>{if(await session()){$('#loginStatus').className='status ok';$('#loginStatus').textContent='Session atelier active.';await load()}else{$('#summary').textContent='Connectez l’atelier pour lire les demandes.'}})();
</script></body></html>
