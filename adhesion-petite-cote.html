fr:{ey:'PASSAGE EN DIGIY PRO · PETITE CÔTE',title:'Prenez votre place dans DIGIY PETITE CÔTE.',lead:'La carte DIGIY est gratuite pour entrer dans le réseau. Pour passer en professionnel, commencez par envoyer votre dossier de fiche : aucun règlement n’est demandé avant la préparation de votre fiche, sa présentation et votre accord.',sheetPriceLabel:'CRÉATION DE VOTRE FICHE PROFESSIONNELLE · AVANT RÈGLEMENT',proPriceLabel:'ADHÉSION DIGIY PRO · DÉMARRE À L’ACTIVATION DE VOTRE FICHE',clarity:'Ordre du parcours : RENSEIGNEMENTS → VALIDATION → CRÉATION / PRÉSENTATION DE LA FICHE → ACCORD DU PRO → PAIEMENT → MISE EN LIGNE + ACTIVATION PRO. Votre accès propriétaire sécurisé est rattaché à la fiche professionnelle.',s1:'ÉTAPE 1 · AVANT TOUT RÈGLEMENT',fileTitle:'Envoyer votre dossier professionnel',fileText:'Renseignez votre activité, vos services, votre photo et votre zone Petite Côte. DIGIYLYFE contrôle humainement le dossier. Aucune preuve de paiement n’est demandée à cette étape.',fileBtn:'PRÉPARER ET ENVOYER MON DOSSIER →',s2:'ÉTAPE 2 · CRÉATION ET ACCORD AVANT PAIEMENT',payTitle:'Recevoir et valider votre fiche avant de payer',payText:'Après validation du dossier, DIGIYLYFE prépare votre fiche et vous la présente. Vous demandez les corrections nécessaires puis donnez votre accord. Le règlement intervient seulement après cet accord. La fiche est ensuite mise en ligne et DIGIY PRO à 19 900 FCFA / mois démarre avec son activation.',payState:'PAIEMENT UNIQUEMENT APRÈS VOTRE ACCORD SUR LA FICHE',note:'Aucune fiche professionnelle n’est créée ou publiée automatiquement. Le règlement intervient seulement après préparation, présentation et accord du professionnel sur sa fiche.',back:'← DIGIY SALY',professional:'PROFESSIONNEL'},
