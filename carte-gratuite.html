function cardRequestMetadata(language){
 const isParis=requestedTerritory==='paris'&&country.value==='FR';
 const isMiami=requestedTerritory==='miami'&&country.value==='US';
 const place=isParis?'DIGIY PARIS':isMiami?'DIGIY MIAMI':'';
 const category=isParis?PARIS_SIGNATURES:isMiami?MIAMI_SIGNATURES:null;
 const module=category&&Object.prototype.hasOwnProperty.call(category,requestedNeed)?requestedNeed:'';
 const signature=category&&Object.prototype.hasOwnProperty.call(category,requestedNeed)?category[requestedNeed]:'';
 const arrondissement=isParis&&/^paris-(0[1-9]|1[0-9]|20)$/.test(qp.get('arr')||'')?qp.get('arr'):'';
 const quartier=(isParis||isMiami)?(qp.get('quartier')||'').trim().slice(0,60):'';
 const origin=[place,signature,arrondissement&&'Arrondissement : '+arrondissement,quartier&&'Quartier : '+quartier].filter(Boolean);
 const note=(about.value||'').trim();
 // Le serveur V10 ramène actuellement WO/ZH à FR dans source_lang.
 // Le choix originel reste ainsi visible dans la description métier enregistrée.
 if(language==='wo'||language==='zh')origin.push('Langue demandée : '+language.toUpperCase());
 return {requested_module:module||null,activity_summary:origin.concat(note?[note]:[]).join('\n')};
}
